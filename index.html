<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

    }


    /* ========================================
       LOADING SCREEN
       ======================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      /*
      Loading Fade Out = 1.5秒
      */

      transition: opacity 1.5s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      pointer-events: none;

    }


    /* ========================================
       LOADING VIDEO
       ======================================== */

    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

    }



    /* ========================================
       ENTER BUTTON
       ======================================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 60px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 14px 28px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      display: none;

      cursor: pointer;

    }



    /* ========================================
       A-FRAME
       ======================================== */

    a-scene {

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <!-- ========================================
       LOADING VIDEO
       ======================================== -->

  <div id="loadingScreen">

    <video
      id="loadingVideo"

      autoplay
      muted
      loop

      playsinline
      webkit-playsinline

      preload="auto">

      <source
        src="loading.mp4"
        type="video/mp4">

    </video>

  </div>



  <!-- ========================================
       BACKGROUND MUSIC
       ======================================== -->

  <audio
    id="backgroundMusic"

    src="christmassong2025.mp3"

    preload="auto"

    loop>

  </audio>



  <!-- ========================================
       FALLBACK BUTTON
       ======================================== -->

  <button id="startButton">

    進入 360° 場景

  </button>



  <!-- ========================================
       360 SCENE
       ======================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    loading-screen="enabled: false">


    <!-- ========================================
         ASSETS
         ======================================== -->

    <a-assets timeout="60000">


      <video

        id="christmasVideo"

        src="Christmas ar_v1.mp4"

        preload="auto"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>


    </a-assets>



    <!-- ========================================
         360 VIDEO SPHERE
         ======================================== -->

    <a-videosphere

      src="#christmasVideo"

      rotation="0 -90 0">

    </a-videosphere>



    <!-- ========================================
         CAMERA
         ======================================== -->

    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>



  <script>


    /* ========================================
       ELEMENTS
       ======================================== */


    const loadingScreen =
      document.querySelector('#loadingScreen');


    const loadingVideo =
      document.querySelector('#loadingVideo');


    const christmasVideo =
      document.querySelector('#christmasVideo');


    const backgroundMusic =
      document.querySelector('#backgroundMusic');


    const startButton =
      document.querySelector('#startButton');


    const camera =
      document.querySelector('#camera');



    /* ========================================
       LOADING SETTINGS
       ======================================== */


    /*
    Loading最少播放時間

    3000ms = 3秒
    */

    const MIN_LOADING_TIME = 3000;


    /*
    Loading Fade Out

    1500ms = 1.5秒
    */

    const FADE_TIME = 1500;


    /*
    記錄Loading開始時間
    */

    const loadingStartTime =
      Date.now();


    /*
    場景是否已開始
    */

    let sceneStarted = false;


    /*
    360影片是否真正Ready
    */

    let videoReady = false;


    /*
    避免重複建立進場Timer
    */

    let enterTimer = null;



    /* ========================================
       BACKGROUND MUSIC SETTINGS
       ======================================== */


    /*
    音樂最終音量

    0.6 = 60%
    */

    const MUSIC_TARGET_VOLUME = 0.6;


    /*
    音樂Fade In時間

    2000ms = 2秒
    */

    const MUSIC_FADE_TIME = 2000;


    /*
    音樂是否已經成功開始播放
    */

    let musicStarted = false;


    /*
    Fade In Timer
    */

    let musicFadeTimer = null;



    /* ========================================
       MUSIC FADE IN
       ======================================== */


    function fadeInBackgroundMusic() {


      /*
      清除舊Timer
      */

      clearInterval(musicFadeTimer);


      /*
      Fade分成40步
      */

      const steps = 40;


      /*
      每一步時間
      */

      const interval =
        MUSIC_FADE_TIME / steps;


      /*
      每一步增加的音量
      */

      const volumeStep =
        MUSIC_TARGET_VOLUME / steps;


      /*
      由0開始
      */

      backgroundMusic.volume = 0;



      musicFadeTimer = setInterval(

        function() {


          let newVolume =

            backgroundMusic.volume +

            volumeStep;



          /*
          到達60%
          */

          if (newVolume >= MUSIC_TARGET_VOLUME) {


            backgroundMusic.volume =
              MUSIC_TARGET_VOLUME;


            clearInterval(
              musicFadeTimer
            );


            return;

          }



          /*
          繼續增加音量
          */

          backgroundMusic.volume =
            newVolume;


        },

        interval

      );


    }



    /* ========================================
       START BACKGROUND MUSIC
       ======================================== */


    function startBackgroundMusic() {


      /*
      如果已經播放
      不再重新開始
      */

      if (musicStarted) {

        return;

      }


      /*
      先設為0音量
      */

      backgroundMusic.volume = 0;



      const musicPromise =

        backgroundMusic.play();



      if (musicPromise !== undefined) {


        musicPromise

          .then(

            function() {


              /*
              音樂成功開始
              */

              musicStarted = true;


              /*
              開始2秒Fade In
              */

              fadeInBackgroundMusic();


            }

          )


          .catch(

            function() {


              /*
              iPhone Safari可能阻止
              有聲音自動播放。

              不做任何事，
              等使用者第一次觸碰。
              */


            }

          );


      }


    }



    /* ========================================
       ENTER SCENE
       ======================================== */


    function tryEnterScene() {


      /*
      已經進場
      或360影片未Ready
      就不處理
      */

      if (sceneStarted || !videoReady) {

        return;

      }


      /*
      Loading已播放多久
      */

      const elapsed =

        Date.now() -

        loadingStartTime;


      /*
      如果未夠3秒，
      計算仍需等待多久
      */

      const remaining =

        Math.max(

          0,

          MIN_LOADING_TIME - elapsed

        );


      /*
      避免建立重複Timer
      */

      if (enterTimer !== null) {

        return;

      }



      enterTimer =

        setTimeout(

          function() {


            if (sceneStarted) {

              return;

            }


            sceneStarted = true;



            /* ==================================
               開始 Loading Fade Out
               ================================== */


            loadingScreen
              .classList
              .add('hide');



            /*
            Loading開始淡出時
            嘗試開始背景音樂
            */

            startBackgroundMusic();



            /*
            隱藏進入按鈕
            */

            startButton.style.display =
              'none';



            /*
            Fade Out完成後
            才真正移除Loading
            */

            setTimeout(

              function() {


                loadingVideo.pause();


                loadingScreen.style.display =
                  'none';


              },

              FADE_TIME + 100

            );


          },

          remaining

        );


    }



    /* ========================================
       PLAY 360 VIDEO
       ======================================== */


    function playChristmasVideo() {


      christmasVideo.muted = true;


      const playPromise =

        christmasVideo.play();



      if (playPromise !== undefined) {


        playPromise

          .then(

            function() {


              /*
              Play成功。

              真正Ready會由
              playing event確認。
              */


            }

          )


          .catch(

            function() {


              /*
              Safari阻止Autoplay時
              顯示進入按鈕
              */

              startButton.style.display =
                'block';


            }

          );


      }


    }



    /* ========================================
       360 VIDEO EVENTS
       ======================================== */


    /*
    第一個Frame已下載
    */

    christmasVideo.addEventListener(

      'loadeddata',

      function() {


        playChristmasVideo();


      }

    );



    /*
    Safari認為影片已經可以播放
    */

    christmasVideo.addEventListener(

      'canplay',

      function() {


        playChristmasVideo();


      }

    );



    /*
    360影片真正開始播放
    */

    christmasVideo.addEventListener(

      'playing',

      function() {


        videoReady = true;


        tryEnterScene();


      }

    );



    /* ========================================
       ENTER BUTTON
       ======================================== */


    startButton.addEventListener(

      'click',

      function() {


        christmasVideo.muted = true;



        /*
        按鈕是使用者主動操作，
        同時嘗試啟動音樂
        */

        startBackgroundMusic();



        christmasVideo

          .play()

          .then(

            function() {


              videoReady = true;


              tryEnterScene();


            }

          )


          .catch(

            function() {


              startButton.style.display =
                'block';


            }

          );


      }

    );



    /* ========================================
       FIRST TOUCH
       ======================================== */


    document.addEventListener(

      'touchstart',

      function() {


        /*
        如果Loading影片未播放
        嘗試播放
        */

        if (loadingVideo.paused) {


          loadingVideo.muted = true;


          loadingVideo

            .play()

            .catch(() => {});


        }



        /*
        如果360影片未播放
        嘗試播放
        */

        if (christmasVideo.paused) {


          christmasVideo.muted = true;


          christmasVideo

            .play()

            .catch(

              function() {


                startButton.style.display =
                  'block';


              }

            );


        }



        /*
        iPhone Safari：

        使用者第一次觸碰畫面時
        嘗試播放背景音樂
        */

        if (!musicStarted) {


          startBackgroundMusic();


        }


      },

      {

        once: true,

        passive: true

      }

    );



    /* ========================================
       DESKTOP FIRST CLICK
       ======================================== */


    document.addEventListener(

      'click',

      function() {


        /*
        Desktop第一次Click
        嘗試播放音樂
        */

        if (!musicStarted) {


          startBackgroundMusic();


        }


      },

      {

        once: true

      }

    );



    /* ========================================
       INITIAL LOAD
       ======================================== */


    window.addEventListener(

      'load',

      function() {


        /*
        播放Loading動畫
        */

        loadingVideo.muted = true;


        loadingVideo

          .play()

          .catch(() => {});



        /*
        預先載入背景音樂
        */

        backgroundMusic.load();



        /*
        開始載入360影片
        */

        christmasVideo.load();



        /*
        0.5秒後嘗試播放360影片
        */

        setTimeout(

          function() {


            playChristmasVideo();


          },

          500

        );


      }

    );



    /* ========================================
       PINCH ZOOM SETTINGS
       ======================================== */


    /*
    開場FOV

    越大 = 看得越遠
    */

    let currentFov = 105;


    /*
    最大Zoom In
    */

    const minFov = 35;


    /*
    最大Zoom Out
    */

    const maxFov = 120;


    let previousDistance = null;



    /* ========================================
       PINCH START
       ======================================== */


    document.addEventListener(

      'touchstart',

      function(event) {


        if (event.touches.length === 2) {


          const dx =

            event.touches[0].clientX -

            event.touches[1].clientX;


          const dy =

            event.touches[0].clientY -

            event.touches[1].clientY;


          previousDistance =

            Math.sqrt(

              dx * dx +

              dy * dy

            );


        }


      },

      {

        passive: false

      }

    );



    /* ========================================
       PINCH MOVE
       ======================================== */


    document.addEventListener(

      'touchmove',

      function(event) {


        if (event.touches.length !== 2) {

          return;

        }


        event.preventDefault();



        const dx =

          event.touches[0].clientX -

          event.touches[1].clientX;


        const dy =

          event.touches[0].clientY -

          event.touches[1].clientY;


        const distance =

          Math.sqrt(

            dx * dx +

            dy * dy

          );



        if (previousDistance !== null) {


          const difference =

            distance -

            previousDistance;



          /*
          手指拉開
          = Zoom In
          */

          currentFov -=

            difference * 0.12;



          /*
          限制FOV
          */

          currentFov =

            Math.max(

              minFov,

              Math.min(

                maxFov,

                currentFov

              )

            );



          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


        }



        previousDistance = distance;


      },

      {

        passive: false

      }

    );



    /* ========================================
       PINCH END
       ======================================== */


    document.addEventListener(

      'touchend',

      function(event) {


        if (event.touches.length < 2) {


          previousDistance = null;


        }


      }

    );



    /* ========================================
       DESKTOP MOUSE WHEEL ZOOM
       ======================================== */


    document.addEventListener(

      'wheel',

      function(event) {


        event.preventDefault();



        currentFov +=

          event.deltaY * 0.05;



        currentFov =

          Math.max(

            minFov,

            Math.min(

              maxFov,

              currentFov

            )

          );



        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );


      },

      {

        passive: false

      }

    );


  </script>


</body>

</html>
