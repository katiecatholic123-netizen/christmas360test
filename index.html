<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;
    }


    a-scene {
      width: 100%;
      height: 100%;
    }


    /* Safari 如果阻止自動播放，
       就會顯示這個按鈕 */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 40px;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 13px 26px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 16px;

      cursor: pointer;

      display: none;
    }

  </style>

</head>


<body>


  <!-- ==============================
       PLAY BUTTON
       ============================== -->

  <button id="startButton">
    Start
  </button>



  <!-- ==============================
       A-FRAME
       ============================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    loading-screen="
      enabled: true;
      backgroundColor: #000000;
      dotsColor: #FFFFFF;">




    <!-- ==============================
         ASSETS
         ============================== -->

    <a-assets timeout="60000">


      <video

        id="christmasVideo"

        src="christmas360.mp4"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        preload="auto"

        crossorigin="anonymous">

      </video>


    </a-assets>




    <!-- ==============================
         360° VIDEO
         ============================== -->

    <a-videosphere

      id="videoSphere"

      src="#christmasVideo"

      rotation="0 -90 0"

      material="
        shader: flat;
        side: back;">

    </a-videosphere>




    <!-- ==============================
         CAMERA
         ============================== -->

    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>




  <script>


    /* ==========================================
       VIDEO
       ========================================== */


    const video =
      document.querySelector('#christmasVideo');


    const startButton =
      document.querySelector('#startButton');




    /* ---------- Play Video ---------- */


    function startVideo() {


      video.muted = true;


      const playPromise =
        video.play();



      if (playPromise !== undefined) {


        playPromise

          .then(() => {


            console.log(
              '360 video started'
            );


            startButton.style.display =
              'none';


          })


          .catch((error) => {


            console.log(
              'Autoplay blocked',
              error
            );


            startButton.style.display =
              'block';


          });


      }


    }




    /* ---------- Auto Start ---------- */


    window.addEventListener(
      'load',
      function() {


        setTimeout(
          startVideo,
          500
        );


      }
    );




    /* ---------- Start Button ---------- */


    startButton.addEventListener(
      'click',
      function() {


        video.muted = true;


        video.play();


        startButton.style.display =
          'none';


      }
    );




    /* ---------- First Touch ---------- */


    document.addEventListener(

      'touchstart',

      function() {


        if (video.paused) {


          video.muted = true;


          video.play();


        }


      },

      {
        once: true
      }

    );




    /* ==========================================
       CAMERA ZOOM
       ========================================== */


    const camera =
      document.querySelector('#camera');



    /*
       初始畫面

       數字越大 = 看得越遠 / 越廣
       數字越小 = Zoom In
    */


    let currentFov = 105;



    /*
       最大 / 最小 Zoom
    */


    const minFov = 35;

    const maxFov = 120;



    let previousDistance = null;




    /* ==========================================
       MOBILE PINCH START
       ========================================== */


    document.addEventListener(

      'touchstart',

      function(event) {


        if (
          event.touches.length === 2
        ) {


          const dx =

            event.touches[0].clientX -

            event.touches[1].clientX;



          const dy =

            event.touches[0].clientY -

            event.touches[1].clientY;



          previousDistance =

            Math.sqrt(

              dx * dx +

              dy * dy

            );


        }


      },

      {
        passive: false
      }

    );




    /* ==========================================
       MOBILE PINCH ZOOM
       ========================================== */


    document.addEventListener(

      'touchmove',

      function(event) {


        if (
          event.touches.length !== 2
        ) {

          return;

        }



        event.preventDefault();



        const dx =

          event.touches[0].clientX -

          event.touches[1].clientX;



        const dy =

          event.touches[0].clientY -

          event.touches[1].clientY;



        const distance =

          Math.sqrt(

            dx * dx +

            dy * dy

          );



        if (
          previousDistance !== null
        ) {


          const difference =

            distance -

            previousDistance;



          /*
             手指拉開
             → Zoom In
          */


          currentFov -=

            difference * 0.12;



          /*
             限制 FOV
          */


          currentFov =

            Math.max(

              minFov,

              Math.min(

                maxFov,

                currentFov

              )

            );



          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


        }



        previousDistance =
          distance;


      },

      {
        passive: false
      }

    );




    /* ==========================================
       PINCH END
       ========================================== */


    document.addEventListener(

      'touchend',

      function(event) {


        if (
          event.touches.length < 2
        ) {


          previousDistance =
            null;


        }


      }

    );




    /* ==========================================
       DESKTOP MOUSE WHEEL ZOOM
       ========================================== */


    document.addEventListener(

      'wheel',

      function(event) {


        event.preventDefault();



        currentFov +=

          event.deltaY * 0.05;



        currentFov =

          Math.max(

            minFov,

            Math.min(

              maxFov,

              currentFov

            )

          );



        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );


      },

      {
        passive: false
      }

    );



  </script>


</body>
</html>
