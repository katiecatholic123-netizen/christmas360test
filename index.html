<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Christmas 360</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      touch-action: none;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>

</head>

<body>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  loading-screen="enabled: true">

  <!-- ==============================
       360°背景圖片
  =============================== -->

  <a-assets timeout="20000">

    <img
      id="christmas360"
      src="christmas360b.jpg">

  </a-assets>


  <!-- ==============================
       360° Equirectangular 場景
  =============================== -->

  <a-sky
    src="#christmas360"
    rotation="0 -90 0">
  </a-sky>


  <!-- ==============================
       Camera
  =============================== -->

  <a-camera
    id="camera"
    position="0 0 0"
    camera="fov: 80"
    look-controls="
      magicWindowTrackingEnabled: true;
      touchEnabled: true;
      mouseEnabled: true;">
  </a-camera>

</a-scene>


<script>

  const camera = document.querySelector('#camera');

  // 初始視野
  let currentFov = 80;

  // 最大及最小 Zoom
  const minFov = 35;
  const maxFov = 100;


  // ==============================
  // iPhone / Android
  // 雙指 Pinch Zoom
  // ==============================

  let previousDistance = null;

  document.addEventListener('touchstart', function(event) {

    if (event.touches.length === 2) {

      const dx =
        event.touches[0].clientX -
        event.touches[1].clientX;

      const dy =
        event.touches[0].clientY -
        event.touches[1].clientY;

      previousDistance =
        Math.sqrt(dx * dx + dy * dy);

    }

  });


  document.addEventListener('touchmove', function(event) {

    if (event.touches.length !== 2) {
      return;
    }

    event.preventDefault();

    const dx =
      event.touches[0].clientX -
      event.touches[1].clientX;

    const dy =
      event.touches[0].clientY -
      event.touches[1].clientY;

    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if (previousDistance !== null) {

      const difference =
        distance - previousDistance;

      // 雙指拉開 = 放大
      // 雙指合起 = 縮小

      currentFov -= difference * 0.12;

      currentFov = Math.max(
        minFov,
        Math.min(maxFov, currentFov)
      );

      camera.setAttribute(
        'camera',
        'fov',
        currentFov
      );

    }

    previousDistance = distance;

  }, { passive: false });


  document.addEventListener('touchend', function(event) {

    if (event.touches.length < 2) {
      previousDistance = null;
    }

  });


  // ==============================
  // 電腦滑鼠滾輪 Zoom
  // ==============================

  document.addEventListener(
    'wheel',
    function(event) {

      event.preventDefault();

      currentFov += event.deltaY * 0.05;

      currentFov = Math.max(
        minFov,
        Math.min(maxFov, currentFov)
      );

      camera.setAttribute(
        'camera',
        'fov',
        currentFov
      );

    },
    { passive: false }
  );

</script>

</body>

</html>
