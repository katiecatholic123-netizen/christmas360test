<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

    }


    /* ========================================
       LOADING SCREEN
       ======================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      transition: opacity 1.5s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      pointer-events: none;

    }


    /* ========================================
       LOADING VIDEO
       ======================================== */

    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

    }


    /* ========================================
       ENTER BUTTON
       ======================================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 100px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 14px 28px;

      border: none;
      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      display: none;

      cursor: pointer;

      white-space: nowrap;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

    }


    /* ========================================
       A-FRAME
       ======================================== */

    a-scene {

      width: 100%;
      height: 100%;

    }


    /* ========================================
       WISH BUTTON
       ======================================== */

    #wishButton {

      position: fixed;

      right:
        calc(
          18px +
          env(safe-area-inset-right, 0px)
        );

      bottom:
        calc(
          26px +
          env(safe-area-inset-bottom, 0px)
        );

      z-index: 10001;

      display: none;

      align-items: center;

      gap: 6px;

      padding: 12px 22px;

      border: none;

      border-radius: 30px;

      background:
        rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 0 0 1px
        rgba(255,215,120,0.55),

        0 4px 18px
        rgba(255,200,90,0.35);

      opacity: 0;

      transform:
        translateY(12px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;

      -webkit-tap-highlight-color:
        transparent;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

    }


    #wishButton.show {

      opacity: 1;

      transform:
        translateY(0);

      animation:
        wishGlow
        3.2s
        ease-in-out
        0.6s
        infinite;

    }


    #wishButton:active {

      transform:
        scale(0.96);

    }


    #wishButton .wishIcon {

      color: #d9a520;

      font-size: 18px;

      line-height: 1;

    }


    .wishButtonText {

      display: flex;

      flex-direction: column;

      align-items: center;

      line-height: 1.05;

    }


    .wishButtonZh {

      font-size: 16px;

    }


    .wishButtonEn {

      margin-top: 3px;

      font-size: 9px;

      letter-spacing: 0.8px;

      opacity: 0.72;

      text-transform: uppercase;

    }


    @keyframes wishGlow {

      0%,
      100% {

        box-shadow:

          0 0 0 1px
          rgba(255,215,120,0.55),

          0 4px 18px
          rgba(255,200,90,0.30);

      }


      50% {

        box-shadow:

          0 0 0 1px
          rgba(255,215,120,0.85),

          0 4px 26px
          rgba(255,200,90,0.60);

      }

    }


    /* ========================================
       WISH OVERLAY
       ======================================== */

    #wishOverlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 10002;

      display: none;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      padding:

        calc(
          16px +
          env(safe-area-inset-top, 0px)
        )

        calc(
          16px +
          env(safe-area-inset-right, 0px)
        )

        calc(
          16px +
          env(safe-area-inset-bottom, 0px)
        )

        calc(
          16px +
          env(safe-area-inset-left, 0px)
        );

      background:
        rgba(0,0,0,0.35);

      -webkit-backdrop-filter:
        blur(2px);

      backdrop-filter:
        blur(2px);

      opacity: 0;

      transition:
        opacity 0.25s ease;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

    }


    #wishOverlay.open {

      opacity: 1;

    }


    /* ========================================
       WISH PANEL
       ======================================== */

    #wishPanel {

      width: 100%;

      max-width: 360px;

      box-sizing: border-box;

      padding:
        20px 18px 16px;

      border-radius: 22px;

      background:
        rgba(255,255,255,0.95);

      color: #222;

      box-shadow:

        0 0 0 1px
        rgba(255,215,120,0.6),

        0 10px 40px
        rgba(0,0,0,0.35);

      transform:
        translateY(10px)
        scale(0.98);

      transition:
        transform 0.25s ease;

    }


    #wishOverlay.open
    #wishPanel {

      transform:
        translateY(0)
        scale(1);

    }


    #wishTitle {

      margin:
        0 0 15px;

      text-align: center;

      font-weight: 600;

      color: #a8750a;

    }


    .wishTitleZh {

      display: block;

      font-size: 20px;

      letter-spacing: 2px;

    }


    .wishTitleEn {

      display: block;

      margin-top: 5px;

      font-size: 10px;

      letter-spacing: 1.8px;

      font-weight: 500;

      opacity: 0.68;

    }


    /* ========================================
       WISH TEXTAREA
       ======================================== */

    #wishText {

      width: 100%;

      box-sizing: border-box;

      min-height: 100px;

      resize: none;

      padding: 13px 14px;

      border:
        1px solid
        rgba(180,145,70,0.35);

      border-radius: 14px;

      outline: none;

      background:
        rgba(255,255,255,0.86);

      color: #222;

      font-size: 16px;

      line-height: 1.55;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      -webkit-appearance: none;

      appearance: none;

      touch-action: auto;

    }


    #wishText:focus {

      border-color:
        rgba(205,160,50,0.75);

      box-shadow:
        0 0 0 3px
        rgba(255,210,90,0.13);

    }


    #wishCount {

      margin-top: 6px;

      text-align: right;

      font-size: 11px;

      color: #777;

    }


    /* ========================================
       WISH NOTE
       ======================================== */

    #wishNote {

      margin-top: 11px;

      text-align: center;

      color: #777;

    }


    .wishNoteZh {

      display: block;

      font-size: 11px;

    }


    .wishNoteEn {

      display: block;

      margin-top: 2px;

      font-size: 9px;

    }


    /* ========================================
       WISH ACTIONS
       ======================================== */

    #wishActions {

      display: flex;

      gap: 10px;

      margin-top: 15px;

    }


    #wishActions button {

      flex: 1;

      padding:
        11px 10px;

      border: none;

      border-radius: 14px;

      font-size: 14px;

      cursor: pointer;

      font-family:
        inherit;

      touch-action:
        manipulation;

      -webkit-tap-highlight-color:
        transparent;

    }


    #wishCancel {

      background:
        #eeeeee;

      color:
        #555;

    }


    #wishSubmit {

      background:
        linear-gradient(
          135deg,
          #e6bd55,
          #bd8413
        );

      color:
        white;

    }


    #wishSubmit:disabled {

      opacity: 0.45;

      cursor: default;

    }


    /* ========================================
       WISH TOAST
       ======================================== */

    #wishToast {

      position: fixed;

      left: 50%;

      top:
        calc(
          24px +
          env(safe-area-inset-top, 0px)
        );

      transform:
        translateX(-50%)
        translateY(-15px);

      z-index: 10003;

      box-sizing: border-box;

      width:
        calc(100% - 40px);

      max-width: 330px;

      padding:
        11px 18px;

      border-radius: 18px;

      background:
        rgba(255,255,255,0.94);

      color:
        #9b6c0a;

      text-align:
        center;

      font-size:
        15px;

      line-height:
        1.35;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,0.25);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;

    }


    #wishToast.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);

    }

  </style>

</head>


<body>


  <!-- ========================================
       LOADING SCREEN
       ======================================== -->

  <div id="loadingScreen">

    <video
      id="loadingVideo"
      src="loading_v2.mp4"
      autoplay
      muted
      playsinline
      webkit-playsinline>
    </video>


    <button
      id="startButton"
      type="button">

      進入360°體驗
      <br>

      <span
        style="
          font-size:10px;
          opacity:0.7;
          letter-spacing:1px;
        ">

        ENTER 360° EXPERIENCE

      </span>

    </button>

  </div>


  <!-- ========================================
       BACKGROUND MUSIC
       ======================================== -->

  <audio
    id="backgroundMusic"
    src="christmassong2025.mp3"
    preload="auto"
    loop>
  </audio>


  <!-- ========================================
       WISH BUTTON
       ======================================== -->

  <button
    id="wishButton"
    type="button"
    aria-label="許願 Wish">

    <span class="wishIcon">
      ✦
    </span>

    <span class="wishButtonText">

      <span class="wishButtonZh">
        許願
      </span>

      <span class="wishButtonEn">
        Wish
      </span>

    </span>

  </button>


  <!-- ========================================
       WISH PANEL
       ======================================== -->

  <div
    id="wishOverlay"
    aria-hidden="true">

    <div
      id="wishPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="wishTitle">


      <h2 id="wishTitle">

        <span class="wishTitleZh">

          <span>✦</span>

          聖誕許願

          <span>✦</span>

        </span>


        <span class="wishTitleEn">

          CHRISTMAS WISH

        </span>

      </h2>


      <textarea
        id="wishText"
        maxlength="60"
        rows="3"
        placeholder="寫低你嘅聖誕願望…&#10;Write your Christmas wish…"
        enterkeyhint="send"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"></textarea>


      <div id="wishCount">
        0 / 60
      </div>


      <div
        id="wishNote"
        hidden>

        <span class="wishNoteZh">

          你嘅願望會匿名傳送俾主辦單位

        </span>

        <span class="wishNoteEn">

          Your wish will be sent anonymously to the organizer.

        </span>

      </div>


      <div id="wishActions">

        <button
          id="wishCancel"
          type="button">

          取消 Cancel

        </button>


        <button
          id="wishSubmit"
          type="button"
          disabled>

          送出 Send

        </button>

      </div>

    </div>

  </div>


  <!-- ========================================
       WISH SUCCESS MESSAGE
       ======================================== -->

  <div
    id="wishToast"
    role="status"
    aria-live="polite">

    願望已經送上天 ✨

    <br>

    <span style="font-size:13px;">

      Your wish has been sent to the stars.

    </span>

  </div>


  <!-- ========================================
       360 SCENE
       ======================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    loading-screen="enabled: false">


    <!-- ========================================
         ASSETS
         ======================================== -->

    <a-assets timeout="60000">

      <video

        id="christmasVideo"

        src="Christmas ar_v2c.mp4"

        preload="auto"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>

    </a-assets>


    <!-- ========================================
         360 VIDEO SPHERE
         ======================================== -->

    <a-videosphere

      src="#christmasVideo"

      rotation="0 -90 0">

    </a-videosphere>


    <!-- ========================================
         CAMERA
         ======================================== -->

    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>


  <script>

    /* ========================================
       ELEMENTS
       ======================================== */

    const loadingScreen =
      document.querySelector(
        '#loadingScreen'
      );


    const loadingVideo =
      document.querySelector(
        '#loadingVideo'
      );


    const christmasVideo =
      document.querySelector(
        '#christmasVideo'
      );


    const backgroundMusic =
      document.querySelector(
        '#backgroundMusic'
      );


    const startButton =
      document.querySelector(
        '#startButton'
      );


    const camera =
      document.querySelector(
        '#camera'
      );


    const sceneEl =
      document.querySelector(
        'a-scene'
      );


    /* ========================================
       LOADING SETTINGS
       ======================================== */

    /*
    Loading 最少播放3秒
    */

    const MIN_LOADING_TIME =
      3000;


    /*
    Loading Fade Out 1.5秒
    */

    const FADE_TIME =
      1500;


    const loadingStartTime =
      Date.now();


    let sceneStarted =
      false;


    let videoReady =
      false;


    let enterTimer =
      null;


    let enterButtonScheduled =
      false;


    let experienceStarting =
      false;


    /* ========================================
       BACKGROUND MUSIC
       ======================================== */

    const MUSIC_TARGET_VOLUME =
      0.6;


    const MUSIC_FADE_TIME =
      2000;


    let musicStarted =
      false;


    let musicFadeTimer =
      null;


    /* ========================================
       CAMERA / ZOOM SETTINGS
       ======================================== */

    let currentFov =
      105;


    const minFov =
      35;


    const maxFov =
      120;


    /* ========================================
       WISH SETTINGS
       ======================================== */

    const WISH_ENDPOINT =

      'https://script.google.com/macros/s/AKfycbyCrBzBm5rgP0bsMPkpZ6HBzHGnrUgRfNm3-6aAEQH4u4ZQY8tUB2qT-0DPwjjX9uTI/exec';


    const WISH_MAX_LENGTH =
      60;


    /* ========================================
       ★ FIXED BIG STAR TARGET ★
       ========================================

       這是剛才用 iPhone
       對準背景大星星後
       實機校準得到的位置：

       Yaw   = 2.04°
       Pitch = 0.89°

       Part 3 的願望星會使用
       這兩個固定角度。

       ======================================== */

    const BIG_STAR_YAW =
      THREE.MathUtils.degToRad(
        2.04
      );


    const BIG_STAR_PITCH =
      THREE.MathUtils.degToRad(
        10.89
      );


    /* ========================================
       WISH ELEMENTS
       ======================================== */

    const wishButton =
      document.querySelector(
        '#wishButton'
      );


    const wishOverlay =
      document.querySelector(
        '#wishOverlay'
      );


    const wishPanel =
      document.querySelector(
        '#wishPanel'
      );


    const wishText =
      document.querySelector(
        '#wishText'
      );


    const wishCount =
      document.querySelector(
        '#wishCount'
      );


    const wishNote =
      document.querySelector(
        '#wishNote'
      );


    const wishCancel =
      document.querySelector(
        '#wishCancel'
      );


    const wishSubmit =
      document.querySelector(
        '#wishSubmit'
      );


    const wishToast =
      document.querySelector(
        '#wishToast'
      );


    let wishPanelOpen =
      false;


    let wishToastTimer =
      null;


    /*
    只保留一粒願望星。
    */

    window.currentWishStar =
      null;
    /* ========================================
       SHOW ENTER BUTTON
       ======================================== */

    function showEnterButton() {

      if (
        sceneStarted ||
        experienceStarting
      ) {
        return;
      }


      startButton.style.display =
        'block';

    }


    /* ========================================
       CHECK IF READY
       ======================================== */

    function scheduleEnterButton() {

      if (
        !videoReady ||
        enterButtonScheduled ||
        sceneStarted
      ) {
        return;
      }


      enterButtonScheduled =
        true;


      const elapsed =
        Date.now() -
        loadingStartTime;


      const remaining =
        Math.max(
          0,
          MIN_LOADING_TIME -
          elapsed
        );


      enterTimer =
        setTimeout(

          function() {

            showEnterButton();

          },

          remaining

        );

    }


    /* ========================================
       360 VIDEO READY
       ======================================== */

    function markVideoReady() {

      if (videoReady) {
        return;
      }


      videoReady =
        true;


      scheduleEnterButton();

    }


    christmasVideo.addEventListener(
      'canplay',
      markVideoReady
    );


    christmasVideo.addEventListener(
      'canplaythrough',
      markVideoReady
    );


    christmasVideo.addEventListener(

      'loadeddata',

      function() {

        if (
          christmasVideo.readyState >= 3
        ) {

          markVideoReady();

        }

      }

    );


    /* ========================================
       PRELOAD 360 VIDEO
       ======================================== */

    function prepareChristmasVideo() {

      try {

        christmasVideo.muted =
          true;


        const playPromise =
          christmasVideo.play();


        if (
          playPromise &&
          playPromise.catch
        ) {

          playPromise.catch(
            function() {
              /*
              iPhone Safari 如果暫時阻止播放，
              按 Enter 時會再次嘗試。
              */
            }
          );

        }

      }

      catch (error) {

        console.warn(
          '360 video preload failed:',
          error
        );

      }

    }


    /* ========================================
       PREPARE BACKGROUND MUSIC
       ======================================== */

    function prepareBackgroundMusic() {

      try {

        backgroundMusic.volume =
          0;


        const playPromise =
          backgroundMusic.play();


        if (
          playPromise &&
          playPromise.then
        ) {

          return playPromise

            .then(

              function() {

                musicStarted =
                  true;

              }

            )

            .catch(

              function() {

                musicStarted =
                  false;

              }

            );

        }

      }

      catch (error) {

        musicStarted =
          false;

      }


      return Promise.resolve();

    }


    /* ========================================
       FADE IN MUSIC
       ======================================== */

    function fadeInMusic() {

      if (!musicStarted) {
        return;
      }


      if (musicFadeTimer) {

        cancelAnimationFrame(
          musicFadeTimer
        );

      }


      const startTime =
        performance.now();


      function fadeStep(now) {

        const progress =
          Math.min(

            1,

            (
              now -
              startTime
            ) /
            MUSIC_FADE_TIME

          );


        backgroundMusic.volume =

          MUSIC_TARGET_VOLUME *
          progress;


        if (
          progress < 1
        ) {

          musicFadeTimer =
            requestAnimationFrame(
              fadeStep
            );

        }

        else {

          musicFadeTimer =
            null;

        }

      }


      musicFadeTimer =
        requestAnimationFrame(
          fadeStep
        );

    }


    /* ========================================
       REQUEST MOTION PERMISSION
       ======================================== */

    function requestMotionPermission() {

      /*
      iPhone / iOS 13+
      必須由使用者按鈕直接觸發。
      */

      if (

        typeof DeviceOrientationEvent !==
          'undefined' &&

        typeof DeviceOrientationEvent
          .requestPermission ===
          'function'

      ) {

        return DeviceOrientationEvent
          .requestPermission()

          .then(

            function(permissionState) {

              return permissionState;

            }

          )

          .catch(

            function(error) {

              console.warn(
                'Motion permission error:',
                error
              );


              return 'denied';

            }

          );

      }


      /*
      Android / Desktop
      不需要 Apple requestPermission。
      */

      return Promise.resolve(
        'granted'
      );

    }


    /* ========================================
       ENTER 360 SCENE
       ======================================== */

    function enter360Scene() {

      if (sceneStarted) {
        return;
      }


      sceneStarted =
        true;


      /*
      隱藏 Enter Button
      */

      startButton.style.display =
        'none';


      /*
      音樂開始 Fade In
      */

      fadeInMusic();


      /*
      Loading 畫面淡出
      */

      loadingScreen.classList.add(
        'hide'
      );


      setTimeout(

        function() {

          loadingScreen.style.display =
            'none';

        },

        FADE_TIME

      );


      /*
      顯示許願按鈕
      */

      setTimeout(

        function() {

          showWishButton();

        },

        500

      );

    }


    /* ========================================
       START EXPERIENCE
       ======================================== */

    function start360Experience() {

      if (
        experienceStarting ||
        sceneStarted
      ) {
        return;
      }


      experienceStarting =
        true;


      startButton.disabled =
        true;


      /*
      非常重要：

      音樂 play()
      必須直接在使用者按 Enter
      的操作內開始。

      這樣 iPhone Safari
      才比較容易允許播放音樂。
      */

      const musicPromise =
        prepareBackgroundMusic();


      /*
      同一個使用者操作中，
      再次確保360影片正在播放。
      */

      try {

    /* ========================================
       PINCH ZOOM
       ======================================== */

    let pinchStartDistance =
      null;


    let pinchStartFov =
      currentFov;


    function getTouchDistance(
      touch1,
      touch2
    ) {

      const dx =
        touch1.clientX -
        touch2.clientX;


      const dy =
        touch1.clientY -
        touch2.clientY;


      return Math.sqrt(
        dx * dx +
        dy * dy
      );

    }


    /* ========================================
       CHECK WISH UI
       ======================================== */

    function isWishUI(
      target
    ) {

      if (
        !target ||
        !target.closest
      ) {

        return false;

      }


      return !!target.closest(
        '#wishButton, #wishOverlay'
      );

    }


    /* ========================================
       PINCH START
       ======================================== */

    document.addEventListener(

      'touchstart',

      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }


        if (
          event.touches.length === 2
        ) {

          pinchStartDistance =
            getTouchDistance(

              event.touches[0],

              event.touches[1]

            );


          pinchStartFov =
            currentFov;

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       PINCH MOVE
       ======================================== */

    document.addEventListener(

      'touchmove',

      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }


        if (

          event.touches.length === 2 &&
          pinchStartDistance

        ) {

          event.preventDefault();


          const currentDistance =
            getTouchDistance(

              event.touches[0],

              event.touches[1]

            );


          const ratio =
            pinchStartDistance /
            currentDistance;


          let newFov =
            pinchStartFov *
            ratio;


          newFov =
            Math.max(

              minFov,

              Math.min(
                maxFov,
                newFov
              )

            );


          currentFov =
            newFov;


          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       PINCH END
       ======================================== */

    document.addEventListener(

      'touchend',

      function(event) {

        if (
          event.touches.length < 2
        ) {

          pinchStartDistance =
            null;

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       DESKTOP MOUSE WHEEL ZOOM
       ======================================== */

    document.addEventListener(

      'wheel',

      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }


        event.preventDefault();


        currentFov +=
          event.deltaY *
          0.03;


        currentFov =
          Math.max(

            minFov,

            Math.min(
              maxFov,
              currentFov
            )

          );


        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );

      },

      {
        passive: false
      }

    );

    /* ========================================
       CREATE WISH STAR
       ======================================== */

    function createWishStar() {

      /*
      願望星會真正加入
      A-Frame / THREE.js 的360°世界。

      起點：
      使用者許願時正在觀看的位置。

      終點：
      固定鎖定背景的大星星。

      校準位置：
      Yaw   = 2.04°
      Pitch = 0.89°
      */


      if (
        !sceneEl ||
        !sceneEl.object3D ||
        !sceneEl.camera
      ) {

        console.warn(
          '360 scene / camera not ready.'
        );

        return;

      }


      const threeCamera =
        sceneEl.camera;


      threeCamera.updateMatrixWorld(
        true
      );


      /* ========================================
         CAMERA POSITION
         ======================================== */

      const cameraPosition =
        new THREE.Vector3();


      threeCamera.getWorldPosition(
        cameraPosition
      );


      /* ========================================
         CURRENT VIEW DIRECTION
         ======================================== */

      /*
      這個方向只用來決定：

      願望星由使用者眼前
      哪個位置開始出現。

      不會影響最後終點。
      */

      const viewDirection =
        new THREE.Vector3();


      threeCamera.getWorldDirection(
        viewDirection
      );


      viewDirection.normalize();


      /* ========================================
         START POSITION
         ======================================== */

      const startPosition =

        cameraPosition
          .clone()
          .addScaledVector(
            viewDirection,
            3.5
          );


      /*
      起點稍為向下。

      視覺上就會像星星
      由下方慢慢升上天空。
      */

      startPosition.y -=
        1.15;


      /* ========================================
         FIXED BIG STAR DIRECTION
         ======================================== */

      /*
      ★★★★★★★★★★★★★★★★★★★★★★★

      這裡使用 Part 1 已設定的：

      BIG_STAR_YAW
      BIG_STAR_PITCH

      即：

      Yaw   = 2.04°
      Pitch = 0.89°

      ★★★★★★★★★★★★★★★★★★★★★★★
      */

      const bigStarDirection =

        new THREE.Vector3(

          -Math.sin(
            BIG_STAR_YAW
          ) *
          Math.cos(
            BIG_STAR_PITCH
          ),


          Math.sin(
            BIG_STAR_PITCH
          ),


          -Math.cos(
            BIG_STAR_YAW
          ) *
          Math.cos(
            BIG_STAR_PITCH
          )

        );


      bigStarDirection.normalize();


      /* ========================================
         FIXED END POSITION
         ======================================== */

      /*
      ★★★ 最重要的一行 ★★★

      這裡故意不加入：

      cameraPosition

      因此終點不是
      「相對於目前 Camera」。

      而是360°世界內
      一個固定的位置。
      */


      const endPosition =

        bigStarDirection
          .clone()
          .multiplyScalar(
            18
          );


      /*
      所以使用者：

      向左看
      向右看
      向上看
      向下看
      轉動手機

      都不會改變 endPosition。
      */


      /* ========================================
         CREATE STAR CANVAS
         ======================================== */

      const starCanvas =

        document.createElement(
          'canvas'
        );


      starCanvas.width =
        256;


      starCanvas.height =
        256;


      const ctx =

        starCanvas.getContext(
          '2d'
        );


      if (!ctx) {

        return;

      }


      ctx.clearRect(
        0,
        0,
        256,
        256
      );


      /* ========================================
         GOLDEN GLOW
         ======================================== */

      const glow =

        ctx.createRadialGradient(

          128,
          128,
          8,

          128,
          128,
          120

        );


      glow.addColorStop(

        0,

        'rgba(255,245,180,0.95)'

      );


      glow.addColorStop(

        0.22,

        'rgba(255,220,90,0.55)'

      );


      glow.addColorStop(

        0.55,

        'rgba(255,190,40,0.18)'

      );


      glow.addColorStop(

        1,

        'rgba(255,180,20,0)'

      );


      ctx.fillStyle =
        glow;


      ctx.fillRect(

        0,
        0,
        256,
        256

      );


      /* ========================================
         DRAW FIVE-POINT STAR
         ======================================== */

      function drawFivePointStar(

        context,

        centerX,
        centerY,

        outerRadius,
        innerRadius

      ) {


        let rotation =

          -Math.PI / 2;


        const step =

          Math.PI / 5;


        context.beginPath();


        for (

          let i = 0;

          i < 10;

          i++

        ) {


          const radius =

            i % 2 === 0

              ? outerRadius

              : innerRadius;


          const x =

            centerX +

            Math.cos(
              rotation
            ) *

            radius;


          const y =

            centerY +

            Math.sin(
              rotation
            ) *

            radius;


          if (
            i === 0
          ) {

            context.moveTo(
              x,
              y
            );

          }

          else {

            context.lineTo(
              x,
              y
            );

          }


          rotation +=
            step;

        }


        context.closePath();

      }


      drawFivePointStar(

        ctx,

        128,
        128,

        66,
        28

      );


      /* ========================================
         STAR GLOW
         ======================================== */

      ctx.shadowColor =

        'rgba(255,220,80,0.95)';


      ctx.shadowBlur =
        18;


      /* ========================================
         STAR GOLD GRADIENT
         ======================================== */

      const starGradient =

        ctx.createLinearGradient(

          128,
          62,

          128,
          194

        );


      starGradient.addColorStop(

        0,

        '#fff7b0'

      );


      starGradient.addColorStop(

        0.45,

        '#ffd85a'

      );


      starGradient.addColorStop(

        1,

        '#e8a91f'

      );


      ctx.fillStyle =
        starGradient;


      ctx.fill();


      /* ========================================
         STAR BORDER
         ======================================== */

      ctx.lineWidth =
        3;


      ctx.strokeStyle =

        'rgba(255,248,190,0.95)';


      ctx.stroke();


      /* ========================================
         CANVAS → THREE TEXTURE
         ======================================== */

      const texture =

        new THREE.CanvasTexture(
          starCanvas
        );


      texture.needsUpdate =
        true;


      /* ========================================
         CREATE SPRITE MATERIAL
         ======================================== */

      const material =

        new THREE.SpriteMaterial({

          map:
            texture,

          transparent:
            true,

          depthWrite:
            false,

          depthTest:
            false,

          opacity:
            0

        });


      /* ========================================
         CREATE STAR SPRITE
         ======================================== */

      const star =

        new THREE.Sprite(
          material
        );


      star.position.copy(
        startPosition
      );


      star.scale.set(

        1.15,
        1.15,
        1

      );


      /* ========================================
         REMOVE PREVIOUS WISH STAR
         ======================================== */

      /*
      每次只容許一粒願望星。

      如果上一粒仍未消失，
      就先移除上一粒。
      */

      if (
        window.currentWishStar
      ) {


        const oldStar =
          window.currentWishStar;


        if (
          oldStar.parent
        ) {

          oldStar.parent.remove(
            oldStar
          );

        }


        if (
          oldStar.material
        ) {


          if (
            oldStar.material.map
          ) {

            oldStar.material.map.dispose();

          }


          oldStar.material.dispose();

        }


        window.currentWishStar =
          null;

      }


      /* ========================================
         ADD STAR TO 360 WORLD
         ======================================== */

      /*
      ★ 不是 document.body
      ★ 不是 position:fixed
      ★ 不是 DOM Overlay

      而是真正加入
      A-Frame 3D Scene。
      */

      sceneEl.object3D.add(
        star
      );


      window.currentWishStar =
        star;


      /* ========================================
         ANIMATION SETTINGS
         ======================================== */

      /*
      飛向背景大星星：
      2.6秒
      */

      const RISE_TIME =
        2600;


      /*
      到達後停留：
      4秒
      */

      const HOLD_TIME =
        4000;


      /*
      最後淡出：
      0.8秒
      */

      const FADE_OUT_TIME =
        800;


      const animationStart =
        performance.now();


      /* ========================================
         ANIMATE WISH STAR
         ======================================== */

      function animateWishStar(
        now
      ) {


        /*
        如果這粒星已經被
        新願望取代，
        就停止舊動畫。
        */

        if (
          window.currentWishStar !==
          star
        ) {

          return;

        }


        const elapsed =

          now -
          animationStart;


        /* ====================================
           STAGE 1
           RISE / FLY
           ==================================== */

        if (
          elapsed <
          RISE_TIME
        ) {


          const rawProgress =

            elapsed /
            RISE_TIME;


          /*
          Ease Out Cubic：

          開始快一點，
          接近大星星時慢慢減速。
          */

          const progress =

            1 -

            Math.pow(

              1 -
              rawProgress,

              3

            );


          /* ====================================
             MOVE TO FIXED BIG STAR
             ==================================== */

          star.position
            .lerpVectors(

              startPosition,

              endPosition,

              progress

            );


          /* ====================================
             FADE IN
             ==================================== */

          const fadeIn =

            Math.min(

              1,

              elapsed /
              350

            );


          /*
          輕微閃爍，
          但不改變位置。
          */

          const twinkle =

            0.92 +

            Math.sin(
              elapsed *
              0.018
            ) *
            0.08;


          material.opacity =

            Math.min(

              1,

              fadeIn *
              twinkle

            );


          /* ====================================
             SCALE
             ==================================== */

          /*
          因為終點距離比較遠，
          星星逐漸稍為放大，
          避免飛遠後變得太細。
          */

          const scale =

            1.15 +

            progress *
            1.55;


          star.scale.set(

            scale,
            scale,
            1

          );


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ====================================
           STAGE 2
           HOLD ON BIG STAR
           ==================================== */

        if (

          elapsed <

          RISE_TIME +
          HOLD_TIME

        ) {


          /*
          ★★★★★★★★★★★★★★★★★★★

          強制固定在
          校準的大星星位置。

          這裡完全不重新讀取
          Camera Direction。

          ★★★★★★★★★★★★★★★★★★★
          */

          star.position.copy(
            endPosition
          );


          star.scale.set(

            2.7,
            2.7,
            1

          );


          const twinkle =

            0.90 +

            Math.sin(

              elapsed *
              0.012

            ) *

            0.10;


          material.opacity =

            Math.max(

              0,

              Math.min(
                1,
                twinkle
              )

            );


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ====================================
           STAGE 3
           FADE OUT
           ==================================== */

        const fadeElapsed =

          elapsed -

          RISE_TIME -

          HOLD_TIME;


        if (
          fadeElapsed <
          FADE_OUT_TIME
        ) {


          /*
          淡出時亦繼續鎖死
          在大星星位置。
          */

          star.position.copy(
            endPosition
          );


          const fadeProgress =

            fadeElapsed /
            FADE_OUT_TIME;


          material.opacity =

            Math.max(

              0,

              1 -
              fadeProgress

            );


          /*
          淡出時只輕微放大。
          */

          const fadeScale =

            2.7 +

            fadeProgress *
            0.15;


          star.scale.set(

            fadeScale,
            fadeScale,
            1

          );


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ====================================
           REMOVE STAR
           ==================================== */

        if (
          star.parent
        ) {

          star.parent.remove(
            star
          );

        }


        texture.dispose();


        material.dispose();


        if (
          window.currentWishStar ===
          star
        ) {

          window.currentWishStar =
            null;

        }

      }


      requestAnimationFrame(
        animateWishStar
      );

    }


    /* ========================================
       CREATE WISH STAR BURST
       ======================================== */

    /*
    保留這個 Function 名稱，
    因為你原本 HTML
    Submit Wish 的程式會呼叫：

    createWishStarBurst()

    但現在不再一次產生
    4～7粒星星。

    每次只建立一粒。
    */

    function createWishStarBurst() {

      createWishStar();

    }


    /* ========================================
       SEND WISH TO GOOGLE SHEET
       ======================================== */

    function sendWishToGoogleSheet(
      wish
    ) {


      if (!WISH_ENDPOINT) {

        return;

      }


      try {


        const data =
          new URLSearchParams();


        data.append(
          'wish',
          wish
        );


        data.append(
          'deviceId',
          getDeviceId()
        );


        data.append(

          'timestamp',

          new Date()
            .toISOString()

        );


        fetch(

          WISH_ENDPOINT,

          {

            method:
              'POST',

            mode:
              'no-cors',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              data.toString(),

            keepalive:
              true

          }

        )

        .catch(

          function(error) {

            console.warn(

              'Wish upload failed:',

              error

            );

          }

        );


      }

      catch (error) {


        console.warn(

          'Wish upload error:',

          error

        );


      }

    }


    /* ========================================
       SUBMIT WISH
       ======================================== */

    function submitWish() {


      const wish =

        wishText.value
          .trim();


      if (!wish) {

        return;

      }


      /* ====================================
         SEND TO GOOGLE SHEET
         ==================================== */

      sendWishToGoogleSheet(
        wish
      );


      /* ====================================
         CLEAR TEXT
         ==================================== */

      wishText.value =
        '';


      updateWishCounter();


      /* ====================================
         CLOSE PANEL
         ==================================== */

      closeWishPanel(

        function() {


          /*
          顯示成功訊息。
          */

          showWishToast();


          /*
          ★★★★★★★★★★★★★★★★★★★

          建立一粒願望星。

          它會由使用者眼前出現，
          然後飛向：

          Yaw   2.04°
          Pitch 0.89°

          ★★★★★★★★★★★★★★★★★★★
          */

          createWishStarBurst();


        }

      );

    }


    /* ========================================
       WISH BUTTON
       ======================================== */

    wishButton.addEventListener(

      'click',

      function(event) {


        event.preventDefault();

        event.stopPropagation();


        openWishPanel();


      }

    );


    /* ========================================
       CANCEL BUTTON
       ======================================== */

    wishCancel.addEventListener(

      'click',

      function(event) {


        event.preventDefault();

        event.stopPropagation();


        closeWishPanel();


      }

    );


    /* ========================================
       SUBMIT BUTTON
       ======================================== */

    wishSubmit.addEventListener(

      'click',

      function(event) {


        event.preventDefault();

        event.stopPropagation();


        submitWish();


      }

    );


    /* ========================================
       WISH TEXT INPUT
       ======================================== */

    wishText.addEventListener(

      'input',

      function() {


        /*
        防止某些 Browser
        超過60字。
        */

        if (

          wishText.value.length >

          WISH_MAX_LENGTH

        ) {


          wishText.value =

            wishText.value.slice(

              0,

              WISH_MAX_LENGTH

            );


        }


        updateWishCounter();


      }

    );


    /* ========================================
       ENTER KEY
       ======================================== */

    wishText.addEventListener(

      'keydown',

      function(event) {


        if (

          event.key ===
            'Enter' &&

          !event.shiftKey

        ) {


          event.preventDefault();


          if (
            !wishSubmit.disabled
          ) {

            submitWish();

          }


        }


      }

    );


    /* ========================================
       CLICK OUTSIDE PANEL
       ======================================== */

    wishOverlay.addEventListener(

      'click',

      function(event) {


        if (
          event.target ===
          wishOverlay
        ) {


          closeWishPanel();


        }


      }

    );


    /* ========================================
       PREVENT PANEL TOUCH
       FROM MOVING 360 VIEW
       ======================================== */

    wishPanel.addEventListener(

      'touchstart',

      function(event) {

        event.stopPropagation();

      },

      {
        passive: true
      }

    );


    wishPanel.addEventListener(

      'touchmove',

      function(event) {

        event.stopPropagation();

      },

      {
        passive: true
      }

    );


    /* ========================================
       ESC KEY
       ======================================== */

    document.addEventListener(

      'keydown',

      function(event) {


        if (

          event.key ===
            'Escape' &&

          wishPanelOpen

        ) {


          closeWishPanel();


        }


      }

    );
    /* ========================================
       RESUME MEDIA
       ======================================== */

    function resumeMedia() {

      if (!sceneStarted) {
        return;
      }


      /* ====================================
         RESUME 360 VIDEO
         ==================================== */

      try {

        if (
          christmasVideo.paused
        ) {

          const videoPromise =
            christmasVideo.play();


          if (
            videoPromise &&
            videoPromise.catch
          ) {

            videoPromise.catch(
              function() {}
            );

          }

        }

      }

      catch (error) {

        console.warn(
          'Resume 360 video failed:',
          error
        );

      }


      /* ====================================
         RESUME BACKGROUND MUSIC
         ==================================== */

      try {

        if (
          musicStarted &&
          backgroundMusic.paused
        ) {

          const musicPromise =
            backgroundMusic.play();


          if (
            musicPromise &&
            musicPromise.catch
          ) {

            musicPromise.catch(
              function() {}
            );

          }

        }

      }

      catch (error) {

        console.warn(
          'Resume music failed:',
          error
        );

      }

    }


    /* ========================================
       PAGE VISIBILITY
       ======================================== */

    document.addEventListener(

      'visibilitychange',

      function() {

        if (
          document.visibilityState ===
          'visible'
        ) {

          resumeMedia();

        }

      }

    );


    /* ========================================
       PAGE SHOW
       ======================================== */

    window.addEventListener(

      'pageshow',

      function() {

        if (!sceneStarted) {
          return;
        }


        setTimeout(

          function() {

            resumeMedia();

          },

          100

        );

      }

    );


    /* ========================================
       WINDOW FOCUS
       ======================================== */

    window.addEventListener(

      'focus',

      function() {

        if (
          sceneStarted
        ) {

          resumeMedia();

        }

      }

    );


    /* ========================================
       USER INTERACTION FALLBACK
       ======================================== */

    function resumeMediaAfterInteraction() {

      if (!sceneStarted) {
        return;
      }


      resumeMedia();

    }


    document.addEventListener(

      'pointerdown',

      resumeMediaAfterInteraction,

      {
        passive: true
      }

    );


    /* ========================================
       PREVENT DOUBLE TAP ZOOM
       ======================================== */

    let lastTouchEnd =
      0;


    document.addEventListener(

      'touchend',

      function(event) {

        /*
        如果使用者正在操作
        許願介面，
        不阻止正常按鈕操作。
        */

        if (
          isWishUI(
            event.target
          )
        ) {

          return;

        }


        const now =
          Date.now();


        if (

          now -
          lastTouchEnd <=
          300

        ) {

          event.preventDefault();

        }


        lastTouchEnd =
          now;

      },

      {
        passive: false
      }

    );


    /* ========================================
       ORIENTATION CHANGE
       ======================================== */

    window.addEventListener(

      'orientationchange',

      function() {

        /*
        iPhone 轉方向後，
        稍等一下再通知
        A-Frame 更新尺寸。
        */

        setTimeout(

          function() {

            window.dispatchEvent(

              new Event(
                'resize'
              )

            );

          },

          300

        );

      }

    );


    /* ========================================
       CHRISTMAS VIDEO ERROR
       ======================================== */

    christmasVideo.addEventListener(

      'error',

      function(event) {

        console.error(

          'Christmas 360 video error:',

          event

        );

      }

    );


    /* ========================================
       LOADING VIDEO ERROR
       ======================================== */

    loadingVideo.addEventListener(

      'error',

      function(event) {

        console.error(

          'Loading video error:',

          event

        );

      }

    );


    /* ========================================
       MUSIC ERROR
       ======================================== */

    backgroundMusic.addEventListener(

      'error',

      function(event) {

        console.error(

          'Background music error:',

          event

        );

      }

    );


    /* ========================================
       A-FRAME SCENE READY
       ======================================== */

    if (sceneEl) {

      sceneEl.addEventListener(

        'loaded',

        function() {


          /* ====================================
             INITIAL CAMERA FOV
             ==================================== */

          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


          /* ====================================
             CHECK 360 VIDEO
             ==================================== */

          if (

            christmasVideo.readyState >=
            3

          ) {

            markVideoReady();

          }

        }

      );

    }


    /* ========================================
       INITIAL WISH COUNTER
       ======================================== */

    updateWishCounter();


    /* ========================================
       INITIAL CAMERA FOV
       ======================================== */

    camera.setAttribute(

      'camera',

      'fov',

      currentFov

    );


    /* ========================================
       EXTRA VIDEO READY FALLBACK
       ======================================== */

    /*
    某些 iPhone Safari
    canplay / canplaythrough
    的觸發時間不太穩定。

    所以另外每300ms
    檢查一次 readyState。
    */

    let readyAttempts =
      0;


    const readyStateTimer =
      setInterval(

        function() {


          readyAttempts++;


          if (

            christmasVideo.readyState >=
            3

          ) {


            clearInterval(
              readyStateTimer
            );


            markVideoReady();


            return;

          }


          /*
          最多檢查約30秒。
          */

          if (
            readyAttempts >
            100
          ) {

            clearInterval(
              readyStateTimer
            );

          }

        },

        300

      );


    /* ========================================
       LOADING VIDEO FALLBACK
       ======================================== */

    /*
    如果 Loading Video
    已經播放完，
    但360影片仍然未準備好，

    Loading 畫面仍然保留，
    等360影片 Ready 後
    才顯示 Enter Button。
    */

    loadingVideo.addEventListener(

      'ended',

      function() {

        if (
          !videoReady
        ) {

          /*
          保留 Loading 最後一格，
          不直接進入360。
          */

          try {

            loadingVideo.pause();

          }

          catch (error) {}

        }

      }

    );


    /* ========================================
       PAGE HIDE
       ======================================== */

    window.addEventListener(

      'pagehide',

      function() {

        if (
          enterTimer
        ) {

          clearTimeout(
            enterTimer
          );

        }

      }

    );


    /* ========================================
       CLEANUP CURRENT WISH STAR
       ======================================== */

    window.addEventListener(

      'pagehide',

      function() {

        if (
          !window.currentWishStar
        ) {

          return;

        }


        const star =
          window.currentWishStar;


        if (
          star.parent
        ) {

          star.parent.remove(
            star
          );

        }


        if (
          star.material
        ) {


          if (
            star.material.map
          ) {

            star.material.map.dispose();

          }


          star.material.dispose();

        }


        window.currentWishStar =
          null;

      }

    );


    /* ========================================
       FINAL READY CHECK
       ======================================== */

    if (
      christmasVideo.readyState >=
      3
    ) {

      markVideoReady();

    }


  </script>


</body>

</html>
