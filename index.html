<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

    }


    /* ========================================
       LOADING SCREEN
       ======================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      transition:
        opacity 1.5s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      pointer-events: none;

    }


    /* ========================================
       LOADING VIDEO
       ======================================== */

    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

    }


    /* ========================================
       ENTER BUTTON
       ======================================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 100px;

      transform:
        translateX(-50%);

      z-index: 10000;

      padding:
        14px 28px;

      border: none;

      border-radius: 30px;

      background:
        rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      white-space: nowrap;

      cursor: pointer;

      display: none;

      opacity: 0;

      transition:
        opacity 0.5s ease,
        transform 0.25s ease;

      -webkit-tap-highlight-color:
        transparent;

      touch-action: manipulation;

    }


    #startButton.show {

      display: block;

      opacity: 1;

    }


    #startButton:active {

      transform:
        translateX(-50%)
        scale(0.96);

    }


    /* ========================================
       A-FRAME
       ======================================== */

    a-scene {

      width: 100%;
      height: 100%;

    }


    /* ========================================
       WISH BUTTON
       ======================================== */

    #wishButton {

      position: fixed;

      right:
        calc(
          18px +
          env(
            safe-area-inset-right,
            0px
          )
        );

      bottom:
        calc(
          26px +
          env(
            safe-area-inset-bottom,
            0px
          )
        );

      z-index: 10001;

      display: none;

      align-items: center;

      gap: 6px;

      padding:
        12px 22px;

      border: none;

      border-radius: 30px;

      background:
        rgba(
          255,
          255,
          255,
          0.92
        );

      color: #222;

      font-size: 17px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 0 0 1px
        rgba(
          255,
          215,
          120,
          0.55
        ),

        0 4px 18px
        rgba(
          255,
          200,
          90,
          0.35
        );

      opacity: 0;

      transform:
        translateY(12px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;

      -webkit-tap-highlight-color:
        transparent;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

    }


    #wishButton.show {

      opacity: 1;

      transform:
        translateY(0);

      animation:
        wishGlow
        3.2s
        ease-in-out
        0.6s
        infinite;

    }


    #wishButton:active {

      transform:
        scale(0.96);

    }


    #wishButton .wishIcon {

      color: #d9a520;

      font-size: 18px;

      line-height: 1;

    }


    #wishButton .wishWords {

      display: flex;

      flex-direction: column;

      align-items: center;

      line-height: 1.1;

    }


    #wishButton .wishZh {

      font-size: 17px;

    }


    #wishButton .wishEn {

      margin-top: 4px;

      font-size: 12px;

      letter-spacing: 0.5px;

      opacity: 0.7;

    }


    @keyframes wishGlow {

      0%,
      100% {

        box-shadow:

          0 0 0 1px
          rgba(
            255,
            215,
            120,
            0.55
          ),

          0 4px 18px
          rgba(
            255,
            200,
            90,
            0.30
          );

      }


      50% {

        box-shadow:

          0 0 0 1px
          rgba(
            255,
            215,
            120,
            0.85
          ),

          0 4px 26px
          rgba(
            255,
            200,
            90,
            0.60
          );

      }

    }


    /* ========================================
       WISH OVERLAY
       ======================================== */

    #wishOverlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 10002;

      display: none;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      padding:

        calc(
          16px +
          env(
            safe-area-inset-top,
            0px
          )
        )

        calc(
          16px +
          env(
            safe-area-inset-right,
            0px
          )
        )

        calc(
          16px +
          env(
            safe-area-inset-bottom,
            0px
          )
        )

        calc(
          16px +
          env(
            safe-area-inset-left,
            0px
          )
        );

      background:
        rgba(
          0,
          0,
          0,
          0.35
        );

      -webkit-backdrop-filter:
        blur(2px);

      backdrop-filter:
        blur(2px);

      opacity: 0;

      transition:
        opacity 0.25s ease;

    }


    #wishOverlay.open {

      opacity: 1;

    }


    /* ========================================
       WISH PANEL
       ======================================== */

    #wishPanel {

      width: 100%;

      max-width: 360px;

      box-sizing: border-box;

      padding:
        20px 18px 16px;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      color: #222;

      box-shadow:

        0 0 0 1px
        rgba(
          255,
          215,
          120,
          0.6
        ),

        0 10px 40px
        rgba(
          0,
          0,
          0,
          0.35
        );

      transform:
        translateY(10px)
        scale(0.98);

      transition:
        transform 0.25s ease;

    }


    #wishOverlay.open
    #wishPanel {

      transform:
        translateY(0)
        scale(1);

    }


    /* ========================================
       WISH TITLE
       ======================================== */

    #wishTitle {

      margin:
        0 0 5px;

      text-align: center;

      font-size: 21px;

      font-weight: 600;

      letter-spacing: 1px;

    }


    #wishTitleEn {

      margin-bottom: 14px;

      text-align: center;

      color: #777;

      font-size: 13px;

    }


    /* ========================================
       WISH TEXTAREA
       ======================================== */

    #wishText {

      display: block;

      width: 100%;
      height: 110px;

      box-sizing: border-box;

      resize: none;

      padding:
        12px 13px;

      border:
        1px solid
        rgba(
          180,
          150,
          90,
          0.45
        );

      border-radius: 14px;

      outline: none;

      background:
        rgba(
          255,
          255,
          255,
          0.92
        );

      color: #222;

      font-size: 16px;

      line-height: 1.5;

      font-family: inherit;

      -webkit-appearance: none;

      touch-action: auto;

    }


    #wishText:focus {

      border-color:
        rgba(
          210,
          165,
          55,
          0.9
        );

      box-shadow:
        0 0 0 3px
        rgba(
          255,
          210,
          100,
          0.16
        );

    }


    #wishCount {

      margin-top: 6px;

      text-align: right;

      color: #888;

      font-size: 12px;

    }


    /* ========================================
       WISH ACTIONS
       ======================================== */

    #wishActions {

      display: flex;

      gap: 10px;

      margin-top: 14px;

    }


    #wishCancel,
    #wishSubmit {

      flex: 1;

      min-height: 44px;

      border: none;

      border-radius: 22px;

      font-family: inherit;

      font-size: 15px;

      cursor: pointer;

      touch-action: manipulation;

      -webkit-tap-highlight-color:
        transparent;

    }


    #wishCancel {

      background:
        #eeeeee;

      color: #555;

    }


    #wishSubmit {

      background:
        linear-gradient(
          135deg,
          #f5d782,
          #d8a62c
        );

      color: #fff;

      font-weight: 600;

    }


    #wishSubmit:disabled {

      opacity: 0.45;

      cursor: default;

    }


    /* ========================================
       WISH TOAST
       ======================================== */

    #wishToast {

      position: fixed;

      top:
        calc(
          28px +
          env(
            safe-area-inset-top,
            0px
          )
        );

      left: 50%;

      z-index: 10003;

      width:
        calc(
          100% -
          64px
        );

      max-width: 420px;

      box-sizing: border-box;

      padding:
        13px 18px;

      border-radius: 26px;

      background:
        rgba(
          255,
          255,
          255,
          0.94
        );

      color: #333;

      box-shadow:
        0 5px 24px
        rgba(
          0,
          0,
          0,
          0.20
        );

      transform:
        translate(
          -50%,
          -18px
        );

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;

    }


    #wishToast.show {

      opacity: 1;

      transform:
        translate(
          -50%,
          0
        );

    }


    #wishToast .toastZh {

      font-size: 16px;

      line-height: 1.35;

    }


    #wishToast .toastEn {

      margin-top: 3px;

      font-size: 13px;

      line-height: 1.35;

      color: #555;

    }


  </style>

</head>


<body>


  <!-- ========================================
       360 VIDEO ASSET
       ======================================== -->

  <video
    id="christmasVideo"
    src="Christmas ar_v2b.mp4"
    preload="auto"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    crossorigin="anonymous"
    style="display:none;">
  </video>


  <!-- ========================================
       BACKGROUND MUSIC
       ======================================== -->

  <audio
    id="backgroundMusic"
    src="christmassong2025.mp3"
    preload="auto"
    loop>
  </audio>


  <!-- ========================================
       A-FRAME 360 SCENE
       ======================================== -->

  <a-scene
    id="scene"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-videosphere
      src="#christmasVideo"
      rotation="0 -90 0">
    </a-videosphere>


    <a-camera
      id="camera"
      position="0 0 0"
      camera="fov: 105"
      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">
    </a-camera>

  </a-scene>


  <!-- ========================================
       LOADING SCREEN
       ======================================== -->

  <div id="loadingScreen">

    <video
      id="loadingVideo"
      src="loading.mp4"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto">
    </video>


    <button
      id="startButton"
      type="button">

      進入360°體驗
      <br>
      <span style="font-size:12px; opacity:0.72;">
        Enter 360° Experience
      </span>

    </button>

  </div>


  <!-- ========================================
       WISH BUTTON
       ======================================== -->

  <button
    id="wishButton"
    type="button"
    aria-label="許願 Wish">

    <span class="wishIcon">
      ✦
    </span>

    <span class="wishWords">

      <span class="wishZh">
        許願
      </span>

      <span class="wishEn">
        Wish
      </span>

    </span>

  </button>


  <!-- ========================================
       WISH OVERLAY
       ======================================== -->

  <div
    id="wishOverlay"
    aria-hidden="true">

    <div id="wishPanel">

      <div id="wishTitle">
        許下你的願望
      </div>

      <div id="wishTitleEn">
        Make a wish
      </div>


      <textarea
        id="wishText"
        maxlength="60"
        placeholder="寫下你的願望&#10;Write your wish here"></textarea>


      <div id="wishCount">
        0 / 60
      </div>


      <div id="wishActions">

        <button
          id="wishCancel"
          type="button">
          取消 / Cancel
        </button>

        <button
          id="wishSubmit"
          type="button"
          disabled>
          送出願望 / Send
        </button>

      </div>

    </div>

  </div>


  <!-- ========================================
       SUCCESS MESSAGE
       ======================================== -->

  <div id="wishToast">

    <div class="toastZh">
      願望已經送上天 ✨
    </div>

    <div class="toastEn">
      Your wish has been sent to the stars.
    </div>

  </div>


  <script>

    /* ========================================
       BASIC ELEMENTS
       ======================================== */

    const loadingScreen =
      document.querySelector(
        '#loadingScreen'
      );

    const loadingVideo =
      document.querySelector(
        '#loadingVideo'
      );

    const startButton =
      document.querySelector(
        '#startButton'
      );

    const christmasVideo =
      document.querySelector(
        '#christmasVideo'
      );

    const backgroundMusic =
      document.querySelector(
        '#backgroundMusic'
      );

    const sceneEl =
      document.querySelector(
        '#scene'
      );

    const camera =
      document.querySelector(
        '#camera'
      );


    /* ========================================
       STATE
       ======================================== */

    const MIN_LOADING_TIME =
      3000;

    const FADE_TIME =
      1500;

    const MUSIC_TARGET_VOLUME =
      0.6;

    const MUSIC_FADE_TIME =
      2000;


    const pageStartedAt =
      performance.now();


    let videoReady =
      false;

    let enterTimer =
      null;

    let entryButtonShown =
      false;

    let experienceStarting =
      false;

    let sceneStarted =
      false;

    let musicStarted =
      false;

    let gyroPermission =
      'unknown';


    /* ========================================
       SHOW ENTER BUTTON
       ======================================== */

    function showEnterButton() {

      if (
        entryButtonShown ||
        sceneStarted
      ) {

        return;

      }


      entryButtonShown =
        true;


      startButton.style.display =
        'block';


      requestAnimationFrame(

        function() {

          requestAnimationFrame(

            function() {

              startButton
                .classList
                .add('show');

            }

          );

        }

      );

    }


    /* ========================================
       WAIT MINIMUM 3 SECONDS
       ======================================== */

    function scheduleEnterButton() {

      if (
        !videoReady ||
        entryButtonShown ||
        sceneStarted
      ) {

        return;

      }


      const elapsed =
        performance.now() -
        pageStartedAt;


      const wait =
        Math.max(
          0,
          MIN_LOADING_TIME -
          elapsed
        );


      clearTimeout(
        enterTimer
      );


      enterTimer =
        setTimeout(

          showEnterButton,

          wait

        );

    }


    /* ========================================
       MOTION PERMISSION
       ======================================== */

    async function requestMotionPermission() {

      /*
      iOS 13+：
      必須由使用者按鈕直接觸發。
      */

      if (
        typeof DeviceOrientationEvent !==
          'undefined' &&

        typeof DeviceOrientationEvent
          .requestPermission ===
          'function'
      ) {

        try {

          const result =
            await DeviceOrientationEvent
              .requestPermission();


          gyroPermission =
            result;


          return result;

        }

        catch (error) {

          gyroPermission =
            'denied';


          return 'denied';

        }

      }


      /*
      Android / 不需要 requestPermission
      */

      gyroPermission =
        'granted';


      return 'granted';

    }


    /* ========================================
       PREPARE MUSIC
       ======================================== */

    function prepareBackgroundMusic() {

      try {

        backgroundMusic.volume =
          0;


        const promise =
          backgroundMusic.play();


        if (
          promise &&
          promise.then
        ) {

          return promise
            .then(

              function() {

                musicStarted =
                  true;

              }

            )
            .catch(

              function() {

                musicStarted =
                  false;

              }

            );

        }

      }

      catch (error) {

        musicStarted =
          false;

      }


      return Promise.resolve();

    }


    /* ========================================
       MUSIC FADE IN
       ======================================== */

    function fadeInMusic() {

      if (!musicStarted) {

        return;

      }


      const start =
        performance.now();


      function step(now) {

        const progress =
          Math.min(
            1,
            (
              now -
              start
            ) /
            MUSIC_FADE_TIME
          );


        backgroundMusic.volume =
          MUSIC_TARGET_VOLUME *
          progress;


        if (
          progress <
          1
        ) {

          requestAnimationFrame(
            step
          );

        }

      }


      requestAnimationFrame(
        step
      );

    }


    /* ========================================
       ENTER 360 SCENE
       ======================================== */

    function enter360Scene() {

      if (sceneStarted) {

        return;

      }


      sceneStarted =
        true;


      startButton.style.display =
        'none';


      startButton
        .classList
        .remove('show');


      /*
      開始音樂 Fade In
      */

      fadeInMusic();


      /*
      Loading 畫面淡出
      */

      loadingScreen
        .classList
        .add('hide');


      setTimeout(

        function() {

          loadingScreen.style.display =
            'none';

        },

        FADE_TIME

      );


      /*
      顯示許願按鈕
      */

      setTimeout(

        function() {

          showWishButton();

        },

        500

      );

    }
    /* ========================================
       START 360 EXPERIENCE
       ======================================== */

    async function start360Experience() {

      if (
        experienceStarting ||
        sceneStarted
      ) {

        return;

      }


      experienceStarting =
        true;


      startButton.disabled =
        true;


      startButton.style.opacity =
        '0.65';


      /*
      必須在使用者按「進入360°體驗」
      的同一個操作中開始播放音樂，
      對 iPhone Safari 較穩定。
      */

      const musicPromise =
        prepareBackgroundMusic();


      /*
      360影片是 muted，
      所以可以嘗試直接播放。
      */

      let videoPromise =
        Promise.resolve();


      try {

        christmasVideo.muted =
          true;


        const p =
          christmasVideo.play();


        if (
          p &&
          p.then
        ) {

          videoPromise =
            p.catch(
              function() {}
            );

        }

      }

      catch (error) {

        console.warn(
          '360 video play failed:',
          error
        );

      }


      /*
      iPhone：
      按 Enter 後才顯示
      Apple 原生 Motion & Orientation
      權限視窗。
      */

      const permission =
        await requestMotionPermission();


      await Promise.allSettled([

        musicPromise,

        videoPromise

      ]);


      /*
      如果使用者不允許 Motion，
      仍然可以進入360°。

      Touch Drag / Pinch Zoom
      仍然可以使用。
      */

      if (
        permission ===
        'denied'
      ) {

        console.log(
          'Motion permission denied. Touch controls remain available.'
        );

      }


      enter360Scene();

    }


    /* ========================================
       ENTER BUTTON
       ======================================== */

    startButton.addEventListener(

      'click',

      function() {

        start360Experience();

      }

    );


    /* ========================================
       360 VIDEO READY
       ======================================== */

    function markVideoReady() {

      if (videoReady) {

        return;

      }


      videoReady =
        true;


      scheduleEnterButton();

    }


    christmasVideo.addEventListener(

      'canplay',

      markVideoReady

    );


    christmasVideo.addEventListener(

      'canplaythrough',

      markVideoReady

    );


    christmasVideo.addEventListener(

      'loadeddata',

      function() {

        if (
          christmasVideo.readyState >=
          3
        ) {

          markVideoReady();

        }

      }

    );


    /* ========================================
       PRELOAD / PLAY 360 VIDEO
       ======================================== */

    function playChristmasVideo() {

      try {

        christmasVideo.muted =
          true;


        const playPromise =
          christmasVideo.play();


        if (
          playPromise &&
          playPromise.catch
        ) {

          playPromise.catch(
            function() {

              /*
              如果 Safari 暫時阻止播放，
              使用者按 Enter 時會再播放。
              */

            }
          );

        }

      }

      catch (error) {

        console.warn(
          'Unable to preload 360 video:',
          error
        );

      }

    }


    /* ========================================
       WINDOW LOAD
       ======================================== */

    window.addEventListener(

      'load',

      function() {

        /*
        播放 Loading Video
        */

        try {

          const loadingPromise =
            loadingVideo.play();


          if (
            loadingPromise &&
            loadingPromise.catch
          ) {

            loadingPromise.catch(
              function() {}
            );

          }

        }

        catch (error) {}


        /*
        預先載入音樂，
        但不自動播放。
        */

        try {

          backgroundMusic.load();

        }

        catch (error) {}


        /*
        預先載入360影片。
        */

        try {

          christmasVideo.load();

        }

        catch (error) {}


        /*
        影片 muted，
        所以嘗試預先播放。

        Loading Screen
        此時仍然會留在最上層。
        */

        setTimeout(

          function() {

            playChristmasVideo();

          },

          500

        );

      }

    );


    /* ========================================
       VIDEO READY FALLBACK
       ======================================== */

    const videoReadyCheck =
      setInterval(

        function() {

          if (
            christmasVideo.readyState >=
            3
          ) {

            clearInterval(
              videoReadyCheck
            );


            markVideoReady();

          }

        },

        300

      );


    /* ========================================
       CAMERA FOV
       ======================================== */

    /*
    數字越大：
    畫面越 Wide / 越遠。

    數字越小：
    畫面越 Zoom In。
    */

    let currentFov =
      105;


    const MIN_FOV =
      35;


    const MAX_FOV =
      120;


    let pinchStartDistance =
      null;


    let pinchStartFov =
      currentFov;


    /* ========================================
       TOUCH DISTANCE
       ======================================== */

    function getTouchDistance(
      touch1,
      touch2
    ) {

      const dx =
        touch1.clientX -
        touch2.clientX;


      const dy =
        touch1.clientY -
        touch2.clientY;


      return Math.sqrt(

        dx * dx +
        dy * dy

      );

    }


    /* ========================================
       CHECK WHETHER USER IS USING WISH UI
       ======================================== */

    function isInWishUI(
      target
    ) {

      if (
        !target ||
        !target.closest
      ) {

        return false;

      }


      return !!target.closest(

        '#wishButton, #wishOverlay'

      );

    }


    /* ========================================
       PINCH START
       ======================================== */

    document.addEventListener(

      'touchstart',

      function(event) {

        if (
          isInWishUI(
            event.target
          )
        ) {

          return;

        }


        if (
          event.touches.length ===
          2
        ) {

          pinchStartDistance =
            getTouchDistance(

              event.touches[0],

              event.touches[1]

            );


          pinchStartFov =
            currentFov;

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       PINCH MOVE
       ======================================== */

    document.addEventListener(

      'touchmove',

      function(event) {

        if (
          isInWishUI(
            event.target
          )
        ) {

          return;

        }


        if (
          event.touches.length === 2 &&
          pinchStartDistance
        ) {

          event.preventDefault();


          const currentDistance =
            getTouchDistance(

              event.touches[0],

              event.touches[1]

            );


          const scale =
            pinchStartDistance /
            currentDistance;


          let newFov =
            pinchStartFov *
            scale;


          newFov =
            Math.max(

              MIN_FOV,

              Math.min(

                MAX_FOV,

                newFov

              )

            );


          currentFov =
            newFov;


          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       PINCH END
       ======================================== */

    document.addEventListener(

      'touchend',

      function(event) {

        if (
          event.touches.length <
          2
        ) {

          pinchStartDistance =
            null;

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       DESKTOP WHEEL ZOOM
       ======================================== */

    document.addEventListener(

      'wheel',

      function(event) {

        if (
          isInWishUI(
            event.target
          )
        ) {

          return;

        }


        event.preventDefault();


        currentFov +=
          event.deltaY *
          0.03;


        currentFov =
          Math.max(

            MIN_FOV,

            Math.min(

              MAX_FOV,

              currentFov

            )

          );


        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );

      },

      {
        passive: false
      }

    );

    /* ========================================
       FIXED BIG STAR POSITION
       ======================================== */

    /*
    這兩個數值來自 iPhone 實機校準。

    當背景的大星星放在畫面正中央時：

    Yaw   = 2.04°
    Pitch = 0.89°

    所以之後所有願望星，
    最終都會飛向這個固定的
    360°世界方向。
    */

    const BIG_STAR_YAW =
      THREE.MathUtils.degToRad(
        2.04
      );


    const BIG_STAR_PITCH =
      THREE.MathUtils.degToRad(
        0.89
      );


    /* ========================================
       CREATE ONE WISH STAR
       ======================================== */

    function createWishStar() {

      /*
      每次只建立一粒五角星。

      起點：
      使用者目前視線前方。

      終點：
      永遠是背景大星星的
      固定360°世界位置。
      */


      if (
        !sceneEl ||
        !sceneEl.object3D ||
        !sceneEl.camera
      ) {

        return;

      }


      const threeCamera =
        sceneEl.camera;


      threeCamera.updateMatrixWorld(
        true
      );


      /* ========================================
         CAMERA WORLD POSITION
         ======================================== */

      const cameraPosition =
        new THREE.Vector3();


      threeCamera.getWorldPosition(
        cameraPosition
      );


      /* ========================================
         CURRENT VIEW DIRECTION
         ======================================== */

      /*
      這個 direction 只用來決定
      願望星「由哪裡開始」。

      它不會影響最後終點。
      */

      const direction =
        new THREE.Vector3();


      threeCamera.getWorldDirection(
        direction
      );


      direction.normalize();


      /* ========================================
         START POSITION
         ======================================== */

      /*
      願望星先在使用者目前
      視線前方出現。
      */

      const startPosition =
        cameraPosition
          .clone()
          .addScaledVector(
            direction,
            3.5
          );


      /*
      稍為降低起點，
      讓星星有「升上天空」的感覺。
      */

      startPosition.y -=
        1.15;


      /* ========================================
         BIG STAR FIXED WORLD DIRECTION
         ======================================== */

      /*
      將校準得到的
      Yaw + Pitch
      轉成 THREE.js 世界方向。
      */

      const bigStarDirection =
        new THREE.Vector3(

          -Math.sin(
            BIG_STAR_YAW
          ) *
          Math.cos(
            BIG_STAR_PITCH
          ),

          Math.sin(
            BIG_STAR_PITCH
          ),

          -Math.cos(
            BIG_STAR_YAW
          ) *
          Math.cos(
            BIG_STAR_PITCH
          )

        );


      bigStarDirection.normalize();


      /* ========================================
         FINAL POSITION
         ======================================== */

      /*
      ★★★ 關鍵 ★★★

      願望星最後的位置
      永遠固定在背景大星星方向。

      18 = 星星與Camera的3D距離。

      使用者之後轉手機，
      這個位置都不會改變。
      */

      const endPosition =
        cameraPosition
          .clone()
          .addScaledVector(
            bigStarDirection,
            18
          );


      /* ========================================
         CREATE CANVAS
         ======================================== */

      const canvas =
        document.createElement(
          'canvas'
        );


      canvas.width =
        256;


      canvas.height =
        256;


      const ctx =
        canvas.getContext(
          '2d'
        );


      if (!ctx) {

        return;

      }


      ctx.clearRect(
        0,
        0,
        256,
        256
      );


      /* ========================================
         SOFT GOLDEN GLOW
         ======================================== */

      const glow =
        ctx.createRadialGradient(

          128,
          128,
          8,

          128,
          128,
          118

        );


      glow.addColorStop(

        0,

        'rgba(255,240,170,0.65)'

      );


      glow.addColorStop(

        0.42,

        'rgba(255,205,85,0.25)'

      );


      glow.addColorStop(

        1,

        'rgba(255,190,50,0)'

      );


      ctx.fillStyle =
        glow;


      ctx.fillRect(

        0,
        0,
        256,
        256

      );


      /* ========================================
         DRAW FIVE-POINT STAR
         ======================================== */

      const cx =
        128;


      const cy =
        128;


      /*
      五角星外圍大小
      */

      const outerRadius =
        68;


      /*
      五角星內圍大小
      */

      const innerRadius =
        29;


      ctx.beginPath();


      for (
        let i = 0;
        i < 10;
        i++
      ) {


        const radius =

          i % 2 === 0

            ? outerRadius

            : innerRadius;


        const angle =

          -Math.PI / 2 +

          i * Math.PI / 5;


        const x =

          cx +

          Math.cos(
            angle
          ) *

          radius;


        const y =

          cy +

          Math.sin(
            angle
          ) *

          radius;


        if (
          i === 0
        ) {


          ctx.moveTo(
            x,
            y
          );


        }

        else {


          ctx.lineTo(
            x,
            y
          );


        }


      }


      ctx.closePath();


      /* ========================================
         GOLD GRADIENT
         ======================================== */

      const starGradient =
        ctx.createLinearGradient(

          80,
          60,

          176,
          196

        );


      starGradient.addColorStop(

        0,

        '#fff6bd'

      );


      starGradient.addColorStop(

        0.48,

        '#ffd45d'

      );


      starGradient.addColorStop(

        1,

        '#e6a51a'

      );


      ctx.fillStyle =
        starGradient;


      ctx.shadowColor =
        'rgba(255,210,90,0.95)';


      ctx.shadowBlur =
        18;


      ctx.fill();


      /* ========================================
         CANVAS → THREE TEXTURE
         ======================================== */

      const texture =
        new THREE.CanvasTexture(
          canvas
        );


      texture.needsUpdate =
        true;


      /* ========================================
         CREATE THREE.JS SPRITE
         ======================================== */

      const material =
        new THREE.SpriteMaterial({

          map:
            texture,

          transparent:
            true,

          depthWrite:
            false,

          depthTest:
            false,

          opacity:
            0

        });


      const star =
        new THREE.Sprite(
          material
        );


      star.position.copy(
        startPosition
      );


      star.scale.set(

        1.15,
        1.15,
        1

      );


      /* ========================================
         ADD TO 360 WORLD
         ======================================== */

      /*
      ★ 非常重要 ★

      星星加入 A-Frame 的
      THREE.js 世界，

      不是加入 document.body。

      所以它不是黐住手機畫面的2D圖。
      */

      sceneEl.object3D.add(
        star
      );


      /* ========================================
         ONLY ONE WISH STAR
         ======================================== */

      /*
      如果上一粒願望星仍然存在，
      先移除上一粒。

      所以任何時間最多只會有
      一粒願望星。
      */

      if (

        window.currentWishStar &&

        window.currentWishStar !==
          star &&

        window.currentWishStar.parent

      ) {


        window.currentWishStar
          .parent
          .remove(

            window.currentWishStar

          );


      }


      window.currentWishStar =
        star;


      /* ========================================
         ANIMATION SETTINGS
         ======================================== */

      const animationStart =
        performance.now();


      /*
      升上大星星位置：

      2.6秒
      */

      const STAR_RISE_TIME =
        2600;


      /*
      到達背景大星星後：

      停留4秒
      */

      const STAR_HOLD_TIME =
        4000;


      /*
      最後：

      0.8秒淡出
      */

      const STAR_FADE_TIME =
        800;


      /* ========================================
         STAR ANIMATION
         ======================================== */

      function animateWishStar(
        now
      ) {


        const elapsed =

          now -
          animationStart;


        /* ========================================
           STAGE 1
           FLY TO BIG STAR
           ======================================== */

        if (
          elapsed <
          STAR_RISE_TIME
        ) {


          let progress =

            elapsed /
            STAR_RISE_TIME;


          /*
          Ease Out Cubic
          */

          progress =

            1 -

            Math.pow(

              1 - progress,

              3

            );


          /*
          從使用者眼前，
          飛向背景大星星。
          */

          star.position
            .lerpVectors(

              startPosition,

              endPosition,

              progress

            );


          /*
          開始時 Fade In
          */

          material.opacity =

            Math.min(

              1,

              elapsed /
              350

            );


          /*
          因為星星越飛越遠，
          稍為放大補償視覺大小。
          */

          const scale =

            1.15 +

            progress *
            1.55;


          star.scale.set(

            scale,
            scale,
            1

          );


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ========================================
           STAGE 2
           FIXED ON BIG STAR
           ======================================== */

        if (

          elapsed <

          STAR_RISE_TIME +
          STAR_HOLD_TIME

        ) {


          /*
          ★★★ 關鍵 ★★★

          到達後，
          永遠使用同一個 endPosition。

          這裡完全不再讀取：
          - Camera方向
          - 手機方向
          - Touch Drag
          - Device Orientation

          所以願望星會固定在
          背景大星星的360°位置。
          */

          star.position.copy(
            endPosition
          );


          /*
          只做很輕微的亮度閃爍。

          不移動位置。
          */

          const twinkle =

            0.88 +

            Math.sin(

              elapsed *
              0.007

            ) *

            0.12;


          material.opacity =
            twinkle;


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ========================================
           STAGE 3
           FADE OUT
           ======================================== */

        const fadeProgress =

          (

            elapsed -

            STAR_RISE_TIME -

            STAR_HOLD_TIME

          ) /

          STAR_FADE_TIME;


        if (
          fadeProgress <
          1
        ) {


          /*
          淡出期間仍然固定
          在背景大星星位置。
          */

          star.position.copy(
            endPosition
          );


          material.opacity =

            Math.max(

              0,

              1 -
              fadeProgress

            );


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ========================================
           REMOVE STAR
           ======================================== */

        if (
          star.parent
        ) {

          star.parent.remove(
            star
          );

        }


        if (

          window.currentWishStar ===
          star

        ) {

          window.currentWishStar =
            null;

        }


        material.dispose();


        texture.dispose();

    }


      requestAnimationFrame(
        animateWishStar
      );

    }


    /* ========================================
       DEVICE ID
       ======================================== */

    function randomId() {

      return (

        Date.now()
          .toString(36) +

        '-' +

        Math.random()
          .toString(36)
          .slice(2, 10)

      );

    }


    function getDeviceId() {

      const KEY =
        'xmas360-device-id';


      try {


        let id =
          localStorage.getItem(
            KEY
          );


        if (!id) {


          id =
            randomId();


          localStorage.setItem(
            KEY,
            id
          );


        }


        return id;


      }

      catch (error) {


        if (!wishSessionId) {

          wishSessionId =
            randomId();

        }


        return wishSessionId;

      }

    }


    /* ========================================
       SEND WISH TO GOOGLE SHEET
       ======================================== */

    function sendWishToGoogleSheet(
      text
    ) {

      if (!WISH_ENDPOINT) {

        return;

      }


      try {


        const body =
          new URLSearchParams();


        body.append(
          'wish',
          text
        );


        body.append(
          'deviceId',
          getDeviceId()
        );


        body.append(
          'timestamp',
          new Date()
            .toISOString()
        );


        fetch(

          WISH_ENDPOINT,

          {

            method:
              'POST',

            mode:
              'no-cors',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              body.toString(),

            keepalive:
              true

          }

        ).catch(

          function(error) {

            console.warn(
              'Wish upload failed:',
              error
            );

          }

        );


      }

      catch (error) {


        console.warn(
          'Wish upload error:',
          error
        );


      }

    }

       SUBMIT WISH

      const text =

      if (!text) {

        return;

      }


      /*
      傳送願望到 Google Sheet

      sendWishToGoogleSheet(

      );

        function() {


          /*
          建立唯一一粒五角星，
          飛向固定的大星星位置。
          */

          createWishStar();


          /*
          顯示成功訊息。
          */

          showWishToast();


        }

      );

    }

    /* ========================================
       RESUME MEDIA
       ======================================== */

    function resumeMedia() {

      if (!sceneStarted) {

        return;

      }


      /* 恢復360°影片 */

      try {

        if (
          christmasVideo.paused
        ) {

          const videoPromise =
            christmasVideo.play();


          if (
            videoPromise &&
            videoPromise.catch
          ) {

            videoPromise.catch(
              function() {}
            );

          }

        }

      }

      catch (error) {}


      /* 恢復背景音樂 */

      try {

        if (
          musicStarted &&
          backgroundMusic.paused
        ) {

          const musicPromise =
            backgroundMusic.play();


          if (
            musicPromise &&
            musicPromise.catch
          ) {

            musicPromise.catch(
              function() {}
            );

          }

        }

      }

      catch (error) {}

    }


    /* ========================================
       PAGE VISIBILITY
       ======================================== */

    document.addEventListener(

      'visibilitychange',

      function() {

        if (
          document.visibilityState ===
          'visible'
        ) {

          resumeMedia();

        }

      }

    );


    /* ========================================
       PAGE SHOW
       ======================================== */

    window.addEventListener(

      'pageshow',

      function() {

        if (sceneStarted) {

          setTimeout(

            function() {

              resumeMedia();

            },

            100

          );

        }

      }

    );


    /* ========================================
       WINDOW FOCUS
       ======================================== */

    window.addEventListener(

      'focus',

      function() {

        if (sceneStarted) {

          resumeMedia();

        }

      }

    );


    /* ========================================
       PREVENT DOUBLE TAP ZOOM
       ======================================== */

    let lastTouchEnd =
      0;


    document.addEventListener(

      'touchend',

      function(event) {

        /*
        許願介面內不阻止操作。
        */

        if (
          isInWishUI(
            event.target
          )
        ) {

          return;

        }


        const now =
          Date.now();


        if (
          now -
          lastTouchEnd <=
          300
        ) {

          event.preventDefault();

        }


        lastTouchEnd =
          now;

      },

      {
        passive: false
      }

    );


    /* ========================================
       ORIENTATION CHANGE
       ======================================== */

    window.addEventListener(

      'orientationchange',

      function() {

        setTimeout(

          function() {

            window.dispatchEvent(

              new Event(
                'resize'
              )

            );

          },

          300

        );

      }

    );


    /* ========================================
       VIDEO ERROR
       ======================================== */

    christmasVideo.addEventListener(

      'error',

      function(event) {

        console.error(
          'Christmas 360 video error:',
          event
        );

      }

    );


    /* ========================================
       LOADING VIDEO ERROR
       ======================================== */

    loadingVideo.addEventListener(

      'error',

      function(event) {

        console.error(
          'Loading video error:',
          event
        );

      }

    );


    /* ========================================
       BACKGROUND MUSIC ERROR
       ======================================== */

    backgroundMusic.addEventListener(

      'error',

      function(event) {

        console.error(
          'Background music error:',
          event
        );

      }

    );


    /* ========================================
       USER INTERACTION FALLBACK
       ======================================== */

    function resumeMediaAfterInteraction() {

      if (!sceneStarted) {

        return;

      }


      resumeMedia();

    }


    document.addEventListener(

      'pointerdown',

      resumeMediaAfterInteraction,

      {
        passive: true
      }

    );


    /* ========================================
       A-FRAME SCENE READY
       ======================================== */

    if (sceneEl) {

      sceneEl.addEventListener(

        'loaded',

        function() {

          /*
          確保開場 FOV 正確。
          */

          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


          /*
          如果360影片已經 Ready，
          就可以準備顯示 Enter Button。
          */

          if (
            christmasVideo.readyState >=
            3
          ) {

            markVideoReady();

          }

        }

      );

    }


    /* ========================================
       INITIAL WISH COUNT
       ======================================== */

    updateWishCount();


    /* ========================================
       INITIAL CAMERA FOV
       ======================================== */

    camera.setAttribute(

      'camera',

      'fov',

      currentFov

    );


    /* ========================================
       EXTRA VIDEO READY FALLBACK
       ======================================== */

    /*
    某些 iPhone Safari
    canplay / canplaythrough
    觸發時間可能比較不穩定。

    所以每300ms檢查一次 readyState。
    */

    let readyAttempts =
      0;


    const readyStateTimer =
      setInterval(

        function() {

          readyAttempts++;


          if (
            christmasVideo.readyState >=
            3
          ) {

            clearInterval(
              readyStateTimer
            );


            markVideoReady();


            return;

          }


          /*
          最多檢查約30秒。
          */

          if (
            readyAttempts >
            100
          ) {

            clearInterval(
              readyStateTimer
            );

          }

        },

        300

      );


    /* ========================================
       PAGE HIDE
       ======================================== */

    window.addEventListener(

      'pagehide',

      function() {

        if (enterTimer) {

          clearTimeout(
            enterTimer
          );

        }

      }

    );


  </script>

</body>

</html>
