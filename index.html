<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

    }


    /* ========================================
       LOADING SCREEN
       ======================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      transition: opacity 1.5s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      pointer-events: none;

    }


    /* ========================================
       LOADING VIDEO
       ======================================== */

    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

    }


    /* ========================================
       ENTER BUTTON
       ======================================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 100px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 14px 28px;

      border: none;
      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      display: none;

      cursor: pointer;

      white-space: nowrap;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

    }


    /* ========================================
       A-FRAME
       ======================================== */

    a-scene {

      width: 100%;
      height: 100%;

    }


    /* ========================================
       WISH BUTTON
       ======================================== */

    #wishButton {

      position: fixed;

      right:
        calc(
          18px +
          env(safe-area-inset-right, 0px)
        );

      bottom:
        calc(
          26px +
          env(safe-area-inset-bottom, 0px)
        );

      z-index: 10001;

      display: none;

      align-items: center;

      gap: 6px;

      padding: 12px 22px;

      border: none;

      border-radius: 30px;

      background:
        rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 0 0 1px
        rgba(255,215,120,0.55),

        0 4px 18px
        rgba(255,200,90,0.35);

      opacity: 0;

      transform:
        translateY(12px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;

      -webkit-tap-highlight-color:
        transparent;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

    }


    #wishButton.show {

      opacity: 1;

      transform:
        translateY(0);

      animation:
        wishGlow
        3.2s
        ease-in-out
        0.6s
        infinite;

    }


    #wishButton:active {

      transform:
        scale(0.96);

    }


    #wishButton .wishIcon {

      color: #d9a520;

      font-size: 18px;

      line-height: 1;

    }


    .wishButtonText {

      display: flex;

      flex-direction: column;

      align-items: center;

      line-height: 1.05;

    }


    .wishButtonZh {

      font-size: 16px;

    }


    .wishButtonEn {

      margin-top: 3px;

      font-size: 9px;

      letter-spacing: 0.8px;

      opacity: 0.72;

      text-transform: uppercase;

    }


    @keyframes wishGlow {

      0%,
      100% {

        box-shadow:

          0 0 0 1px
          rgba(255,215,120,0.55),

          0 4px 18px
          rgba(255,200,90,0.30);

      }


      50% {

        box-shadow:

          0 0 0 1px
          rgba(255,215,120,0.85),

          0 4px 26px
          rgba(255,200,90,0.60);

      }

    }


    /* ========================================
       WISH OVERLAY
       ======================================== */

    #wishOverlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 10002;

      display: none;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      padding:

        calc(
          16px +
          env(safe-area-inset-top, 0px)
        )

        calc(
          16px +
          env(safe-area-inset-right, 0px)
        )

        calc(
          16px +
          env(safe-area-inset-bottom, 0px)
        )

        calc(
          16px +
          env(safe-area-inset-left, 0px)
        );

      background:
        rgba(0,0,0,0.35);

      -webkit-backdrop-filter:
        blur(2px);

      backdrop-filter:
        blur(2px);

      opacity: 0;

      transition:
        opacity 0.25s ease;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

    }


    #wishOverlay.open {

      opacity: 1;

    }


    /* ========================================
       WISH PANEL
       ======================================== */

    #wishPanel {

      width: 100%;

      max-width: 360px;

      box-sizing: border-box;

      padding:
        20px 18px 16px;

      border-radius: 22px;

      background:
        rgba(255,255,255,0.95);

      color: #222;

      box-shadow:

        0 0 0 1px
        rgba(255,215,120,0.6),

        0 10px 40px
        rgba(0,0,0,0.35);

      transform:
        translateY(10px)
        scale(0.98);

      transition:
        transform 0.25s ease;

    }


    #wishOverlay.open
    #wishPanel {

      transform:
        translateY(0)
        scale(1);

    }


    #wishTitle {

      margin:
        0 0 15px;

      text-align: center;

      font-weight: 600;

      color: #a8750a;

    }


    .wishTitleZh {

      display: block;

      font-size: 20px;

      letter-spacing: 2px;

    }


    .wishTitleEn {

      display: block;

      margin-top: 5px;

      font-size: 10px;

      letter-spacing: 1.8px;

      font-weight: 500;

      opacity: 0.68;

    }


    /* ========================================
       WISH TEXTAREA
       ======================================== */

    #wishText {

      width: 100%;

      box-sizing: border-box;

      min-height: 100px;

      resize: none;
      border:
        1px solid
        rgba(180,140,60,0.28);

      border-radius: 14px;

      padding:
        13px 14px;

      background:
        rgba(255,255,255,0.92);

      color: #222;

      font-size: 16px;

      line-height: 1.45;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      outline: none;

      -webkit-appearance: none;

      appearance: none;

    }


    #wishText:focus {

      border-color:
        rgba(210,160,45,0.72);

      box-shadow:
        0 0 0 3px
        rgba(255,210,90,0.15);

    }


    #wishText::placeholder {

      color:
        rgba(70,70,70,0.48);

    }


    /* ========================================
       WISH COUNT
       ======================================== */

    #wishCount {

      margin-top: 6px;

      text-align: right;

      font-size: 11px;

      color:
        rgba(60,60,60,0.55);

    }


    /* ========================================
       WISH NOTE
       ======================================== */

    #wishNote {

      margin-top: 10px;

      text-align: center;

      color:
        rgba(80,70,50,0.72);

      line-height: 1.35;

    }


    .wishNoteZh {

      display: block;

      font-size: 12px;

    }


    .wishNoteEn {

      display: block;

      margin-top: 3px;

      font-size: 9px;

      letter-spacing: 0.25px;

      opacity: 0.72;

    }


    /* ========================================
       WISH ACTIONS
       ======================================== */

    #wishActions {

      display: flex;

      gap: 10px;

      margin-top: 16px;

    }


    #wishActions button {

      flex: 1;

      min-height: 44px;

      border: none;

      border-radius: 22px;

      font-size: 14px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

      touch-action:
        manipulation;

    }


    #wishCancel {

      background:
        rgba(0,0,0,0.07);

      color: #555;

    }


    #wishSubmit {

      background:
        linear-gradient(
          135deg,
          #e9b83d,
          #c78c18
        );

      color: white;

      box-shadow:
        0 4px 14px
        rgba(190,130,20,0.28);

    }


    #wishSubmit:disabled {

      opacity: 0.45;

      cursor: default;

      box-shadow: none;

    }


    /* ========================================
       WISH SUCCESS MESSAGE
       ======================================== */

    #wishToast {

      position: fixed;

      left: 50%;

      top:
        calc(
          24px +
          env(safe-area-inset-top, 0px)
        );

      transform:
        translateX(-50%)
        translateY(-15px);

      z-index: 10003;

      box-sizing: border-box;

      width:
        calc(100% - 40px);

      max-width: 330px;

      padding:
        11px 18px;

      border-radius: 18px;

      background:
        rgba(255,255,255,0.94);

      color:
        #9b6c0a;

      text-align:
        center;

      font-size:
        15px;

      line-height:
        1.35;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,0.25);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;

    }


    #wishToast.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);

    }

  </style>

</head>


<body>


  <!-- ========================================
       LOADING SCREEN
       ======================================== -->

  <div id="loadingScreen">

    <video
      id="loadingVideo"
      src="loading_3.mp4"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline>
    </video>


    <button
      id="startButton"
      type="button">

      進入360°體驗
      <br>

      <span
        style="
          font-size:10px;
          opacity:0.7;
          letter-spacing:1px;
        ">

        ENTER 360° EXPERIENCE

      </span>

    </button>

  </div>


  <!-- ========================================
       BACKGROUND MUSIC
       ======================================== -->

  <audio
    id="backgroundMusic"
    src="christmassong2025.mp3"
    preload="auto"
    loop>
  </audio>


  <!-- ========================================
       WISH BUTTON
       ======================================== -->

  <button
    id="wishButton"
    type="button"
    aria-label="許願 Wish">

    <span class="wishIcon">
      ✦
    </span>

    <span class="wishButtonText">

      <span class="wishButtonZh">
        許願
      </span>

      <span class="wishButtonEn">
        Wish
      </span>

    </span>

  </button>


  <!-- ========================================
       WISH PANEL
       ======================================== -->

  <div
    id="wishOverlay"
    aria-hidden="true">

    <div
      id="wishPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="wishTitle">


      <h2 id="wishTitle">

        <span class="wishTitleZh">

          <span>✦</span>

          聖誕許願

          <span>✦</span>

        </span>


        <span class="wishTitleEn">

          CHRISTMAS WISH

        </span>

      </h2>


      <textarea
        id="wishText"
        maxlength="60"
        rows="3"
        placeholder="寫低你嘅聖誕願望…&#10;Write your Christmas wish…"
        enterkeyhint="send"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"></textarea>


      <div id="wishCount">
        0 / 60
      </div>


      <div
        id="wishNote"
        hidden>

        <span class="wishNoteZh">

          你嘅願望會匿名傳送俾主辦單位

        </span>

        <span class="wishNoteEn">

          Your wish will be sent anonymously to the organizer.

        </span>

      </div>


      <div id="wishActions">

        <button
          id="wishCancel"
          type="button">

          取消 Cancel

        </button>


        <button
          id="wishSubmit"
          type="button"
          disabled>

          送出 Send

        </button>

      </div>

    </div>

  </div>


  <!-- ========================================
       WISH SUCCESS MESSAGE
       ======================================== -->

  <div
    id="wishToast"
    role="status"
    aria-live="polite">

    願望已經送上天 ✨

    <br>

    <span style="font-size:13px;">

      Your wish has been sent to the stars.

    </span>

  </div>


  <!-- ========================================
       360 SCENE
       ======================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    loading-screen="enabled: false">


    <a-assets timeout="60000">

      <video

        id="christmasVideo"

        src="Christmas ar_v2c.mp4"

        preload="auto"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>

    </a-assets>


    <a-videosphere

      src="#christmasVideo"

      rotation="0 -90 0">

    </a-videosphere>


    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>


  <script>


    /* ========================================
       ELEMENTS
       ======================================== */

    const loadingScreen =
      document.querySelector('#loadingScreen');

    const loadingVideo =
      document.querySelector('#loadingVideo');

    const christmasVideo =
      document.querySelector('#christmasVideo');

    const backgroundMusic =
      document.querySelector('#backgroundMusic');

    const startButton =
      document.querySelector('#startButton');

    const camera =
      document.querySelector('#camera');

    const sceneEl =
      document.querySelector('a-scene');


    /* ========================================
       LOADING SETTINGS
       ======================================== */

    const MIN_LOADING_TIME = 3000;

    const FADE_TIME = 1500;

    const loadingStartTime =
      Date.now();

    let sceneStarted = false;

    let videoReady = false;

    let enterTimer = null;

    let enterButtonScheduled = false;

    let experienceStarting = false;


    /* ========================================
       BACKGROUND MUSIC
       ======================================== */

    const MUSIC_TARGET_VOLUME = 0.6;

    const MUSIC_FADE_TIME = 2000;

    let musicStarted = false;

    let musicFadeTimer = null;


    /* ========================================
       CAMERA / ZOOM SETTINGS
       ======================================== */

    let currentFov = 105;

    const minFov = 35;

    const maxFov = 120;


    /* ========================================
       WISH SETTINGS
       ======================================== */

    const WISH_ENDPOINT =
      'https://script.google.com/macros/s/AKfycbyCrBzBm5rgP0bsMPkpZ6HBzHGnrUgRfNm3-6aAEQH4u4ZQY8tUB2qT-0DPwjjX9uTI/exec';

    const WISH_MAX_LENGTH = 60;


    /* ========================================
       BIG STAR TARGET
       ======================================== */

    const BIG_STAR_YAW =
      THREE.MathUtils.degToRad(2.04);

    const BIG_STAR_PITCH =
      THREE.MathUtils.degToRad(30.89);


    /* ========================================
       WISH ELEMENTS
       ======================================== */

    const wishButton =
      document.querySelector('#wishButton');

    const wishOverlay =
      document.querySelector('#wishOverlay');

    const wishPanel =
      document.querySelector('#wishPanel');

    const wishText =
      document.querySelector('#wishText');

    const wishCount =
      document.querySelector('#wishCount');

    const wishNote =
      document.querySelector('#wishNote');

    const wishCancel =
      document.querySelector('#wishCancel');

    const wishSubmit =
      document.querySelector('#wishSubmit');

    const wishToast =
      document.querySelector('#wishToast');

    let wishPanelOpen = false;

    let wishToastTimer = null;


    /* ========================================
       SHOW ENTER BUTTON
       ======================================== */

    function showEnterButton() {

      if (
        sceneStarted ||
        experienceStarting
      ) {
        return;
      }

      startButton.style.display =
        'block';

    }


    /* ========================================
       CHECK IF READY
       ======================================== */

    function scheduleEnterButton() {

      if (
        !videoReady ||
        enterButtonScheduled ||
        sceneStarted
      ) {
        return;
      }

      enterButtonScheduled = true;

      const elapsed =
        Date.now() -
        loadingStartTime;

      const remaining =
        Math.max(
          0,
          MIN_LOADING_TIME -
          elapsed
        );

      enterTimer =
        setTimeout(
          function() {

            showEnterButton();

          },
          remaining
        );

    }


    /* ========================================
       360 VIDEO READY
       ======================================== */

    function markVideoReady() {

      if (videoReady) {
        return;
      }

      videoReady = true;

      scheduleEnterButton();

    }


    christmasVideo.addEventListener(
      'canplay',
      markVideoReady
    );


    christmasVideo.addEventListener(
      'canplaythrough',
      markVideoReady
    );


    christmasVideo.addEventListener(
      'loadeddata',
      function() {

        if (
          christmasVideo.readyState >= 3
        ) {

          markVideoReady();

        }

      }
    );


    /* ========================================
       PRELOAD 360 VIDEO
       ======================================== */

    function prepareChristmasVideo() {

      try {

        christmasVideo.muted =
          true;

        const playPromise =
          christmasVideo.play();

        if (
          playPromise &&
          playPromise.catch
        ) {

          playPromise.catch(
            function() {}
          );

        }

      }

      catch (error) {

        console.warn(
          '360 video preload failed:',
          error
        );

      }

    }
    /* ========================================
       PREPARE BACKGROUND MUSIC
       ======================================== */

    function prepareBackgroundMusic() {

      try {

        backgroundMusic.volume = 0;

        const playPromise =
          backgroundMusic.play();

        if (
          playPromise &&
          playPromise.then
        ) {

          return playPromise

            .then(
              function() {

                musicStarted = true;

              }
            )

            .catch(
              function() {

                musicStarted = false;

              }
            );

        }

      }

      catch (error) {

        musicStarted = false;

      }

      return Promise.resolve();

    }


    /* ========================================
       FADE IN MUSIC
       ======================================== */

    function fadeInMusic() {

      if (!musicStarted) {
        return;
      }

      if (musicFadeTimer) {

        cancelAnimationFrame(
          musicFadeTimer
        );

      }

      const startTime =
        performance.now();


      function fadeStep(now) {

        const progress =
          Math.min(
            1,
            (
              now -
              startTime
            ) /
            MUSIC_FADE_TIME
          );

        backgroundMusic.volume =
          MUSIC_TARGET_VOLUME *
          progress;

        if (
          progress < 1
        ) {

          musicFadeTimer =
            requestAnimationFrame(
              fadeStep
            );

        }

        else {

          musicFadeTimer = null;

        }

      }


      musicFadeTimer =
        requestAnimationFrame(
          fadeStep
        );

    }


    /* ========================================
       REQUEST MOTION PERMISSION
       ======================================== */

    function requestMotionPermission() {

      if (

        typeof DeviceOrientationEvent !==
          'undefined' &&

        typeof DeviceOrientationEvent
          .requestPermission ===
          'function'

      ) {

        return DeviceOrientationEvent
          .requestPermission()

          .then(
            function(permissionState) {

              return permissionState;

            }
          )

          .catch(
            function(error) {

              console.warn(
                'Motion permission error:',
                error
              );

              return 'denied';

            }
          );

      }

      return Promise.resolve(
        'granted'
      );

    }


    /* ========================================
       ENTER 360 SCENE
       ======================================== */

    function enter360Scene() {

      if (sceneStarted) {
        return;
      }

      sceneStarted = true;

      startButton.style.display =
        'none';

      fadeInMusic();

      loadingScreen.classList.add(
        'hide'
      );

      setTimeout(
        function() {

          loadingScreen.style.display =
            'none';

        },
        FADE_TIME
      );

      setTimeout(
        function() {

          showWishButton();

        },
        500
      );

    }


    /* ========================================
       START EXPERIENCE
       ======================================== */

    function start360Experience() {

      if (
        experienceStarting ||
        sceneStarted
      ) {
        return;
      }

      experienceStarting = true;

      startButton.disabled = true;


      /*
      必須在使用者按下按鈕的
      同一個 gesture 中開始音樂。
      這對 iPhone Safari 很重要。
      */

      const musicPromise =
        prepareBackgroundMusic();


      try {

        christmasVideo.muted =
          true;

        const videoPromise =
          christmasVideo.play();

        if (
          videoPromise &&
          videoPromise.catch
        ) {

          videoPromise.catch(
            function() {}
          );

        }

      }

      catch (error) {}


      /*
      iPhone 會在這裡顯示
      Allow Motion & Orientation
      的原生提示。
      */

      requestMotionPermission()

        .then(
          function(permissionState) {

            if (
              permissionState ===
              'denied'
            ) {

              console.log(
                'Motion permission denied.'
              );

            }

            return musicPromise;

          }
        )

        .then(
          function() {

            enter360Scene();

          }
        )

        .catch(
          function(error) {

            console.warn(
              'Start experience error:',
              error
            );

            enter360Scene();

          }
        );

    }


    /* ========================================
       START BUTTON
       ======================================== */

    startButton.addEventListener(
      'click',
      function(event) {

        event.preventDefault();

        start360Experience();

      }
    );


    /* ========================================
       PAGE LOAD
       ======================================== */

    window.addEventListener(
      'load',
      function() {

        try {

          const loadingPromise =
            loadingVideo.play();

          if (
            loadingPromise &&
            loadingPromise.catch
          ) {

            loadingPromise.catch(
              function() {}
            );

          }

        }

        catch (error) {}


        try {

          backgroundMusic.load();

        }

        catch (error) {}


        setTimeout(
          function() {

            prepareChristmasVideo();

          },
          300
        );

       VIDEO READY FALLBACK
       ======================================== */

    const videoReadyTimer =
      setInterval(
        function() {

          ) {

              videoReadyTimer
            );

            markVideoReady();

      );


    /* ========================================
       PINCH ZOOM
       ======================================== */

    let pinchStartDistance =
      null;

    let pinchStartFov =
      currentFov;


    function getTouchDistance(
      touch1,
      touch2
    ) {

      const dx =
        touch1.clientX -
        touch2.clientX;

      const dy =
        touch1.clientY -
        touch2.clientY;

      return Math.sqrt(
        dx * dx +
        dy * dy
      );

    }


    /* ========================================
       CHECK WISH UI
       ======================================== */

    function isWishUI(target) {

      if (
        !target ||
        !target.closest
      ) {
        return false;
      }

      return !!target.closest(
        '#wishButton, #wishOverlay'
      );

    }


    /* ========================================
       PINCH START
       ======================================== */

    document.addEventListener(
      'touchstart',
      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }

        if (
          event.touches.length === 2
        ) {

          pinchStartDistance =
            getTouchDistance(
              event.touches[0],
              event.touches[1]
            );

          pinchStartFov =
            currentFov;

        }

      },
      {
        passive: false
      }
    );


    /* ========================================
       PINCH MOVE
       ======================================== */

    document.addEventListener(
      'touchmove',
      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }

        if (
          event.touches.length === 2 &&
          pinchStartDistance
        ) {

          event.preventDefault();

          const currentDistance =
            getTouchDistance(
              event.touches[0],
              event.touches[1]
            );

          const ratio =
            pinchStartDistance /
            currentDistance;

          let newFov =
            pinchStartFov *
            ratio;

          newFov =
            Math.max(
              minFov,
              Math.min(
                maxFov,
                newFov
              )
            );

          currentFov =
            newFov;

          camera.setAttribute(
            'camera',
            'fov',
            currentFov
          );

        }

      },
      {
        passive: false
      }
    );


    /* ========================================
       PINCH END
       ======================================== */

    document.addEventListener(
      'touchend',
      function(event) {

        if (
          event.touches.length < 2
        ) {

          pinchStartDistance =
            null;

        }

      },
      {
        passive: false
      }
    );


    /* ========================================
       DESKTOP MOUSE WHEEL ZOOM
       ======================================== */

    document.addEventListener(
      'wheel',
      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }

        event.preventDefault();

        currentFov +=
          event.deltaY *
          0.03;

        currentFov =
          Math.max(
            minFov,
            Math.min(
              maxFov,
              currentFov
            )
          );

        camera.setAttribute(
          'camera',
          'fov',
          currentFov
        );

      },
      {
        passive: false
      }
    );

    /* ========================================
       RANDOM ID
       ======================================== */

    function randomId() {

      return (

        Date.now()
          .toString(36) +

        '-' +

        Math.random()
          .toString(36)
          .slice(2, 10)

      );

    }


    /* ========================================
       DEVICE ID
       ======================================== */

    function getDeviceId() {

      const key =
        'christmas360_device_id';

      try {

        let id =
          localStorage.getItem(
            key
          );

        if (!id) {

          id =
            randomId();

          localStorage.setItem(
            key,
            id
          );

        }

        return id;

      }

      catch (error) {

        return randomId();

      }

    }


    /* ========================================
       WISH STAR SETTINGS

       每一個願望 = 1 粒五角星
       最多同時保留 5 粒
       第 6 粒出現時，
       最舊的一粒會淡出。
       ======================================== */

    const MAX_WISH_STARS = 5;

    const wishStars = [];


    /*
    5個位置以大星星為中心分布。
    這樣5粒許願星不會完全重疊。
    */

    const WISH_STAR_OFFSETS = [

      {
        yaw: -7.0,
        pitch: -1.5
      },

      {
        yaw: -3.5,
        pitch: 2.0
      },

      {
        yaw: 0.0,
        pitch: 0.0
      },

      {
        yaw: 3.5,
        pitch: 2.2
      },

      {
        yaw: 7.0,
        pitch: -1.0
      }

    ];


    /* ========================================
       REMOVE WISH STAR
       ======================================== */

    function removeWishStar(
      record,
      duration = 700
    ) {

      if (
        !record ||
        !record.star ||
        record.removing
      ) {
        return;
      }

      record.removing = true;

      const star =
        record.star;

      const material =
        star.material;

      const startOpacity =
        material.opacity;

      const startTime =
        performance.now();


      function fade(now) {

        const progress =
          Math.min(
            (
              now -
              startTime
            ) /
            duration,
            1
          );

        material.opacity =
          startOpacity *
          (1 - progress);


        if (
          progress < 1
        ) {

          requestAnimationFrame(
            fade
          );

        }

        else {

          if (
            star.parent
          ) {

            star.parent.remove(
              star
            );

          }


          if (
            material.map
          ) {

            material.map.dispose();

          }


          material.dispose();

        }

      }


      requestAnimationFrame(
        fade
      );

    }


    /* ========================================
       CREATE WISH STAR
       ======================================== */

    function createWishStar() {

      if (
        !sceneEl ||
        !sceneEl.object3D ||
        !sceneEl.camera
      ) {

        console.warn(
          '360 scene / camera not ready.'
        );

        return;

      }


      const threeCamera =
        sceneEl.camera;

      threeCamera.updateMatrixWorld(
        true
      );


      /* ========================================
         START POSITION
         ======================================== */

      const cameraPosition =
        new THREE.Vector3();

      threeCamera.getWorldPosition(
        cameraPosition
      );


      const viewDirection =
        new THREE.Vector3();

      threeCamera.getWorldDirection(
        viewDirection
      );

      viewDirection.normalize();


      /*
      星星由目前畫面前方較低位置開始。
      */

      const startPosition =
        cameraPosition
          .clone()
          .addScaledVector(
            viewDirection,
            3.5
          );

      startPosition.y -=
        1.15;


      /* ========================================
         MAXIMUM 5 STARS
         ======================================== */

      let slotIndex;


      if (
        wishStars.length >=
        MAX_WISH_STARS
      ) {

        /*
        移除最舊的一粒。
        */

        const oldest =
          wishStars.shift();


        /*
        新星使用最舊星原本的位置。
        */

        slotIndex =
          oldest.slotIndex;


        removeWishStar(
          oldest,
          700
        );

      }

      else {

        /*
        找目前未使用的位置。
        */

        const usedSlots =
          new Set(
            wishStars.map(
              function(item) {

                return item.slotIndex;

              }
            )
          );


        slotIndex =
          [0, 1, 2, 3, 4]
            .find(
              function(index) {

                return !usedSlots.has(
                  index
                );

              }
            );


        if (
          slotIndex === undefined
        ) {

          slotIndex = 0;

        }

      }


      /* ========================================
         FINAL TARGET
         ======================================== */

      const offset =
        WISH_STAR_OFFSETS[
          slotIndex
        ];


      const targetYaw =
        BIG_STAR_YAW +
        THREE.MathUtils.degToRad(
          offset.yaw
        );


      const targetPitch =
        BIG_STAR_PITCH +
        THREE.MathUtils.degToRad(
          offset.pitch
        );


      const targetDirection =
        new THREE.Vector3(

          -Math.sin(
            targetYaw
          ) *
          Math.cos(
            targetPitch
          ),

          Math.sin(
            targetPitch
          ),

          -Math.cos(
            targetYaw
          ) *
          Math.cos(
            targetPitch
          )

        ).normalize();


      /*
      直接使用世界座標，
      所以星星不會跟著Camera移動。
      */

      const endPosition =
        targetDirection
          .clone()
          .multiplyScalar(
            18
          );


      /* ========================================
         CREATE STAR CANVAS
         ======================================== */

      const starCanvas =
        document.createElement(
          'canvas'
        );

      starCanvas.width = 256;
      starCanvas.height = 256;


      const ctx =
        starCanvas.getContext(
          '2d'
        );


      if (!ctx) {
        return;
      }


      ctx.clearRect(
        0,
        0,
        256,
        256
      );


      /* ========================================
         GOLDEN GLOW
         ======================================== */

      const glow =
        ctx.createRadialGradient(
          128,
          128,
          8,
          128,
          128,
          120
        );


      glow.addColorStop(
        0,
        'rgba(255,245,180,0.95)'
      );

      glow.addColorStop(
        0.22,
        'rgba(255,220,90,0.55)'
      );

      glow.addColorStop(
        0.55,
        'rgba(255,190,40,0.18)'
      );

      glow.addColorStop(
        1,
        'rgba(255,180,20,0)'
      );


      ctx.fillStyle =
        glow;

      ctx.fillRect(
        0,
        0,
        256,
        256
      );


      /* ========================================
         DRAW FIVE-POINT STAR
         ======================================== */

      function drawFivePointStar(
        context,
        centerX,
        centerY,
        outerRadius,
        innerRadius
      ) {

        let rotation =
          -Math.PI / 2;

        const step =
          Math.PI / 5;


        context.beginPath();


        for (
          let i = 0;
          i < 10;
          i++
        ) {

          const radius =
            i % 2 === 0
              ? outerRadius
              : innerRadius;


          const x =
            centerX +
            Math.cos(
              rotation
            ) *
            radius;


          const y =
            centerY +
            Math.sin(
              rotation
            ) *
            radius;


          if (
            i === 0
          ) {

            context.moveTo(
              x,
              y
            );

          }

          else {

            context.lineTo(
              x,
              y
            );

          }


          rotation +=
            step;

        }


        context.closePath();

      }


      drawFivePointStar(
        ctx,
        128,
        128,
        66,
        28
      );


      ctx.shadowColor =
        'rgba(255,220,80,0.95)';

      ctx.shadowBlur = 18;


      const starGradient =
        ctx.createLinearGradient(
          128,
          62,
          128,
          194
        );


      starGradient.addColorStop(
        0,
        '#fff7b0'
      );

      starGradient.addColorStop(
        0.45,
        '#ffd85a'
      );

      starGradient.addColorStop(
        1,
        '#e8a91f'
      );


      ctx.fillStyle =
        starGradient;

      ctx.fill();


      ctx.shadowBlur = 0;

      ctx.lineWidth = 3;

      ctx.strokeStyle =
        'rgba(255,245,190,0.95)';

      ctx.stroke();


      /* ========================================
         CREATE THREE.JS STAR
         ======================================== */

      const texture =
        new THREE.CanvasTexture(
          starCanvas
        );


      texture.needsUpdate =
        true;


      const material =
        new THREE.SpriteMaterial({

          map: texture,

          transparent: true,

          depthWrite: false,

          depthTest: false,

          opacity: 0

        });


      const star =
        new THREE.Sprite(
          material
        );


      star.position.copy(
        startPosition
      );


      star.scale.set(
        1.15,
        1.15,
        1.15
      );


      star.renderOrder =
        9999;


      sceneEl.object3D.add(
        star
      );


      const record = {

        star: star,

        slotIndex:
          slotIndex,

        removing:
          false

      };


      wishStars.push(
        record
      );


      /* ========================================
         STAR RISE ANIMATION
         ======================================== */

      const RISE_TIME =
        2600;


      const animationStart =
        performance.now();


      function animateRise(now) {

        /*
        如果這粒星已經被第6個願望移除，
        停止原本升空動畫。
        */

        if (
          record.removing ||
          !star.parent
        ) {
          return;
        }


        const progress =
          Math.min(
            (
              now -
              animationStart
            ) /
            RISE_TIME,
            1
          );


        const eased =
          1 -
          Math.pow(
            1 - progress,
            3
          );


        star.position.lerpVectors(
          startPosition,
          endPosition,
          eased
        );


        const fadeIn =
          Math.min(
            progress /
            0.18,
            1
          );


        const twinkle =
          0.92 +
          Math.sin(
            now *
            0.006 +
            slotIndex
          ) *
          0.08;


        material.opacity =
          fadeIn *
          twinkle;


        /*
        升空期間慢慢變大。
        */

        const scale =
          1.15 +
          1.25 *
          eased;


        star.scale.set(
          scale,
          scale,
          scale
        );


        if (
          progress < 1
        ) {

          requestAnimationFrame(
            animateRise
          );

        }

        else {

          /*
          到達天空後，
          固定於世界座標。
          */

          star.position.copy(
            endPosition
          );


          star.scale.set(
            2.4,
            2.4,
            2.4
          );


          material.opacity =
            1;


          animateTwinkle();

        }

      }


      /* ========================================
         KEEP STAR TWINKLING
         ======================================== */

      function animateTwinkle() {

        if (
          record.removing ||
          !star.parent
        ) {
          return;
        }


        const now =
          performance.now();


        material.opacity =
          0.90 +
          Math.sin(
            now *
            0.0035 +
            slotIndex
          ) *
          0.10;


        requestAnimationFrame(
          animateTwinkle
        );

      }


      requestAnimationFrame(
        animateRise
      );

    }


    /* ========================================
       ONE WISH = ONE STAR
       ======================================== */

    function createWishStarBurst() {

      createWishStar();

    }
    /* ========================================
       SEND WISH TO GOOGLE SHEET
       ======================================== */

    function sendWishToGoogleSheet(
      wish
    ) {

      if (!WISH_ENDPOINT) {
        return;
      }


      try {

        const data =
          new URLSearchParams();


        data.append(
          'wish',
          wish
        );


        data.append(
          'deviceId',
          getDeviceId()
        );


        data.append(
          'timestamp',
          new Date()
            .toISOString()
        );


        fetch(
          WISH_ENDPOINT,
          {

            method:
              'POST',

            mode:
              'no-cors',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              data.toString(),

            keepalive:
              true

          }
        )

        .catch(
          function(error) {

            console.warn(
              'Wish upload failed:',
              error
            );

          }
        );

      }

      catch (error) {

        console.warn(
          'Wish upload error:',
          error
        );

      }

    }

    /* ========================================
       SUBMIT WISH
       ======================================== */

    wishSubmit.addEventListener(
      'click',
      function(event) {

        event.preventDefault();


        const wish =
          wishText.value
            .trim();


        /*
        沒有輸入文字，
        不會送出。
        */

        if (!wish) {

          wishText.focus();

          return;

        }


        /*
        最多60個字。
        */

        if (
          wish.length >
          WISH_MAX_LENGTH
        ) {

          wishText.focus();

          return;

        }


        /*
        避免連續重複按 Send。
        */

        wishSubmit.disabled =
          true;


        /* ========================================
           SEND TO GOOGLE SHEET
           ======================================== */

        sendWishToGoogleSheet(
          wish
        );


        /*
        清空願望。
        */

        wishText.value =
          '';

        updateWishCount();


        /* ========================================
           CLOSE PANEL
           ======================================== */

        closeWishPanel(
          function() {


            /*
            ★★★★★★★★★★★★★★★★★★★

            每成功送出一個願望，
            只建立一粒五角星。

            最多5粒。

            第6次許願時，
            最舊的一粒會先淡出，
            然後加入新的星星。

            ★★★★★★★★★★★★★★★★★★★
            */

            createWishStarBurst();


            /*
            顯示：
            願望已經送上天
            */

            showWishToast();


            /*
            稍後重新啟用
            Send Button。
            */

            setTimeout(
              function() {

                /*
                因為文字框現在是空白，
                所以保持 Disabled。
                使用者再次輸入文字時，
                updateWishCount()
                會重新開啟。
                */

                updateWishCount();

              },
              600
            );


          }
        );

      }
    );

    /* ========================================
       HANDLE VISIBILITY CHANGE
       ======================================== */

      function() {

        /*
        使用者切換App或Safari分頁後，
        返回網頁時嘗試繼續播放360影片。
        */

        if (
          document.visibilityState ===
            'visible' &&
          sceneStarted
        ) {

          try {

            const videoPromise =
              christmasVideo.play();


            if (
              videoPromise &&
              videoPromise.catch
            ) {

              videoPromise.catch(
                function() {}
              );

            }

          }

          catch (error) {}


          /*
          如果背景音樂已經啟動，
          亦嘗試繼續播放。
          */

          if (
            musicStarted
          ) {

            try {

              const musicPromise =
                backgroundMusic.play();


              if (
                musicPromise &&
                musicPromise.catch
              ) {

                musicPromise.catch(
                  function() {}
                );

              }

            }

            catch (error) {}

          }

        }

      }
    );


    /* ========================================
       ORIENTATION CHANGE
       ======================================== */

    window.addEventListener(
      'orientationchange',
      function() {

        setTimeout(
          function() {

            window.dispatchEvent(
              new Event(
                'resize'
              )
            );

          },
          250
        );

      }
    );


    /* ========================================
       INITIAL WISH COUNT
       ======================================== */

    updateWishCount();


    /* ========================================
       SAFETY FALLBACK

       如果部分手機沒有正常觸發
       video ready event，
       最遲7秒仍然顯示
       「進入360°體驗」按鈕。
       ======================================== */

    setTimeout(
      function() {

        if (
          !sceneStarted &&
          !experienceStarting
        ) {

          showEnterButton();

        }

      },
      7000
    );


  </script>

</body>

</html>
