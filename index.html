<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>

</head>


<body>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  loading-screen="enabled: true">

  <!-- ==============================
       360°背景圖片
  =============================== -->

  <a-assets timeout="20000">

    <img
      id="christmas360"
      src="christmas360b.jpg">

  </a-assets>


  <!-- ==============================
       360° Equirectangular 場景
  =============================== -->

  <a-sky
    src="#christmas360"
    rotation="0 -90 0">
  </a-sky>


  <!-- ==============================
       Camera
  =============================== -->

  <a-camera
    position="0 0 0"

    look-controls="
      magicWindowTrackingEnabled: true;
      touchEnabled: true;
      mouseEnabled: true;">

  </a-camera>


</a-scene>

</body>

</html>
