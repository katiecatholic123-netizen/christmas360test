<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- 人物固定朝向360°場景中心 -->
  <script>
    AFRAME.registerComponent('face-center', {
      init: function () {
        const el = this.el;

        el.addEventListener('loaded', function () {
          const object = el.object3D;

          const position = new THREE.Vector3();
          object.getWorldPosition(position);

          const center = new THREE.Vector3(
            0,
            position.y,
            0
          );

          object.lookAt(center);
        });
      }
    });
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
  </style>

</head>

<body>

<a-scene>

  <!-- ==============================
       素材
  =============================== -->

  <a-assets timeout="10000">

    <!-- 360°背景 -->
    <img
      id="christmas"
      src="christmas360.jpg"
      crossorigin="anonymous">

    <!-- 瑪利亞 -->
    <img
      id="mary"
      src="mary.png"
      crossorigin="anonymous">

    <!-- 紅衣三博士 -->
    <img
      id="magi1b"
      src="Magi1b.png"
      crossorigin="anonymous">

  </a-assets>


  <!-- ==============================
       360°背景
  =============================== -->

  <a-sky
    src="#christmas"
    rotation="0 -90 0">
  </a-sky>


  <!-- ==============================
       瑪利亞
  =============================== -->

  <a-image
    src="#mary"
    position="0 0.7 -1.9"
    width="1.7"
    height="1.8"
    face-center
    material="
      shader: flat;
      transparent: true;
      alphaTest: 0.01;
      side: double;">
  </a-image>


  <!-- ==============================
       紅衣三博士
       Magi1b.png
  =============================== -->

  <a-image
    src="#magi1b"
    position="-1.6 0.25 -2.0"
    width="1.35"
    height="2.95"
    face-center
    material="
      shader: flat;
      transparent: true;
      alphaTest: 0.01;
      side: double;">
  </a-image>


  <!-- ==============================
       Camera
  =============================== -->

  <a-camera
    position="0 1.6 0"
    look-controls="
      magicWindowTrackingEnabled: true;
      touchEnabled: true;
      mouseEnabled: true;">
  </a-camera>

</a-scene>

</body>

</html>
