<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

    }


    /* ========================================
       LOADING SCREEN
       ======================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      /*
      Loading Fade Out = 1.5秒
      */

      transition: opacity 1.5s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      pointer-events: none;

    }


    /* ========================================
       LOADING VIDEO
       ======================================== */

    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

    }



    /* ========================================
       ENTER BUTTON
       ======================================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 100px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 14px 28px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      display: none;

      cursor: pointer;

    }



    /* ========================================
       A-FRAME
       ======================================== */

    a-scene {

      width: 100%;
      height: 100%;

    }


    /* ========================================
       許願功能 (WISH FEATURE)
       ======================================== */

    #wishButton {

      position: fixed;

      right: calc(18px + env(safe-area-inset-right, 0px));
      bottom: calc(26px + env(safe-area-inset-bottom, 0px));

      z-index: 10001;

      display: none;

      align-items: center;
      gap: 6px;

      padding: 12px 22px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC",
                   "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 0 0 1px rgba(255,215,120,0.55),
        0 4px 18px rgba(255,200,90,0.35);

      opacity: 0;

      transform: translateY(12px);

      transition: opacity 0.6s ease, transform 0.6s ease;

      -webkit-tap-highlight-color: transparent;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

    }


    #wishButton.show {

      opacity: 1;

      transform: translateY(0);

      animation: wishGlow 3.2s ease-in-out 0.6s infinite;

    }


    #wishButton:active {

      transform: scale(0.96);

    }


    #wishButton .wishIcon {

      color: #d9a520;

      font-size: 18px;

      line-height: 1;

    }


    @keyframes wishGlow {

      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(255,215,120,0.55),
          0 4px 18px rgba(255,200,90,0.30);
      }

      50% {
        box-shadow:
          0 0 0 1px rgba(255,215,120,0.85),
          0 4px 26px rgba(255,200,90,0.60);
      }

    }


    /* Overlay：永遠在 a-scene 之上 */

    #wishOverlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 10002;

      display: none;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      padding:
        calc(16px + env(safe-area-inset-top, 0px))
        calc(16px + env(safe-area-inset-right, 0px))
        calc(16px + env(safe-area-inset-bottom, 0px))
        calc(16px + env(safe-area-inset-left, 0px));

      background: rgba(0,0,0,0.35);

      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);

      opacity: 0;

      transition: opacity 0.25s ease;

      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC",
                   "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;

    }


    #wishOverlay.open {

      opacity: 1;

    }


    #wishPanel {

      width: 100%;
      max-width: 360px;

      box-sizing: border-box;

      padding: 20px 18px 16px;

      border-radius: 22px;

      background: rgba(255,255,255,0.95);

      color: #222;

      box-shadow:
        0 0 0 1px rgba(255,215,120,0.6),
        0 10px 40px rgba(0,0,0,0.35);

      transform: translateY(10px) scale(0.98);

      transition: transform 0.25s ease;

    }


    #wishOverlay.open #wishPanel {

      transform: none;

    }


    #wishPanel h2 {

      margin: 0 0 12px;

      font-size: 18px;
      font-weight: 600;

      text-align: center;

      letter-spacing: 1px;

    }


    #wishPanel h2 span {

      color: #d9a520;

    }


    #wishText {

      display: block;

      width: 100%;

      box-sizing: border-box;

      min-height: 88px;

      padding: 12px 14px;

      border: 1px solid rgba(0,0,0,0.12);

      border-radius: 14px;

      background: #fffdf6;

      color: #222;

      /* >= 16px：避免 iPhone focus 時自動放大 */
      font-size: 16px;
      font-family: inherit;

      line-height: 1.5;

      resize: none;

      outline: none;

      -webkit-appearance: none;
      appearance: none;

      touch-action: auto;

    }


    #wishText:focus {

      border-color: rgba(217,165,32,0.8);

      box-shadow: 0 0 0 3px rgba(255,215,120,0.35);

    }


    #wishCount {

      margin: 6px 2px 0;

      font-size: 12px;

      color: #999;

      text-align: right;

    }


    #wishNote {

      margin: 2px 2px 0;

      font-size: 12px;

      line-height: 1.4;

      color: #999;

      text-align: center;

    }


    #wishNote[hidden] {

      display: none;

    }


    #wishActions {

      display: flex;

      gap: 10px;

      margin-top: 12px;

    }


    #wishActions button {

      flex: 1;

      padding: 12px 0;

      border: none;

      border-radius: 30px;

      font-size: 17px;
      font-family: inherit;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

    }


    #wishCancel {

      background: rgba(0,0,0,0.06);

      color: #444;

    }


    #wishSubmit {

      background: linear-gradient(135deg, #c8102e, #a50d25);

      color: #fff;

      box-shadow: 0 2px 10px rgba(200,16,46,0.35);

    }


    #wishSubmit:disabled {

      opacity: 0.45;

      cursor: default;

      box-shadow: none;

    }


    /* 提示訊息 */

    #wishToast {

      position: fixed;

      left: 50%;
      top: calc(22px + env(safe-area-inset-top, 0px));

      z-index: 10003;

      padding: 10px 20px;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC",
                   "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;

      white-space: nowrap;

      box-shadow: 0 4px 18px rgba(255,200,90,0.35);

      opacity: 0;

      transform: translate(-50%, -8px);

      transition: opacity 0.4s ease, transform 0.4s ease;

      pointer-events: none;

    }


    #wishToast.show {

      opacity: 1;

      transform: translate(-50%, 0);

    }


    /* 中英雙語上下排列 */

    .wishTitleZh,
    .wishTitleEn,
    .wishNoteZh,
    .wishNoteEn,
    .buttonZh,
    .buttonEn {
      display: block;
    }

    .wishTitleEn {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
    }

    .wishNoteEn {
      margin-top: 3px;
      font-size: 11px;
    }

    .buttonEn {
      margin-top: 2px;
      font-size: 13px;
      opacity: 0.85;
    }

    .wishButtonText {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.1;
    }

    .wishButtonZh {
      display: block;
      font-size: 17px;
    }

    .wishButtonEn {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      letter-spacing: 0.5px;
      opacity: 0.75;
      white-space: nowrap;
    }

  </style>

</head>


<body>


  <!-- ========================================
       LOADING VIDEO
       ======================================== -->

  <div id="loadingScreen">

    <video
      id="loadingVideo"

      autoplay
      muted
      loop

      playsinline
      webkit-playsinline

      preload="auto">

      <source
        src="loading_v2.mp4"
        type="video/mp4">

    </video>

  </div>



  <!-- ========================================
       BACKGROUND MUSIC
       ======================================== -->

  <audio
    id="backgroundMusic"

    src="christmassong2025.mp3"

    preload="auto"

    loop>

  </audio>



  <!-- ========================================
       ENTER 360 BUTTON
       ======================================== -->

  <button id="startButton" type="button">

    <span style="display:block; font-size:17px;">
      進入 360° 體驗
    </span>

    <span style="display:block; margin-top:3px; font-size:11px; opacity:0.75;">
      Enter 360° Experience
    </span>

  </button>



  <!-- ========================================
       許願功能 (WISH FEATURE)
       ======================================== -->

  <button
    id="wishButton"
    type="button"
    aria-label="許願 Wish">

    <span class="wishIcon">✦</span>

    <span class="wishButtonText">

      <span class="wishButtonZh">
        許願
      </span>

      <span class="wishButtonEn">
        Wish
      </span>

    </span>

  </button>


  <div id="wishOverlay" aria-hidden="true">

    <div
      id="wishPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="wishTitle">

      <h2 id="wishTitle">

        <span class="wishTitleZh">
          <span>✦</span>
          聖誕許願
          <span>✦</span>
        </span>

        <span class="wishTitleEn">
          CHRISTMAS WISH
        </span>

      </h2>


      <textarea
        id="wishText"
        maxlength="60"
        rows="3"
        placeholder="寫低你嘅聖誕願望…&#10;Write your Christmas wish…"
        enterkeyhint="send"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"></textarea>


      <div id="wishCount">
        0 / 60
      </div>


      <div id="wishNote" hidden>

        <span class="wishNoteZh">
          你嘅願望會匿名傳送俾主辦單位
        </span>

        <span class="wishNoteEn">
          Your wish will be sent anonymously to the organizer.
        </span>

      </div>


      <div id="wishActions">

        <button id="wishCancel" type="button">
          取消 Cancel
        </button>

        <button
          id="wishSubmit"
          type="button"
          disabled>
          送出 Send
        </button>

      </div>

    </div>

  </div>


  <div
    id="wishToast"
    role="status"
    aria-live="polite">

    願望已經送上天 ✨
    <br>

    <span style="font-size:13px;">
      Your wish has been sent to the stars.
    </span>

  </div>



  <!-- ========================================
       360 SCENE
       ======================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    loading-screen="enabled: false">


    <!-- ========================================
         ASSETS
         ======================================== -->

    <a-assets timeout="60000">


      <video

        id="christmasVideo"

        src="Christmas ar_v2c.mp4"

        preload="auto"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>


    </a-assets>



    <!-- ========================================
         360 VIDEO SPHERE
         ======================================== -->

    <a-videosphere

      src="#christmasVideo"

      rotation="0 -90 0">

    </a-videosphere>



    <!-- ========================================
         CAMERA
         ======================================== -->

    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>



  <script>


    /* ========================================
       ELEMENTS
       ======================================== */


    const loadingScreen =
      document.querySelector('#loadingScreen');


    const loadingVideo =
      document.querySelector('#loadingVideo');


    const christmasVideo =
      document.querySelector('#christmasVideo');


    const backgroundMusic =
      document.querySelector('#backgroundMusic');


    const startButton =
      document.querySelector('#startButton');


    const camera =
      document.querySelector('#camera');



    /* ========================================
       LOADING SETTINGS
       ======================================== */


    /*
    Loading 最少播放時間
    3000ms = 3秒
    */

    const MIN_LOADING_TIME = 3000;


    /*
    Loading Fade Out
    1500ms = 1.5秒
    */

    const FADE_TIME = 1500;


    /*
    記錄 Loading 開始時間
    */

    const loadingStartTime =
      Date.now();


    /*
    場景是否已開始
    */

    let sceneStarted = false;


    /*
    360影片是否 Ready
    */

    let videoReady = false;


    /*
    避免重複建立 Timer
    */

    let enterTimer = null;



    /* ========================================
       BACKGROUND MUSIC SETTINGS
       ======================================== */


    /*
    最終音量：
    0.6 = 60%
    */

    const MUSIC_TARGET_VOLUME = 0.6;


    /*
    音樂 Fade In：
    2000ms = 2秒
    */

    const MUSIC_FADE_TIME = 2000;


    let musicStarted = false;

    let musicFadeTimer = null;

    let enterButtonScheduled = false;

    let experienceStarting = false;



    /* ========================================
       MUSIC FADE IN
       ======================================== */

    function fadeInBackgroundMusic() {

      clearInterval(musicFadeTimer);

      const steps = 40;

      const interval =
        MUSIC_FADE_TIME / steps;

      const volumeStep =
        MUSIC_TARGET_VOLUME / steps;


      backgroundMusic.volume = 0;


      musicFadeTimer =
        setInterval(

          function() {

            const newVolume =
              backgroundMusic.volume +
              volumeStep;


            if (
              newVolume >=
              MUSIC_TARGET_VOLUME
            ) {

              backgroundMusic.volume =
                MUSIC_TARGET_VOLUME;

              clearInterval(
                musicFadeTimer
              );

              return;

            }


            backgroundMusic.volume =
              newVolume;

          },

          interval

        );

    }



    /* ========================================
       PREPARE MUSIC FROM USER GESTURE
       ======================================== */

    function prepareBackgroundMusic() {

      if (musicStarted) {

        return Promise.resolve();

      }


      /*
      iPhone Safari 要求有聲音播放
      必須由使用者操作觸發。

      按「進入360°體驗」時，
      先用 0 音量開始播放。

      Motion 權限處理完成後，
      才真正 Fade In。

      所以 Loading 及 Allow 畫面期間
      不會聽到背景音樂。
      */


      backgroundMusic.volume = 0;


      const p =
        backgroundMusic.play();


      if (
        p &&
        p.then
      ) {

        return p

          .then(

            function() {

              musicStarted = true;

            }

          )

          .catch(

            function() {

              /*
              如果 Safari 仍然阻止，
              不影響進入360°。
              */

            }

          );

      }


      musicStarted = true;

      return Promise.resolve();

    }



    /* ========================================
       SHOW ENTER BUTTON
       ======================================== */

    function scheduleEnterButton() {

      if (
        sceneStarted ||
        enterButtonScheduled ||
        !videoReady
      ) {

        return;

      }


      enterButtonScheduled = true;


      const elapsed =
        Date.now() -
        loadingStartTime;


      const remaining =
        Math.max(

          0,

          MIN_LOADING_TIME -
          elapsed

        );


      enterTimer =
        setTimeout(

          function() {

            if (!sceneStarted) {

              startButton.style.display =
                'block';

            }

          },

          remaining

        );

    }



    /* ========================================
       REQUEST iPHONE MOTION PERMISSION
       ======================================== */

    async function requestMotionPermission() {

      /*
      iOS 13+ Safari：
      Motion & Orientation 權限
      必須由使用者按鈕觸發。

      Android / Desktop /
      不需要 requestPermission 的裝置
      會直接繼續。
      */


      try {

        if (

          typeof DeviceOrientationEvent !==
            'undefined' &&

          typeof DeviceOrientationEvent
            .requestPermission ===
            'function'

        ) {

          return await
            DeviceOrientationEvent
              .requestPermission();

        }

      }

      catch (error) {

        console.warn(
          'Motion permission request failed:',
          error
        );

      }


      return 'not-required';

    }



    /* ========================================
       ENTER 360 SCENE
       ======================================== */

    function enter360Scene() {

      if (sceneStarted) {

        return;

      }


      sceneStarted = true;


      startButton.style.display =
        'none';


      /*
      權限處理完成後，
      才真正聽到背景音樂。
      */

      if (musicStarted) {

        fadeInBackgroundMusic();

      }


      /*
      Loading 開始淡出
      */

      loadingScreen
        .classList
        .add('hide');


      setTimeout(

        function() {

          loadingVideo.pause();


          loadingScreen.style.display =
            'none';


          /*
          Loading 完全消失後
          顯示許願按鈕
          */

          showWishButton();

        },

        FADE_TIME + 100

      );

    }



    /* ========================================
       START 360 EXPERIENCE
       ======================================== */

    async function start360Experience() {

      if (
        experienceStarting ||
        sceneStarted
      ) {

        return;

      }


      experienceStarting = true;


      startButton.disabled = true;

      startButton.style.opacity =
        '0.65';


      /*
      兩個 play() 都由
      「進入360°體驗」的 click 直接觸發，
      對 iPhone Safari 較可靠。
      */


      const musicPromise =
        prepareBackgroundMusic();


      christmasVideo.muted = true;


      const videoPromise =
        christmasVideo
          .play()
          .catch(

            function() {

              /*
              即使播放失敗，
              後面仍然會繼續處理。
              */

            }

          );


      /*
      現在才叫出 iPhone 官方
      Motion & Orientation Allow。

      A-Frame 自己的白色
      Allow / Deny UI 已停用。
      */


      await requestMotionPermission();


      await Promise.allSettled(
        [
          musicPromise,
          videoPromise
        ]
      );


      /*
      即使用戶按 Don't Allow，
      仍然進入360°。

      只是不能靠手機轉動視角，
      仍可用手指拖動畫面。
      */


      enter360Scene();

    }



    /* ========================================
       PLAY / PRELOAD 360 VIDEO
       ======================================== */

    function playChristmasVideo() {

      christmasVideo.muted = true;


      const playPromise =
        christmasVideo.play();


      if (
        playPromise !==
        undefined
      ) {

        playPromise.catch(

          function() {

            /*
            Autoplay 被擋都不要立即進場。

            loadeddata / canplay 後
            仍然會顯示進入按鈕。

            用戶按按鈕時再播放。
            */

          }

        );

      }

    }



    /* ========================================
       360 VIDEO EVENTS
       ======================================== */


    christmasVideo.addEventListener(

      'loadeddata',

      function() {

        videoReady = true;

        scheduleEnterButton();

      }

    );


    christmasVideo.addEventListener(

      'canplay',

      function() {

        videoReady = true;

        scheduleEnterButton();

      }

    );


    christmasVideo.addEventListener(

      'playing',

      function() {

        videoReady = true;

        scheduleEnterButton();

      }

    );



    /* ========================================
       ENTER BUTTON
       ======================================== */


    startButton.addEventListener(

      'click',

      function(event) {

        event.preventDefault();

        event.stopPropagation();


        start360Experience();

      }

    );



    /* ========================================
       IMPORTANT
       ======================================== */

    /*
    Loading期間：

    1. 不啟動背景音樂

    2. 不要求 Motion 權限

    3. 不會因第一次 touch / click
       自動進入場景

    所有有聲音播放及 Motion 權限，
    都只由「進入360°體驗」按鈕觸發。
    */



    /* ========================================
       INITIAL LOAD
       ======================================== */


    window.addEventListener(

      'load',

      function() {


        /*
        播放 Loading 動畫
        */

        loadingVideo.muted = true;


        loadingVideo

          .play()
          .catch(

            function() {

              /*
              Loading影片如果被Safari阻止，
              不影響後續流程。
              */

            }

          );



        /*
        預先載入背景音樂
        但不播放
        */

        backgroundMusic.load();



        /*
        開始載入360影片
        */

        christmasVideo.load();



        /*
        0.5秒後嘗試預先播放360影片。

        因為影片是 muted，
        iPhone Safari一般可以 autoplay。

        這只是讓360影片預先Ready，
        不會令Loading畫面消失。
        */

        setTimeout(

          function() {

            playChristmasVideo();

          },

          500

        );


      }

    );



    /* ========================================
       PINCH ZOOM SETTINGS
       ======================================== */


    /*
    開場 FOV

    越大 = 看得越遠
    越小 = Zoom得越近
    */

    let currentFov = 105;


    /*
    最大 Zoom In
    */

    const minFov = 35;


    /*
    最大 Zoom Out
    */

    const maxFov = 120;


    let previousDistance = null;



    /* ========================================
       PINCH START
       ======================================== */


    document.addEventListener(

      'touchstart',

      function(event) {


        /*
        如果正在操作許願介面，
        不處理360 Zoom
        */

        if (isInWishUI(event.target)) {

          return;

        }


        if (event.touches.length === 2) {


          const dx =

            event.touches[0].clientX -

            event.touches[1].clientX;


          const dy =

            event.touches[0].clientY -

            event.touches[1].clientY;


          previousDistance =

            Math.sqrt(

              dx * dx +

              dy * dy

            );


        }


      },

      {

        passive: false

      }

    );



    /* ========================================
       PINCH MOVE
       ======================================== */


    document.addEventListener(

      'touchmove',

      function(event) {


        if (event.touches.length !== 2) {

          return;

        }


        /*
        許願介面上的觸碰
        不處理 Zoom
        */

        if (isInWishUI(event.target)) {

          return;

        }


        event.preventDefault();



        const dx =

          event.touches[0].clientX -

          event.touches[1].clientX;


        const dy =

          event.touches[0].clientY -

          event.touches[1].clientY;


        const distance =

          Math.sqrt(

            dx * dx +

            dy * dy

          );



        if (previousDistance !== null) {


          const difference =

            distance -

            previousDistance;



          /*
          手指拉開
          = Zoom In
          */

          currentFov -=

            difference * 0.12;



          /*
          限制 FOV
          */

          currentFov =

            Math.max(

              minFov,

              Math.min(

                maxFov,

                currentFov

              )

            );



          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


        }



        previousDistance =
          distance;


      },

      {

        passive: false

      }

    );



    /* ========================================
       PINCH END
       ======================================== */


    document.addEventListener(

      'touchend',

      function(event) {


        if (event.touches.length < 2) {

          previousDistance = null;

        }


      },

      {

        passive: false

      }

    );



    document.addEventListener(

      'touchcancel',

      function() {

        previousDistance = null;

      },

      {

        passive: false

      }

    );



    /* ========================================
       DESKTOP MOUSE WHEEL ZOOM
       ======================================== */


    window.addEventListener(

      'wheel',

      function(event) {


        /*
        如果滑鼠在許願介面，
        不控制360 Zoom
        */

        if (isInWishUI(event.target)) {

          return;

        }


        event.preventDefault();



        /*
        滑輪向上
        = Zoom In

        滑輪向下
        = Zoom Out
        */

        currentFov +=

          event.deltaY * 0.03;



        currentFov =

          Math.max(

            minFov,

            Math.min(

              maxFov,

              currentFov

            )

          );



        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );


      },

      {

        passive: false

      }

    );

    const WISH_ENDPOINT =

    /* ========================================
       CHECK WISH UI
       ======================================== */


    function isInWishUI(target) {


      if (!target) {

        return false;

      }


      return !!(

        target.closest &&
        (

          target.closest(
            '#wishButton'
          ) ||

          target.closest(
            '#wishOverlay'
          ) ||

          target.closest(
            '#wishToast'
          )

    /* ========================================

    function showWishButton() {


      if (!wishButton) {

      requestAnimationFrame(

        function() {

        }

      );

    }



    /* ========================================

        enabled

    /* ========================================
       OPEN WISH PANEL
       ======================================== */


    function openWishPanel() {


      if (
        !wishOverlay ||
        wishPanelOpen

        return;

      }


      wishPanelOpen = true;


      /*
      打開輸入框時，
      暫停360畫面拖動。
      */

      setLookControls(false);


      wishOverlay.style.display =
        'flex';


      wishOverlay.setAttribute(
        'aria-hidden',
        'false'
      );


      requestAnimationFrame(

        function() {

          wishOverlay.classList.add(
            'open'
          );

        }

      );


      updateWishCount();


      /*

        function() {

            }

        'aria-hidden',
        'true'
      );

    /* ========================================
       UPDATE CHARACTER COUNT
       ======================================== */


    function updateWishCount() {


      if (
        !wishText ||
        !wishCount ||
        !wishSubmit
      ) {

        return;

      }


      /*
      防止超過60字
      */

      if (
        wishText.value.length >
        WISH_MAX_LENGTH
      ) {

        wishText.value =
          wishText.value.slice(
            0,
            WISH_MAX_LENGTH
          );

      }


      const length =
        wishText.value.length;


      wishCount.textContent =

        length +
        ' / ' +
        WISH_MAX_LENGTH;


      /*
      沒有文字就不能Send
      */

      wishSubmit.disabled =

        wishText.value
          .trim()
          .length === 0;

    }



    /* ========================================
       SHOW WISH TOAST

    /* ========================================
       RANDOM NUMBER
       ======================================== */


    function randomBetween(
      min,
      max
    ) {

      return (
        Math.random() *
        (max - min)
      ) + min;

    }



    /* ========================================
       CREATE WISH STAR
       ======================================== */


    function createWishStar() {


      /*
      星星使用DOM建立，
      不會修改360影片本身。
      */


      const star =
        document.createElement(
          'div'
        );


      star.setAttribute(
        'aria-hidden',
        'true'
      );


      star.textContent =
        Math.random() > 0.45
          ? '✦'
          : '✧';


      /*
      星星位置主要放在畫面上半部，
      避免太接近許願按鈕。
      */

      const startX =
        randomBetween(
          12,
          88
        );


      const startY =
        randomBetween(
          52,
          78
        );


      const endX =
        startX +
        randomBetween(
          -8,
          8
        );


      const endY =
        randomBetween(
          12,
          36
        );


      const size =
        randomBetween(
          16,
          28
        );


      const duration =
        randomBetween(
          8000,
          WISH_STAR_LIFETIME
        );


      star.style.position =
        'fixed';


      star.style.left =
        startX + 'vw';


      star.style.top =
        startY + 'vh';


      star.style.zIndex =
        '10000';


      star.style.pointerEvents =
        'none';


      star.style.fontSize =
        size + 'px';


      star.style.color =
        '#ffe6a3';


      star.style.textShadow =

        '0 0 6px rgba(255,220,130,0.95),' +

        '0 0 14px rgba(255,190,80,0.75)';


      star.style.opacity =
        '0';


      star.style.transform =
        'translate(-50%, -50%) scale(0.4)';


      star.style.willChange =
        'transform, opacity, left, top';


      document.body.appendChild(
        star
      );


      activeWishStars.push(
        star
      );


      /*
      如果星星太多，
      移除最舊的一粒。
      */

      while (
        activeWishStars.length >
        MAX_VISIBLE_WISH_STARS
      ) {

        const oldStar =
          activeWishStars.shift();


        if (
          oldStar &&
          oldStar.parentNode
        ) {

          oldStar.parentNode.removeChild(
            oldStar
          );

        }

      }


      /*
      星星飛上天空動畫
      */

      /* ========================================
   星星慢慢升上天空
   → 天空停留10秒
   → 慢慢淡出
   ======================================== */

const RISE_TIME = 6000;      // 6秒升上天空
const HOLD_TIME = 10000;     // 到達天空後停留10秒
const FADE_TIME = 1500;      // 1.5秒淡出

const totalDuration =
  RISE_TIME +
  HOLD_TIME +
  FADE_TIME;

const riseEnd =
  RISE_TIME / totalDuration;

const holdEnd =
  (RISE_TIME + HOLD_TIME) / totalDuration;


const animation =
  star.animate(

    [

      /* 0秒：星星開始出現 */
      {
        offset: 0,

        left:
          startX + 'vw',

        top:
          startY + 'vh',

        opacity: 0,

        transform:
          'translate(-50%, -50%) scale(0.4)'
      },


      /* 星星很快亮起 */
      {
        offset: 0.04,

        left:
          startX + 'vw',

        top:
          startY + 'vh',

        opacity: 1,

        transform:
          'translate(-50%, -50%) scale(1.15)'
      },


      /* 約6秒：慢慢升到天空 */
      {
        offset: riseEnd,

        left:
          endX + 'vw',

        top:
          endY + 'vh',

        opacity: 1,

        transform:
          'translate(-50%, -50%) scale(0.85)'
      },


      /* 停留期間微微變亮 */
      {
        offset:
          riseEnd +
          ((holdEnd - riseEnd) * 0.25),

        left:
          endX + 'vw',

        top:
          endY + 'vh',

        opacity: 0.75,

        transform:
          'translate(-50%, -50%) scale(0.78)'
      },


      /* 微微閃爍 */
      {
        offset:
          riseEnd +
          ((holdEnd - riseEnd) * 0.50),

        left:
          endX + 'vw',

        top:
          endY + 'vh',

        opacity: 1,

        transform:
          'translate(-50%, -50%) scale(0.9)'
      },


      /* 再輕微暗一點 */
      {
        offset:
          riseEnd +
          ((holdEnd - riseEnd) * 0.75),

        left:
          endX + 'vw',

        top:
          endY + 'vh',

        opacity: 0.78,

        transform:
          'translate(-50%, -50%) scale(0.8)'
      },


      /* 10秒停留完成 */
      {
        offset: holdEnd,

        left:
          endX + 'vw',

        top:
          endY + 'vh',

        opacity: 1,

        transform:
          'translate(-50%, -50%) scale(0.85)'
      },


      /* 最後慢慢消失 */
      {
        offset: 1,

        left:
          endX + 'vw',

        top:
          endY + 'vh',

        opacity: 0,

        transform:
          'translate(-50%, -50%) scale(0.65)'
      }

    ],


    {

      duration:
        totalDuration,

      easing:
        'ease-in-out',

      fill:
        'forwards'

    }

  );


/* 動畫完成後，
   真正從網頁移除星星 */

animation.onfinish =
  function() {

    const index =
      activeWishStars.indexOf(
        star
      );


    if (index !== -1) {

      activeWishStars.splice(
        index,
        1
      );

    }


    if (star.parentNode) {

      star.parentNode.removeChild(
        star
      );

    }

  };

    }



    /* ========================================
       CREATE WISH STAR BURST
       ======================================== */


    function createWishStarBurst() {


      /*
      每次送出願望，
      產生幾粒星星。
      */

      const count =
        Math.floor(
          randomBetween(
            4,
            7
          )
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {


        setTimeout(

          function() {

            createWishStar();

          },

          i * 130

        );

      }

    }
    /* ========================================
       DEVICE ID
       ======================================== */

    function getDeviceId() {

      const key =
        'xmas360-device-id';


      try {

        let id =
          localStorage.getItem(
            key
          );


        if (!id) {

          id =

            'device-' +

            Date.now()
              .toString(36) +

            '-' +

            Math.random()
              .toString(36)
              .slice(2, 10);


          localStorage.setItem(
            key,
            id
          );

        }


        return id;

      }

      catch (error) {

        /*
        如果瀏覽器不允許 localStorage，
        仍然產生臨時匿名 ID。
        */

        return (

          'device-' +

          Date.now()
            .toString(36) +

          '-' +

          Math.random()
            .toString(36)
            .slice(2, 10)

        );

      }

    }



    /* ========================================
       SEND WISH TO GOOGLE SHEET
       ======================================== */

    function sendWishToGoogleSheet(
      wish
    ) {


      /*
      如果沒有設定 Apps Script URL，
      就不傳送。
      */

      if (!WISH_ENDPOINT) {

        return;

      }


      /*
      使用 URLSearchParams，
      Apps Script 可以直接讀取：
      e.parameter.wish
      e.parameter.deviceId
      */


      const body =
        new URLSearchParams();


      body.append(
        'wish',
        wish
      );


      body.append(
        'deviceId',
        getDeviceId()
      );


      body.append(
        'timestamp',
        new Date().toISOString()
      );


      try {


        /*
        no-cors：
        GitHub Pages → Google Apps Script
        不需要處理 CORS response。

        keepalive：
        即使用戶之後離開頁面，
        瀏覽器仍有較大機會完成傳送。
        */


        const p =
          fetch(

            WISH_ENDPOINT,

            {

              method: 'POST',

              mode: 'no-cors',

              cache: 'no-store',

              keepalive: true,

              headers: {

                'Content-Type':
                  'text/plain;charset=utf-8'

              },

              body: body

            }

          );


        /*
        傳送失敗不影響使用者體驗。
        */

        if (
          p &&
          p.catch
        ) {

          p.catch(
            function() {

              /*
              Offline / Network error
              */

            }
          );

        }


      }

      catch (error) {

        /*
        舊瀏覽器沒有 fetch，
        直接忽略。
        */

      }

    }



    /* ========================================
       WISH NOTE
       ======================================== */


    /*
    有設定 Google Apps Script
    才顯示匿名傳送提示。
    */

    if (wishNote) {

      wishNote.hidden =
        !WISH_ENDPOINT;

    }



    /* ========================================
       REMOVE OLD WISH STORAGE
       ======================================== */


    /*
    願望星會淡出移除，
    不會重新載入舊願望。

    清除舊版本 localStorage，
    避免長期累積資料。

    Device ID：
    xmas360-device-id
    會繼續保留。
    */


    try {

      localStorage.removeItem(
        'xmas360-wishes-v1'
      );

    }

    catch (error) {

      /*
      localStorage unavailable
      */

    }



    /* ========================================
       SUBMIT WISH
       ======================================== */


    function submitWish() {


      if (
        !wishText ||
        !wishSubmit
      ) {

        return;

      }


      /*
      移除前後空格
      */

      let wish =
        wishText.value.trim();


      /*
      空白願望不處理
      */

      if (!wish) {

        return;

      }


      /*
      再次限制最多60字
      */

      wish =
        wish.slice(
          0,
          WISH_MAX_LENGTH
        );


      /*
      防止重複快速按 Send
      */

      wishSubmit.disabled =
        true;


      /*
      傳送到 Google Sheet
      */

      sendWishToGoogleSheet(
        wish
      );


      /*
      清空輸入框
      */

      wishText.value =
        '';


      updateWishCount();


      /*
      關閉許願視窗
      */

      closeWishPanel();


      /*
      顯示成功提示
      */

      showWishToast();


      /*
      願望化成星星飛上天空
      */

      createWishStarBurst();

    }

        }

        }

          event.stopPropagation();

        },

          passive: true
        }

      );


      wishPanel.addEventListener(

        function(event) {

          event.stopPropagation();

        },

        {
          passive: true
        }

      );

    }



    /* ========================================
       KEYBOARD
       ======================================== */


    document.addEventListener(

      'keydown',

      function(event) {


        /*
        ESC 關閉許願視窗
        */

        if (
          event.key ===
          'Escape' &&
          wishPanelOpen
        ) {

          closeWishPanel();

          return;

        }


        /*
        Ctrl / Command + Enter
        送出願望
        */

        if (

          wishPanelOpen &&

          (
            event.ctrlKey ||
            event.metaKey
          ) &&

          event.key ===
          'Enter'

        ) {

          event.preventDefault();

          submitWish();

        }


      }

    );



    /* ========================================
       KEEP 360 VIDEO PLAYING
       ======================================== */


    /*
    iPhone Safari 有時在：
    - 切換 App
    - 鎖屏
    - 回到 Safari

    之後會暫停影片。

    回到網頁時，
    如果已經正式進入360場景，
    就嘗試恢復播放。
    */


    document.addEventListener(

      'visibilitychange',

      function() {


        if (
          document.visibilityState ===
            'visible' &&
          sceneStarted
        ) {


          christmasVideo
            .play()
            .catch(

              function() {

                /*
                如果 Safari 阻止，
                不影響其他功能。
                */

              }

            );


          /*
          背景音樂同樣嘗試恢復。
          */


          if (musicStarted) {


            backgroundMusic
              .play()
              .catch(

                function() {

                  /*
                  等下一次使用者操作
                  */

                }

              );

          }


        }


      }

    );



    /* ========================================
       PAGE FOCUS
       ======================================== */


    window.addEventListener(

      'pageshow',

      function() {


        if (!sceneStarted) {

          return;

        }


        /*
        Safari Back Forward Cache
        回到頁面時，
        恢復360影片。
        */


        christmasVideo
          .play()
          .catch(

            function() {

              /*
              Ignore
              */

            }

          );


      }

    );



    /* ========================================
       PREVENT DOUBLE TAP ZOOM
       ======================================== */


    /*
    iPhone Safari：
    避免快速 Double Tap
    導致整個網頁放大。

    但許願輸入介面除外。
    */


    let lastTouchEnd = 0;


    document.addEventListener(

      'touchend',

      function(event) {


        if (isInWishUI(event.target)) {

          return;

        }


        const now =
          Date.now();


        if (
          now -
          lastTouchEnd <=
          300
        ) {

          event.preventDefault();

        }


        lastTouchEnd =
          now;


      },

      {
        passive: false
      }

    );



    /* ========================================
       ORIENTATION CHANGE
       ======================================== */


    /*
    手機由直向轉橫向、
    或橫向轉直向後，
    重新讓 A-Frame 更新尺寸。
    */


    window.addEventListener(

      'orientationchange',

      function() {


        setTimeout(

          function() {


            window.dispatchEvent(

              new Event(
                'resize'
              )

            );


          },

          250

        );


      }

    );



    /* ========================================
       RESIZE
       ======================================== */


    window.addEventListener(

      'resize',

      function() {


        /*
        保持 FOV
        不會因 resize 回復預設值。
        */


        if (camera) {


          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


        }


      }

    );



    /* ========================================
       VIDEO ERROR HANDLING
       ======================================== */


    christmasVideo.addEventListener(

      'error',

      function() {


        /*
        如果360影片真的載入失敗，
        Loading不能永遠卡住。

        仍然顯示進入按鈕，
        方便測試及排錯。
        */


        console.warn(
          'Christmas 360 video failed to load.'
        );


        videoReady = true;


        scheduleEnterButton();


      }

    );



    /* ========================================
       LOADING VIDEO ERROR
       ======================================== */


    loadingVideo.addEventListener(

      'error',

      function() {


        /*
        Loading影片失敗時，
        背景保持黑色。

        360影片準備好後
        仍會正常顯示進入按鈕。
        */


        console.warn(
          'Loading video failed to load.'
        );


      }

    );



    /* ========================================
       MUSIC ERROR
       ======================================== */


    backgroundMusic.addEventListener(

      'error',

      function() {


        /*
        音樂失敗不阻止360場景。
        */


        console.warn(
          'Background music failed to load.'
        );


      }

    );
    /* ========================================
       MOTION PERMISSION RESULT
       ======================================== */

    /*
    iPhone Safari：

    A-Frame 自己的白色 Motion Permission UI
    已經在 <a-scene> 關閉：

    device-orientation-permission-ui="enabled: false"

    Motion 權限只會由：

    「進入 360° 體驗」

    按鈕觸發。

    使用者按：
    Allow
    → 可以使用手機方向感應

    Don't Allow
    → 仍然可以用手指拖動畫面
    */



    /* ========================================
       RESTART LOOK CONTROLS
       ======================================== */

    function refreshLookControls() {

      if (!camera) {

        return;

      }


      /*
      取得目前 look-controls component
      */

      const controls =
        camera.components[
          'look-controls'
        ];


      /*
      如果 A-Frame component
      已經初始化，
      暫時停用再重新啟用。

      這樣 iPhone 在 Allow 後，
      A-Frame 可以重新接收
      Device Orientation。
      */

      if (controls) {

        try {

          controls.pause();

        }

        catch (error) {

          /*
          Ignore
          */

        }


        setTimeout(

          function() {

            try {

              controls.play();

            }

            catch (error) {

              /*
              Ignore
              */

            }

          },

          50

        );

      }

    }



    /* ========================================
       MOTION PERMISSION HELPER
       ======================================== */

    async function requestMotionPermissionAndRefresh() {


      let result =
        'not-required';


      try {


        /*
        iPhone / iPad Safari
        */

        if (

          typeof DeviceOrientationEvent !==
            'undefined' &&

          typeof DeviceOrientationEvent
            .requestPermission ===
            'function'

        ) {


          result =

            await DeviceOrientationEvent
              .requestPermission();


          /*
          使用者按 Allow
          */

          if (
            result ===
            'granted'
          ) {


            refreshLookControls();


          }


          return result;

        }


        /*
        Android / Desktop
        通常不需要這個 Permission API。
        */

        return 'not-required';


      }

      catch (error) {


        console.warn(
          'Motion permission error:',
          error
        );


        return 'error';

      }

    }



    /* ========================================
       REPLACE MOTION REQUEST FUNCTION
       ======================================== */

    /*
    Part 1 裡面的 start360Experience()
    會呼叫 requestMotionPermission()。

    所以這裡把該函數更新為：

    Request Permission
          ↓
    iPhone Allow
          ↓
    Refresh A-Frame look-controls
    */


    requestMotionPermission =
      requestMotionPermissionAndRefresh;



    /* ========================================
       FIRST INTERACTION AFTER SCENE START
       ======================================== */

    function resumeMediaAfterInteraction() {


      /*
      未正式進入360°
      不處理。
      */

      if (!sceneStarted) {

        return;

      }


      /*
      確保360影片繼續播放。
      */

      if (
        christmasVideo &&
        christmasVideo.paused
      ) {


        christmasVideo
          .play()
          .catch(

            function() {

              /*
              Ignore
              */

            }

          );

      }


      /*
      如果背景音樂之前未成功播放，
      再利用這次 User Gesture
      嘗試一次。
      */

      if (
        backgroundMusic &&
        backgroundMusic.paused
      ) {


        backgroundMusic
          .play()

          .then(

            function() {


              musicStarted = true;


              /*
              如果音量仍然是0，
              重新 Fade In。
              */

              if (
                backgroundMusic.volume <
                MUSIC_TARGET_VOLUME
              ) {

                fadeInBackgroundMusic();

              }


            }

          )

          .catch(

            function() {

              /*
              Safari仍然阻止的話，
              不影響360。
              */

            }

          );

      }

    }



    /*
    使用 pointerdown，
    Desktop / Android / iPhone
    都可以處理。
    */

    document.addEventListener(

      'pointerdown',

      function(event) {


        /*
        許願輸入介面不需要
        觸發 media resume。
        */

        if (isInWishUI(event.target)) {

          return;

        }


        resumeMediaAfterInteraction();


      },

      {
        passive: true
      }

    );



    /* ========================================
       iOS TOUCH FALLBACK
       ======================================== */

    document.addEventListener(

      'touchstart',

      function(event) {


        if (isInWishUI(event.target)) {

          return;

        }


        resumeMediaAfterInteraction();


      },

      {
        passive: true
      }

    );



    /* ========================================
       CAMERA READY
       ======================================== */

    camera.addEventListener(

      'loaded',

      function() {


        /*
        確保初始 FOV 正確。
        */

        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );


      }

    );



    /* ========================================
       SCENE READY
       ======================================== */

    const scene =
      document.querySelector(
        'a-scene'
      );


    if (scene) {


      scene.addEventListener(

        'loaded',

        function() {


          /*
          A-Frame Scene Ready。

          注意：
          這裡不要求 Motion Permission，
          亦不播放背景音樂。

          一定要等使用者按：
          「進入360°體驗」
          */


          if (camera) {


            camera.setAttribute(

              'camera',

              'fov',

              currentFov

            );


          }


        }

      );

    }



    /* ========================================
       SAFARI PAGE RESTORE
       ======================================== */

    window.addEventListener(

      'pageshow',

      function(event) {


        /*
        如果 Safari 從 BFCache
        恢復頁面，
        Loading 已經完成的話
        不重新顯示 Loading。
        */


        if (
          sceneStarted &&
          loadingScreen
        ) {


          loadingScreen.style.display =
            'none';


          startButton.style.display =
            'none';


          showWishButton();


        }


      }

    );



    /* ========================================
       SAFARI AUDIO INTERRUPTION
       ======================================== */

    /*
    iPhone：

    Control Center、
    電話、
    Siri、
    切換 App

    都可能令 Audio 暫停。

    回到頁面後會先嘗試恢復，
    如果 Safari 要求新 User Gesture，
    下一次 touch 會由上面的
    resumeMediaAfterInteraction()
    再啟動。
    */

    window.addEventListener(

      'focus',

      function() {


        if (!sceneStarted) {

          return;

        }


        christmasVideo
          .play()
          .catch(
            function() {}
          );


        if (musicStarted) {


          backgroundMusic
            .play()
            .catch(
              function() {}
            );


        }


      }

    );



    /* ========================================
       INITIAL WISH UI
       ======================================== */

    updateWishCount();



    /* ========================================
       INITIAL CAMERA FOV
       ======================================== */

    if (camera) {


      camera.setAttribute(

        'camera',

        'fov',

        currentFov

      );


    }



    /* ========================================
       FINAL SAFETY CHECK
       ======================================== */

    /*
    某些 Safari 版本：

    canplay / loadeddata
    event 可能在 JS listener
    建立前已經發生。

    所以檢查 readyState。

    readyState >= 2
    = 已經有目前播放位置的資料。
    */

    if (
      christmasVideo.readyState >= 2
    ) {


      videoReady = true;


      scheduleEnterButton();


    }



    /*
    再做一個保險檢查。

    如果影片載入較慢，
    每500ms檢查一次。

    一旦 Ready，
    就顯示進入按鈕。
    */

    const videoReadyCheck =
      setInterval(

        function() {


          if (
            videoReady ||
            sceneStarted
          ) {


            clearInterval(
              videoReadyCheck
            );


            return;

          }


          if (
            christmasVideo.readyState >= 2
          ) {


            videoReady = true;


            scheduleEnterButton();


            clearInterval(
              videoReadyCheck
            );


          }


        },

        500

      );



    /* ========================================
       END
       ======================================== */

  </script>


</body>

</html>
