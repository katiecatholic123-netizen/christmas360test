<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

    }


    /* ========================================
       LOADING SCREEN
       ======================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      transition: opacity 1.5s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      pointer-events: none;

    }


    /* ========================================
       LOADING VIDEO
       ======================================== */

    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

    }


    /* ========================================
       ENTER BUTTON
       ======================================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 100px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 14px 28px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      display: none;

      cursor: pointer;

    }


    /* ========================================
       A-FRAME
       ======================================== */

    a-scene {

      width: 100%;
      height: 100%;

    }


    /* ========================================
       許願功能
       ======================================== */

    #wishButton {

      position: fixed;

      right: calc(18px + env(safe-area-inset-right, 0px));
      bottom: calc(26px + env(safe-area-inset-bottom, 0px));

      z-index: 10001;

      display: none;

      align-items: center;
      gap: 6px;

      padding: 12px 22px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 0 0 1px rgba(255,215,120,0.55),
        0 4px 18px rgba(255,200,90,0.35);

      opacity: 0;

      transform: translateY(12px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;

      -webkit-tap-highlight-color: transparent;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

    }


    #wishButton.show {

      opacity: 1;

      transform: translateY(0);

      animation:
        wishGlow
        3.2s
        ease-in-out
        0.6s
        infinite;

    }


    #wishButton:active {

      transform: scale(0.96);

    }


    #wishButton .wishIcon {

      color: #d9a520;

      font-size: 18px;

      line-height: 1;

    }


    @keyframes wishGlow {

      0%, 100% {

        box-shadow:
          0 0 0 1px rgba(255,215,120,0.55),
          0 4px 18px rgba(255,200,90,0.30);

      }

      50% {

        box-shadow:
          0 0 0 1px rgba(255,215,120,0.85),
          0 4px 26px rgba(255,200,90,0.60);

      }

    }


    /* ========================================
       WISH OVERLAY
       ======================================== */

    #wishOverlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 10002;

      display: none;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      padding:
        calc(16px + env(safe-area-inset-top, 0px))
        calc(16px + env(safe-area-inset-right, 0px))
        calc(16px + env(safe-area-inset-bottom, 0px))
        calc(16px + env(safe-area-inset-left, 0px));

      background: rgba(0,0,0,0.35);

      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);

      opacity: 0;

      transition: opacity 0.25s ease;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

    }


    #wishOverlay.open {

      opacity: 1;

    }


    #wishPanel {

      width: 100%;
      max-width: 360px;

      box-sizing: border-box;

      padding: 20px 18px 16px;

      border-radius: 22px;

      background: rgba(255,255,255,0.95);

      color: #222;

      box-shadow:
        0 0 0 1px rgba(255,215,120,0.6),
        0 10px 40px rgba(0,0,0,0.35);

      transform:
        translateY(10px)
        scale(0.98);

      transition:
        transform 0.25s ease;

    }


    #wishOverlay.open #wishPanel {

      transform: none;

    }


    #wishPanel h2 {

      margin: 0 0 12px;

      font-size: 18px;
      font-weight: 600;

      text-align: center;

      letter-spacing: 1px;

    }


    #wishPanel h2 span {

      color: #d9a520;

    }


    #wishText {

      display: block;

      width: 100%;

      box-sizing: border-box;

      min-height: 88px;

      padding: 12px 14px;

      border:
        1px solid
        rgba(0,0,0,0.12);

      border-radius: 14px;

      background: #fffdf6;

      color: #222;

      font-size: 16px;

      font-family: inherit;

      line-height: 1.5;

      resize: none;

      outline: none;

      -webkit-appearance: none;
      appearance: none;

      touch-action: auto;

    }


    #wishText:focus {

      border-color:
        rgba(217,165,32,0.8);

      box-shadow:
        0 0 0 3px
        rgba(255,215,120,0.35);

    }


    #wishCount {

      margin: 6px 2px 0;

      font-size: 12px;

      color: #999;

      text-align: right;

    }


    #wishNote {

      margin: 2px 2px 0;

      font-size: 12px;

      line-height: 1.4;

      color: #999;

      text-align: center;

    }


    #wishNote[hidden] {

      display: none;

    }


    #wishActions {

      display: flex;

      gap: 10px;

      margin-top: 12px;

    }


    #wishActions button {

      flex: 1;

      padding: 12px 0;

      border: none;

      border-radius: 30px;

      font-size: 17px;

      font-family: inherit;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

      touch-action:
        manipulation;

    }


    #wishCancel {

      background:
        rgba(0,0,0,0.06);

      color: #444;

    }


    #wishSubmit {

      background:
        linear-gradient(
          135deg,
          #c8102e,
          #a50d25
        );

      color: #fff;

      box-shadow:
        0 2px 10px
        rgba(200,16,46,0.35);

    }


    #wishSubmit:disabled {

      opacity: 0.45;

      cursor: default;

      box-shadow: none;

    }


    /* ========================================
       SUCCESS MESSAGE
       ======================================== */

    #wishToast {

      position: fixed;

      left: 50%;

      top:
        calc(
          22px +
          env(safe-area-inset-top, 0px)
        );

      z-index: 10003;

      padding: 10px 20px;

      border-radius: 30px;

      background:
        rgba(255,255,255,0.92);

      color: #222;

      font-size: 16px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Noto Sans CJK TC",
        "Microsoft JhengHei",
        sans-serif;

      white-space: nowrap;

      box-shadow:
        0 4px 18px
        rgba(255,200,90,0.35);

      opacity: 0;

      transform:
        translate(-50%, -8px);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;

      pointer-events: none;

    }


    #wishToast.show {

      opacity: 1;

      transform:
        translate(-50%, 0);

    }


    .wishTitleZh,
    .wishTitleEn,
    .wishNoteZh,
    .wishNoteEn,
    .buttonZh,
    .buttonEn {

      display: block;

    }


    .wishTitleEn {

      margin-top: 4px;

      font-size: 14px;

      font-weight: 500;

      letter-spacing: 1.5px;

    }


    .wishNoteEn {

      margin-top: 3px;

      font-size: 11px;

    }


    .buttonEn {

      margin-top: 2px;

      font-size: 13px;

      opacity: 0.85;

    }


    .wishButtonText {

      display: flex;

      flex-direction: column;

      align-items: center;

      line-height: 1.1;

    }


    .wishButtonZh {

      display: block;

      font-size: 17px;

    }


    .wishButtonEn {

      display: block;

      margin-top: 3px;

      font-size: 10px;

      letter-spacing: 0.5px;

      opacity: 0.75;

      white-space: nowrap;

    }

  </style>

</head>


<body>


  <!-- ========================================
       LOADING VIDEO
       ======================================== -->

  <div id="loadingScreen">

    <video
      id="loadingVideo"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto">

      <source
        src="loading_v2.mp4"
        type="video/mp4">

    </video>

  </div>


  <!-- ========================================
       BACKGROUND MUSIC
       ======================================== -->

  <audio
    id="backgroundMusic"
    src="christmassong2025.mp3"
    preload="auto"
    loop>
  </audio>


  <!-- ========================================
       ENTER 360 BUTTON
       ======================================== -->

  <button
    id="startButton"
    type="button">

    <span
      style="
        display:block;
        font-size:17px;
      ">

      進入 360° 體驗

    </span>

    <span
      style="
        display:block;
        margin-top:3px;
        font-size:11px;
        opacity:0.75;
      ">

      Enter 360° Experience

    </span>

  </button>


  <!-- ========================================
       WISH BUTTON
       ======================================== -->

  <button
    id="wishButton"
    type="button"
    aria-label="許願 Wish">

    <span class="wishIcon">
      ✦
    </span>

    <span class="wishButtonText">

      <span class="wishButtonZh">
        許願
      </span>

      <span class="wishButtonEn">
        Wish
      </span>

    </span>

  </button>


  <!-- ========================================
       WISH PANEL
       ======================================== -->

  <div
    id="wishOverlay"
    aria-hidden="true">

    <div
      id="wishPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="wishTitle">

      <h2 id="wishTitle">

        <span class="wishTitleZh">

          <span>✦</span>

          聖誕許願

          <span>✦</span>

        </span>

        <span class="wishTitleEn">
          CHRISTMAS WISH
        </span>

      </h2>


      <textarea
        id="wishText"
        maxlength="60"
        rows="3"
        placeholder="寫低你嘅聖誕願望…
Write your Christmas wish…"
        enterkeyhint="send"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"></textarea>


      <div id="wishCount">
        0 / 60
      </div>


      <div
        id="wishNote"
        hidden>

        <span class="wishNoteZh">
          你嘅願望會匿名傳送俾主辦單位
        </span>

        <span class="wishNoteEn">
          Your wish will be sent anonymously to the organizer.
        </span>

      </div>


      <div id="wishActions">

        <button
          id="wishCancel"
          type="button">

          取消 Cancel

        </button>


        <button
          id="wishSubmit"
          type="button"
          disabled>

          送出 Send

        </button>

      </div>

    </div>

  </div>


  <div
    id="wishToast"
    role="status"
    aria-live="polite">

    願望已經送上天 ✨

    <br>

    <span style="font-size:13px;">
      Your wish has been sent to the stars.
    </span>

  </div>


  <!-- ========================================
       360 SCENE
       ======================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    loading-screen="enabled: false">


    <a-assets timeout="60000">


      <video

        id="christmasVideo"

        src="Christmas ar_v2c.mp4"

        preload="auto"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>


    </a-assets>


    <a-videosphere

      src="#christmasVideo"

      rotation="0 -90 0">

    </a-videosphere>


    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>


  <script>


    /* ========================================
       ELEMENTS
       ======================================== */

    const loadingScreen =
      document.querySelector(
        '#loadingScreen'
      );


    const loadingVideo =
      document.querySelector(
        '#loadingVideo'
      );


    const christmasVideo =
      document.querySelector(
        '#christmasVideo'
      );


    const backgroundMusic =
      document.querySelector(
        '#backgroundMusic'
      );


    const startButton =
      document.querySelector(
        '#startButton'
      );


    const camera =
      document.querySelector(
        '#camera'
      );


    /* ========================================
       LOADING SETTINGS
       ======================================== */

    const MIN_LOADING_TIME =
      3000;


    const FADE_TIME =
      1500;


    const loadingStartTime =
      Date.now();


    let sceneStarted =
      false;


    let videoReady =
      false;


    let enterTimer =
      null;


    /* ========================================
       BACKGROUND MUSIC
       ======================================== */

    const MUSIC_TARGET_VOLUME =
      0.6;


    const MUSIC_FADE_TIME =
      2000;


    let musicStarted =
      false;


    let musicFadeTimer =
      null;


    let enterButtonScheduled =
      false;


    let experienceStarting =
      false;


    /* ========================================
       MUSIC FADE IN
       ======================================== */

    function fadeInBackgroundMusic() {

      clearInterval(
        musicFadeTimer
      );


      const steps =
        40;


      const interval =
        MUSIC_FADE_TIME /
        steps;


      const volumeStep =
        MUSIC_TARGET_VOLUME /
        steps;


      backgroundMusic.volume =
        0;


      musicFadeTimer =
        setInterval(

          function() {

            const newVolume =
              backgroundMusic.volume +
              volumeStep;


            if (
              newVolume >=
              MUSIC_TARGET_VOLUME
            ) {

              backgroundMusic.volume =
                MUSIC_TARGET_VOLUME;


              clearInterval(
                musicFadeTimer
              );


              return;

            }


            backgroundMusic.volume =
              newVolume;

          },

          interval

        );

    }


    /* ========================================
       PREPARE MUSIC
       ======================================== */

    function prepareBackgroundMusic() {

      if (musicStarted) {

        return Promise.resolve();

      }


      backgroundMusic.volume =
        0;


      const p =
        backgroundMusic.play();


      if (
        p &&
        p.then
      ) {

        return p

          .then(

            function() {

              musicStarted =
                true;

            }

          )

          .catch(

            function() {

              /* Safari blocked audio */

            }

          );

      }


      musicStarted =
        true;


      return Promise.resolve();

    }


    /* ========================================
       SHOW ENTER BUTTON
       ======================================== */

    function scheduleEnterButton() {

      if (
        sceneStarted ||
        enterButtonScheduled ||
        !videoReady
      ) {

        return;

      }


      enterButtonScheduled =
        true;


      const elapsed =
        Date.now() -
        loadingStartTime;


      const remaining =
        Math.max(

          0,

          MIN_LOADING_TIME -
          elapsed

        );


      enterTimer =
        setTimeout(

          function() {

            if (!sceneStarted) {

              startButton.style.display =
                'block';

            }

          },

          remaining

        );

    }


    /* ========================================
       iPHONE MOTION PERMISSION
       ======================================== */

    async function requestMotionPermission() {

      try {

        if (

          typeof DeviceOrientationEvent !==
            'undefined' &&

          typeof DeviceOrientationEvent
            .requestPermission ===
            'function'

        ) {

          return await
            DeviceOrientationEvent
              .requestPermission();

        }

      }

      catch (error) {

        console.warn(
          'Motion permission request failed:',
          error
        );

      }


      return 'not-required';

    }


    /* ========================================
       ENTER 360 SCENE
       ======================================== */

    function enter360Scene() {

      if (sceneStarted) {

        return;

      }


      sceneStarted =
        true;


      startButton.style.display =
        'none';


      if (musicStarted) {

        fadeInBackgroundMusic();

      }


      loadingScreen
        .classList
        .add('hide');


      setTimeout(

        function() {

          loadingVideo.pause();


          loadingScreen.style.display =
            'none';


          showWishButton();

        },

        FADE_TIME + 100

      );

    }
    /* ========================================
       START 360 EXPERIENCE
       ======================================== */

    async function start360Experience() {

      if (
        experienceStarting ||
        sceneStarted
      ) {

        return;

      }


      experienceStarting =
        true;


      startButton.disabled =
        true;


      startButton.style.opacity =
        '0.65';


      /*
      兩個 play() 都由
      「進入360°體驗」按鈕直接觸發。
      對 iPhone Safari 較可靠。
      */

      const musicPromise =
        prepareBackgroundMusic();


      let videoPromise =
        Promise.resolve();


      try {

        christmasVideo.muted =
          true;


        const p =
          christmasVideo.play();


        if (
          p &&
          p.then
        ) {

          videoPromise =
            p.catch(
              function() {}
            );

        }

      }

      catch (error) {

        console.warn(
          '360 video play failed:',
          error
        );

      }


      /*
      iPhone：
      在使用者按下按鈕後，
      才要求 Motion & Orientation 權限。
      */

      const permission =
        await requestMotionPermission();


      /*
      等待影片及音樂啟動。
      */

      await Promise.allSettled([

        musicPromise,

        videoPromise

      ]);


      /*
      即使使用者選擇 Don't Allow，
      仍然可以進入360°場景，
      只是不會使用陀螺儀。
      */

      if (
        permission ===
        'denied'
      ) {

        console.log(
          'Motion permission denied. Touch controls remain available.'
        );

      }


      enter360Scene();

    }


    /* ========================================
       ENTER BUTTON EVENT
       ======================================== */

    startButton.addEventListener(

      'click',

      function() {

        start360Experience();

      }

    );


    /* ========================================
       360 VIDEO READY
       ======================================== */

    function markVideoReady() {

      if (videoReady) {

        return;

      }


      videoReady =
        true;


      scheduleEnterButton();

    }


    christmasVideo.addEventListener(

      'canplay',

      markVideoReady

    );


    christmasVideo.addEventListener(

      'canplaythrough',

      markVideoReady

    );


    christmasVideo.addEventListener(

      'loadeddata',

      function() {

        if (
          christmasVideo.readyState >= 3
        ) {

          markVideoReady();

        }

      }

    );


    /* ========================================
       PLAY 360 VIDEO
       ======================================== */

    function playChristmasVideo() {

      try {

        christmasVideo.muted =
          true;


        const playPromise =
          christmasVideo.play();


        if (
          playPromise &&
          playPromise.catch
        ) {

          playPromise.catch(
            function() {

              /*
              如果 Safari 暫時不允許，
              使用者按 Enter 時會再播放。
              */

            }
          );

        }

      }

      catch (error) {

        console.warn(
          'Unable to preload 360 video:',
          error
        );

      }

    }


    /* ========================================
       WINDOW LOAD
       ======================================== */

    window.addEventListener(

      'load',

      function() {

        /*
        Loading影片
        */

        try {

          const loadingPromise =
            loadingVideo.play();


          if (
            loadingPromise &&
            loadingPromise.catch
          ) {

            loadingPromise.catch(
              function() {}
            );

          }

        }

        catch (error) {}


        /*
        預先載入背景音樂，
        但不播放。
        */

        try {

          backgroundMusic.load();

        }

        catch (error) {}


        /*
        預先載入360影片。
        */

        try {

          christmasVideo.load();

        }

        catch (error) {}


        /*
        0.5秒後嘗試預先播放360影片。
        因為影片 muted，
        iPhone Safari 一般可以 autoplay。

        這只是讓影片預先 Ready，
        Loading 畫面不會消失。
        */

        setTimeout(

          function() {

            playChristmasVideo();

          },

          500

        );

      }

    );


    /* ========================================
       FALLBACK VIDEO READY CHECK
       ======================================== */

    const videoReadyCheck =
      setInterval(

        function() {

          if (
            christmasVideo.readyState >= 3
          ) {

            clearInterval(
              videoReadyCheck
            );


            markVideoReady();

          }

        },

        300

      );


    /* ========================================
       PINCH ZOOM SETTINGS
       ======================================== */

    /*
    開場 FOV：

    數字越大 = 看得越遠
    數字越小 = Zoom In
    */

    let currentFov =
      105;


    const MIN_FOV =
      35;


    const MAX_FOV =
      120;


    let pinchStartDistance =
      null;


    let pinchStartFov =
      currentFov;


    function getTouchDistance(
      touch1,
      touch2
    ) {

      const dx =
        touch1.clientX -
        touch2.clientX;


      const dy =
        touch1.clientY -
        touch2.clientY;


      return Math.sqrt(

        dx * dx +
        dy * dy

      );

    }


    /* ========================================
       TOUCH START
       ======================================== */

    document.addEventListener(

      'touchstart',

      function(event) {

        /*
        如果正在使用許願介面，
        不處理360°縮放。
        */

        if (
          typeof isInWishUI ===
            'function' &&
          isInWishUI(event.target)
        ) {

          return;

        }


        if (
          event.touches.length ===
          2
        ) {

          pinchStartDistance =
            getTouchDistance(

              event.touches[0],

              event.touches[1]

            );


          pinchStartFov =
            currentFov;

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       TOUCH MOVE
       ======================================== */

    document.addEventListener(

      'touchmove',

      function(event) {

        if (
          typeof isInWishUI ===
            'function' &&
          isInWishUI(event.target)
        ) {

        if (
          event.touches.length === 2 &&
          pinchStartDistance

            getTouchDistance(

              event.touches[1]

            currentDistance;

            pinchStartFov *

            Math.max(

              MIN_FOV,

              Math.min(
                MAX_FOV,
                newFov
              )

            );


          currentFov =
            newFov;


          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );

        }

      },

      {
        passive: false
      }

    /* ========================================
       ONE 3D WISH STAR
       ======================================== */

    function createWishStar() {

      /*
      每次只建立一粒真正的五角星。

      ★ 重要 ★

      星星會加入 A-Frame / THREE.js
      的360°世界。

      它不是 document.body 上面的
      2D HTML 元素。

      因此：
      - 你轉動手機
      - 你拖動360°
      - 你改變觀看方向

      星星都不會跟著螢幕移動。

      它會留在原本的360°天空位置。
      */


      const scene =
        document.querySelector(
          'a-scene'
        );


      if (
        !scene ||
        !scene.object3D ||
        !scene.camera
      ) {

        return;

      }


      const threeCamera =
        scene.camera;


      threeCamera.updateMatrixWorld(
        true
      );


      /* ========================================
         CAMERA POSITION
         ======================================== */

      const cameraPosition =
        new THREE.Vector3();


      threeCamera.getWorldPosition(
        cameraPosition
      );


      /* ========================================
         CAMERA DIRECTION
         ======================================== */

      const direction =
        new THREE.Vector3();


      threeCamera.getWorldDirection(
        direction
      );


      direction.normalize();


      /* ========================================
         STAR START POSITION
         ======================================== */

      /*
      星星由使用者目前望緊的位置開始。

      距離相機約 3.5 米。

      再向下一點，
      令它有「由下面升上天空」的感覺。
      */


      const startPosition =
        cameraPosition
          .clone()
          .addScaledVector(
            direction,
            3.5
          );


      startPosition.y -=
        1.15;


      /* ========================================
         STAR FINAL SKY POSITION
         ======================================== */

      /*
      ★ 關鍵位置 ★

      這個位置只會在
      按「Send」的一刻計算一次。

      之後不會再根據手機方向改變。

      所以星星到達天空後，
      就會固定在這個360°世界座標。
      */


      const endPosition =
        cameraPosition
          .clone()
          .addScaledVector(
            direction,
            18
          );


      /*
      向天空升高
      */

      endPosition.y +=
        20;


      /* ========================================
         CREATE STAR CANVAS
         ======================================== */

      /*
      用 Canvas 畫一粒真正的
      金色五角星。
      */


      const canvas =
        document.createElement(
          'canvas'
        );


      canvas.width =
        256;


      canvas.height =
        256;


      const ctx =
        canvas.getContext(
          '2d'
        );


      if (!ctx) {

        return;

      }


      ctx.clearRect(
        0,
        0,
        256,
        256
      );


      /* ========================================
         GOLDEN GLOW
         ======================================== */

      const glow =
        ctx.createRadialGradient(

          128,
          128,
          8,

          128,
          128,
          118

        );


      glow.addColorStop(

        0,

        'rgba(255,240,170,0.65)'

      );


      glow.addColorStop(

        0.42,

        'rgba(255,205,85,0.25)'

      );


      glow.addColorStop(

        1,

        'rgba(255,190,50,0)'

      );


      ctx.fillStyle =
        glow;


      ctx.fillRect(

        0,
        0,
        256,
        256

      );


      /* ========================================
         DRAW 5-POINT STAR
         ======================================== */

      const cx =
        128;


      const cy =
        128;


      const outerRadius =
        68;


      const innerRadius =
        29;


      ctx.beginPath();


      for (
        let i = 0;
        i < 10;
        i++
      ) {


        const radius =

          i % 2 === 0

            ? outerRadius

            : innerRadius;


        const angle =

          -Math.PI / 2 +

          i * Math.PI / 5;


        const x =

          cx +

          Math.cos(
            angle
          ) *

          radius;


        const y =

          cy +

          Math.sin(
            angle
          ) *

          radius;


        if (
          i === 0
        ) {


          ctx.moveTo(

            x,
            y

          );


        }

        else {


          ctx.lineTo(

            x,
            y

          );


        }


      }


      ctx.closePath();


      /* ========================================
         GOLD STAR GRADIENT
         ======================================== */

      const starGradient =
        ctx.createLinearGradient(

          80,
          60,

          176,
          196

        );


      starGradient.addColorStop(

        0,

        '#fff6bd'

      );


      starGradient.addColorStop(

        0.48,

        '#ffd45d'

      );


      starGradient.addColorStop(

        1,

        '#e6a51a'

      );


      ctx.fillStyle =
        starGradient;


      ctx.shadowColor =
        'rgba(255,210,90,0.95)';


      ctx.shadowBlur =
        18;


      ctx.fill();


      /* ========================================
         CANVAS → THREE.JS TEXTURE
         ======================================== */

      const texture =
        new THREE.CanvasTexture(
          canvas
        );


      texture.needsUpdate =
        true;


      /* ========================================
         CREATE 3D STAR
         ======================================== */

      const material =
        new THREE.SpriteMaterial({

          map:
            texture,

          transparent:
            true,

          depthWrite:
            false,

          depthTest:
            false,

          opacity:
            0

        });


      const star =
        new THREE.Sprite(
          material
        );


      /* ========================================
         START POSITION
         ======================================== */

      star.position.copy(
        startPosition
      );


      /* ========================================
         START SIZE
         ======================================== */

      star.scale.set(

        1.15,
        1.15,
        1

      );


      /* ========================================
         ADD STAR TO 360 WORLD
         ======================================== */

      /*
      ★★★ 最重要的一行 ★★★

      以前如果是：

      document.body.appendChild(...)

      星星就會黐住手機畫面。


      現在是：

      scene.object3D.add(star)

      所以星星真正存在於
      360°世界裡面。
      */


      scene.object3D.add(
        star
      );


      /* ========================================
         ONLY ONE STAR
         ======================================== */

      /*
      如果上一粒願望星仍然存在，
      就先刪除。

      所以任何時間都只會有
      一粒願望星。
      */


      if (

        window.currentWishStar &&

        window.currentWishStar !==
          star &&

        window.currentWishStar.parent

      ) {


        window.currentWishStar
          .parent
          .remove(

            window.currentWishStar

          );


      }


      window.currentWishStar =
        star;


      /* ========================================
         ANIMATION SETTINGS
         ======================================== */

      const startTime =
        performance.now();


      /*
      星星升上天空：

      2600ms = 2.6秒
      */

      const RISE_TIME =
        2600;


      /*
      到達天空後固定：

      4000ms = 4秒
      */

      const HOLD_TIME =
        4000;


      /*
      最後淡出：

      800ms = 0.8秒
      */

      const FADE_OUT_TIME =
        800;


      /* ========================================
         ANIMATE STAR
         ======================================== */

      function animateWishStar(
        now
      ) {


        const elapsed =

          now -
          startTime;


        /* ========================================
           STAGE 1
           STAR RISES INTO SKY
           ======================================== */

        if (
          elapsed <
          RISE_TIME
        ) {


          let progress =

            elapsed /
            RISE_TIME;


          /*
          Smooth Ease Out
          */

          progress =

            1 -

            Math.pow(

              1 - progress,

              3

            );


          /*
          從起點飛向天空位置
          */

          star.position
            .lerpVectors(

              startPosition,

              endPosition,

              progress

            );


          /*
          開始時 Fade In
          */

          material.opacity =

            Math.min(

              1,

              elapsed /
              350

            );


          /*
          星星飛遠時稍微放大。

          因為它距離相機越來越遠，
          如果完全不放大，
          最後會變得太細。
          */

          const scale =

            1.15 +

            progress *
            1.55;


          star.scale.set(

            scale,
            scale,
            1

          );


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ========================================
           STAGE 2
           STAR FIXED IN SKY
           ======================================== */

        if (

          elapsed <

          RISE_TIME +
          HOLD_TIME

        ) {


          /*
          ★★★ 關鍵 ★★★

          星星已經到達天空。

          現在只固定使用
          endPosition。

          不再讀：
          - Camera rotation
          - Device orientation
          - 手機方向
          - Screen position

          所以你轉手機時，
          星星不會跟著畫面走。
          */


          star.position.copy(
            endPosition
          );


          /*
          很輕微的星光閃爍。

          星星本身的位置不會郁。
          */


          const twinkle =

            0.88 +

            Math.sin(

              elapsed *
              0.007

            ) *

            0.12;


          material.opacity =
            twinkle;


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ========================================
           STAGE 3
           FADE OUT
           ======================================== */

        const fadeProgress =

          (

            elapsed -

            RISE_TIME -

            HOLD_TIME

          ) /

          FADE_OUT_TIME;


        if (
          fadeProgress <
          1
        ) {


          /*
          淡出期間仍然固定在
          同一個天空位置。
          */


          star.position.copy(
            endPosition
          );


          material.opacity =

            Math.max(

              0,

              1 -
              fadeProgress

            );


          requestAnimationFrame(
            animateWishStar
          );


          return;

        }


        /* ========================================
           REMOVE STAR
           ======================================== */

        if (
          star.parent
        ) {


          star.parent.remove(
            star
          );


        }


        if (

          window.currentWishStar ===
          star

        ) {


          window.currentWishStar =
            null;


        }


        material.dispose();


        texture.dispose();


      }


      requestAnimationFrame(
        animateWishStar
      );


    }


    /* ========================================
       CREATE WISH STAR BURST
       ======================================== */

    /*
    保留你原本的 function 名：

    createWishStarBurst()

    因為下面 submitWish()
    原本就是呼叫這個 function。

    但現在它不再 Burst 多粒星，

    /* ========================================
       DEVICE ID
       ======================================== */

    function randomId() {

      return (

        Date.now()
          .toString(36) +

        '-' +

        Math.random()
          .toString(36)
          .slice(2, 10)

      );

    }


    function getDeviceId() {

      const KEY =
        'xmas360-device-id';


      try {


        let id =
          localStorage.getItem(
            KEY
          );


        if (!id) {


          id =
            randomId();


          localStorage.setItem(

            KEY,

            id

          );


        }


        return id;


      }

      catch (error) {


        if (!wishSessionId) {

          wishSessionId =
            randomId();

        }


        return wishSessionId;


      }

    }


    /* ========================================
       SEND WISH TO GOOGLE SHEET
       ======================================== */

    function sendWishToGoogleSheet(
      text
    ) {


      if (!WISH_ENDPOINT) {

        return;

      }


      try {


        /*
        保留願望資料傳送。
        */

        const body =
          new URLSearchParams();


        body.append(
          'wish',
          text
        );


        body.append(
          'deviceId',
          getDeviceId()
        );


        body.append(
          'timestamp',
          new Date()
            .toISOString()
        );


        fetch(

          WISH_ENDPOINT,

          {

            method:
              'POST',

            mode:
              'no-cors',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              body.toString(),

            keepalive:
              true

          }

        ).catch(

          function(error) {

            console.warn(
              'Wish upload failed:',
              error
            );

          }

        );


      }

      catch (error) {


        console.warn(
          'Wish upload error:',
          error
        );


      }


    }

    /* ========================================
       RESUME MEDIA
       ======================================== */

    function resumeMedia() {

      /*
      只在已經進入360°場景後處理。
      */

      if (!sceneStarted) {

        return;

      }


      /*
      恢復360°影片。
      */

      try {

        if (
          christmasVideo.paused
        ) {

          const videoPromise =
            christmasVideo.play();


          if (
            videoPromise &&
            videoPromise.catch
          ) {

            videoPromise.catch(
              function() {}
            );

          }

        }

      }

      catch (error) {}


      /*
      恢復背景音樂。
      */

      try {

        if (
          musicStarted &&
          backgroundMusic.paused
        ) {

          const musicPromise =
            backgroundMusic.play();


          if (
            musicPromise &&
            musicPromise.catch
          ) {

            musicPromise.catch(
              function() {}
            );

          }

        }

      }

      catch (error) {}

    }

       ======================================== */

          document.visibilityState ===
          'visible'
        ) {

        }

      }

        const now =

    /* ========================================
       ORIENTATION CHANGE
       ======================================== */

    window.addEventListener(

      'orientationchange',

      function() {

        setTimeout(

          function() {

            window.dispatchEvent(
              new Event(
                'resize'
              )
            );

          },

          300

        );

      }

    );


    /* ========================================
       VIDEO ERROR
       ======================================== */

    christmasVideo.addEventListener(

      'error',

      function(event) {

        console.error(
          'Christmas 360 video error:',
          event
        );

      }

    );


    /* ========================================
       LOADING VIDEO ERROR
       ======================================== */

    loadingVideo.addEventListener(

      'error',

      function(event) {

        console.error(
          'Loading video error:',
          event
        );

      }

    );


    /* ========================================
       BACKGROUND MUSIC ERROR
       ======================================== */

    backgroundMusic.addEventListener(

      'error',

      function(event) {

        console.error(
          'Background music error:',
          event
        );

      }

    );


    /* ========================================
       REFRESH LOOK CONTROLS
       ======================================== */

    function refreshLookControls() {

      if (!camera) {

        return;

      }


      const controls =
        camera.components &&
        camera.components[
          'look-controls'
        ];


      if (!controls) {

        return;

      }


      /*
      重新啟動 A-Frame look-controls，
      讓 iPhone 在取得 Motion 權限後
      正確接收方向資料。
      */

      try {

        controls.pause();

      }

      catch (error) {}


      try {

        controls.play();

      }

      catch (error) {}

    }


    /* ========================================
       USER INTERACTION FALLBACK
       ======================================== */

    function resumeMediaAfterInteraction() {

      if (!sceneStarted) {

        return;

      }


      resumeMedia();

    }


    document.addEventListener(

      'pointerdown',

      resumeMediaAfterInteraction,

      {
        passive: true
      }

    );


    document.addEventListener(

      'touchstart',

      resumeMediaAfterInteraction,

      {
        passive: true
      }

    );


    /* ========================================
       SCENE READY
       ======================================== */

    const aframeScene =
      document.querySelector(
        'a-scene'
      );


    if (aframeScene) {


      aframeScene.addEventListener(

        'loaded',

        function() {

          /*
          確保開場FOV正確。
          */

          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


          /*
          如果影片已經有足夠資料，
          立即標記 Ready。
          */

          if (
            christmasVideo.readyState >=
            3
          ) {

            markVideoReady();

          }

        }

      );


    }


    /* ========================================
       INITIAL WISH COUNT
       ======================================== */

    updateWishCount();


    /* ========================================
       INITIAL CAMERA FOV
       ======================================== */

    camera.setAttribute(

      'camera',

      'fov',

      currentFov

    );


    /* ========================================
       EXTRA VIDEO READY FALLBACK
       ======================================== */

    /*
    某些 iPhone Safari
    canplay / canplaythrough
    觸發時間不穩定。

    所以再做一個 readyState 檢查。
    */

    let readyAttempts =
      0;


    const readyStateTimer =
      setInterval(

        function() {


          readyAttempts++;


          if (
            christmasVideo.readyState >=
            3
          ) {


            clearInterval(
              readyStateTimer
            );


            markVideoReady();


            return;

          }


          /*
          最多檢查約30秒。
          */

          if (
            readyAttempts >
            100
          ) {


            clearInterval(
              readyStateTimer
            );


          }


        },

        300

      );


    /* ========================================
       CLEAN UP WHEN PAGE LEAVES
       ======================================== */

    window.addEventListener(

      'pagehide',

      function() {

        /*
        不需要刪除360影片，
        只停止暫時計時器。
        */

        if (enterTimer) {

          clearTimeout(
            enterTimer
          );

        }

      }

    );


  </script>


</body>

</html>
