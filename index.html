<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Christmas 360 Test</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene>

  <!-- 所有圖片素材 -->
  <a-assets>
    <img id="christmas" src="christmas360.jpg">
    <img id="mary" src="mary.png">
    <img id="Magi1b" src="Magi1b.png">
  </a-assets>


  <!-- 360° 背景 -->
  <a-sky
    src="#christmas"
    rotation="0 -90 0">
  </a-sky>


  <!-- 瑪利亞 -->
  <a-image
    src="#mary"

    position="0 0.7 -1.7"

    width="1.7"
    height="1.8"

    transparent="true"

    material="
      shader: flat;
      transparent: true;
      alphaTest: 0.01;
      side: double;">
  </a-image>

    <!-- 東一 -->
  <a-image
    src="#Magi1b"

    position="-3 0.4 -1"

    width="1.7"
    height="1.8"

    transparent="true"

    material="
      shader: flat;
      transparent: true;
      alphaTest: 0.01;
      side: double;">
  </a-image>


  <!-- Camera -->
  <a-camera
    position="0 1.6 0"
    look-controls="magicWindowTrackingEnabled: true">
  </a-camera>

</a-scene>

</body>
</html>
