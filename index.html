<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;
    }


    /* ========================================
       LOADING SCREEN
       ======================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      /* Loading 淡出時間 */
      transition: opacity 1.5s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      pointer-events: none;

    }


    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

    }



    /* ========================================
       ENTER BUTTON
       ======================================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 60px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 14px 28px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      display: none;

      cursor: pointer;

    }


    a-scene {

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <!-- ========================================
       LOADING VIDEO
       ======================================== -->

  <div id="loadingScreen">

    <video
      id="loadingVideo"

      autoplay
      muted
      loop

      playsinline
      webkit-playsinline

      preload="auto">

      <source
        src="loading.mp4"
        type="video/mp4">

    </video>

  </div>



  <!-- ========================================
       FALLBACK BUTTON
       ======================================== -->

  <button id="startButton">

    進入 360° 場景

  </button>



  <!-- ========================================
       360 SCENE
       ======================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    loading-screen="enabled: false">


    <!-- ========================================
         ASSETS
         ======================================== -->

    <a-assets timeout="60000">


      <video

        id="christmasVideo"

        src="christmas360.mp4"

        preload="auto"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>


    </a-assets>



    <!-- ========================================
         360 VIDEO
         ======================================== -->

    <a-videosphere

      src="#christmasVideo"

      rotation="0 -90 0">

    </a-videosphere>



    <!-- ========================================
         CAMERA
         ======================================== -->

    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>



  <script>


    /* ========================================
       ELEMENTS
       ======================================== */

    const loadingScreen =
      document.querySelector('#loadingScreen');

    const loadingVideo =
      document.querySelector('#loadingVideo');

    const christmasVideo =
      document.querySelector('#christmasVideo');

    const startButton =
      document.querySelector('#startButton');



    /* ========================================
       LOADING SCREEN FADE OUT
       ======================================== */

    let sceneStarted = false;


    function hideLoadingScreen() {


      if (sceneStarted) return;


      sceneStarted = true;


      /*
      開始 1.5 秒 Fade Out
      */

      loadingScreen.classList.add('hide');


      startButton.style.display = 'none';



      /*
      CSS Fade Out 是 1.5 秒

      所以這裡設定 1600ms，
      等 Fade 完成後才真正移除 Loading。
      */

      setTimeout(() => {


        loadingVideo.pause();


        loadingScreen.style.display = 'none';


      }, 1600);


    }



    /* ========================================
       PLAY 360 VIDEO
       ======================================== */

    function playChristmasVideo() {


      christmasVideo.muted = true;


      const playPromise =
        christmasVideo.play();



      if (playPromise !== undefined) {


        playPromise

          .then(() => {


            /*
            360影片成功播放
            → Loading開始淡出
            */

            hideLoadingScreen();


          })


          .catch(() => {


            /*
            如果 iPhone Safari
            阻止 Autoplay

            顯示進入按鈕
            */

            startButton.style.display = 'block';


          });


      }


    }



    /* ========================================
       360 VIDEO READY
       ======================================== */


    /*
    第一個畫面已經下載
    */

    christmasVideo.addEventListener(
      'loadeddata',
      function() {


        playChristmasVideo();


      }
    );



    /*
    Safari認為已經可以播放
    */

    christmasVideo.addEventListener(
      'canplay',
      function() {


        playChristmasVideo();


      }
    );



    /*
    360影片真正開始播放
    */

    christmasVideo.addEventListener(
      'playing',
      function() {


        hideLoadingScreen();


      }
    );



    /* ========================================
       ENTER BUTTON
       ======================================== */

    startButton.addEventListener(
      'click',
      function() {


        christmasVideo.muted = true;


        christmasVideo
          .play()

          .then(() => {


            hideLoadingScreen();


          })

          .catch(() => {


            startButton.style.display = 'block';


          });


      }
    );



    /* ========================================
       FIRST TOUCH FALLBACK
       ======================================== */

    document.addEventListener(
      'touchstart',
      function() {


        /*
        如果 Loading Video 未播放，
        第一次觸碰時嘗試播放
        */

        if (loadingVideo.paused) {


          loadingVideo.muted = true;


          loadingVideo
            .play()
            .catch(() => {});


        }



        /*
        如果360影片未播放，
        第一次觸碰時嘗試播放
        */

        if (christmasVideo.paused) {


          christmasVideo.muted = true;


          christmasVideo
            .play()
            .catch(() => {


              startButton.style.display = 'block';


            });


        }


      },

      {
        once: true,
        passive: true
      }

    );



    /* ========================================
       INITIAL LOAD
       ======================================== */

    window.addEventListener(
      'load',
      function() {


        /*
        播放 Loading Animation
        */

        loadingVideo.muted = true;


        loadingVideo
          .play()
          .catch(() => {});



        /*
        開始載入360影片
        */

        christmasVideo.load();



        /*
        嘗試自動播放360影片
        */

        setTimeout(
          function() {


            playChristmasVideo();


          },

          500
        );


      }
    );



    /* ========================================
       PINCH ZOOM
       ======================================== */

    const camera =
      document.querySelector('#camera');


    /*
    開場視野
    數字越大 = 看得越遠
    */

    let currentFov = 105;


    /*
    最 Zoom In
    */

    const minFov = 35;


    /*
    最 Zoom Out
    */

    const maxFov = 120;


    let previousDistance = null;



    /* ========================================
       PINCH START
       ======================================== */

    document.addEventListener(
      'touchstart',
      function(event) {


        if (event.touches.length === 2) {


          const dx =

            event.touches[0].clientX -

            event.touches[1].clientX;



          const dy =

            event.touches[0].clientY -

            event.touches[1].clientY;



          previousDistance =

            Math.sqrt(

              dx * dx +

              dy * dy

            );


        }


      },

      {
        passive: false
      }

    );



    /* ========================================
       PINCH MOVE
       ======================================== */

    document.addEventListener(
      'touchmove',
      function(event) {


        if (event.touches.length !== 2) {

          return;

        }


        event.preventDefault();



        const dx =

          event.touches[0].clientX -

          event.touches[1].clientX;



        const dy =

          event.touches[0].clientY -

          event.touches[1].clientY;



        const distance =

          Math.sqrt(

            dx * dx +

            dy * dy

          );



        if (previousDistance !== null) {


          const difference =

            distance -

            previousDistance;



          /*
          手指拉開
          → Zoom In
          */

          currentFov -=

            difference * 0.12;



          /*
          限制 Zoom 範圍
          */

          currentFov =

            Math.max(

              minFov,

              Math.min(

                maxFov,

                currentFov

              )

            );



          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


        }



        previousDistance = distance;


      },

      {
        passive: false
      }

    );



    /* ========================================
       PINCH END
       ======================================== */

    document.addEventListener(
      'touchend',
      function(event) {


        if (event.touches.length < 2) {


          previousDistance = null;


        }


      }
    );



    /* ========================================
       DESKTOP MOUSE WHEEL ZOOM
       ======================================== */

    document.addEventListener(
      'wheel',
      function(event) {


        event.preventDefault();



        currentFov +=

          event.deltaY * 0.05;



        currentFov =

          Math.max(

            minFov,

            Math.min(

              maxFov,

              currentFov

            )

          );



        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );


      },

      {
        passive: false
      }
    );


  </script>


</body>

</html>
