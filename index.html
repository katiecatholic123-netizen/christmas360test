<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

    }


    /* ========================================
       LOADING SCREEN
       ======================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      /*
      Loading Fade Out = 1.5秒
      */

      transition: opacity 1.5s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      pointer-events: none;

    }


    /* ========================================
       LOADING VIDEO
       ======================================== */

    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

    }



    /* ========================================
       ENTER BUTTON
       ======================================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 60px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 14px 28px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;

      display: none;

      cursor: pointer;

    }



    /* ========================================
       A-FRAME
       ======================================== */

    a-scene {

      width: 100%;
      height: 100%;

    }


    /* ========================================
       許願功能 (WISH FEATURE)
       ======================================== */

    #wishButton {

      position: fixed;

      right: calc(18px + env(safe-area-inset-right, 0px));
      bottom: calc(26px + env(safe-area-inset-bottom, 0px));

      z-index: 10001;

      display: none;

      align-items: center;
      gap: 6px;

      padding: 12px 22px;

      border: none;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 17px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC",
                   "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 0 0 1px rgba(255,215,120,0.55),
        0 4px 18px rgba(255,200,90,0.35);

      opacity: 0;

      transform: translateY(12px);

      transition: opacity 0.6s ease, transform 0.6s ease;

      -webkit-tap-highlight-color: transparent;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

    }

    #wishButton.show {

      opacity: 1;

      transform: translateY(0);

      animation: wishGlow 3.2s ease-in-out 0.6s infinite;

    }

    #wishButton:active {

      transform: scale(0.96);

    }

    #wishButton .wishIcon {

      color: #d9a520;

      font-size: 18px;

      line-height: 1;

    }

    @keyframes wishGlow {

      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(255,215,120,0.55),
          0 4px 18px rgba(255,200,90,0.30);
      }

      50% {
        box-shadow:
          0 0 0 1px rgba(255,215,120,0.85),
          0 4px 26px rgba(255,200,90,0.60);
      }

    }


    /* Overlay：永遠在 a-scene 之上 */

    #wishOverlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 10002;

      display: none;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      padding:
        calc(16px + env(safe-area-inset-top, 0px))
        calc(16px + env(safe-area-inset-right, 0px))
        calc(16px + env(safe-area-inset-bottom, 0px))
        calc(16px + env(safe-area-inset-left, 0px));

      background: rgba(0,0,0,0.35);

      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);

      opacity: 0;

      transition: opacity 0.25s ease;

      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC",
                   "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;

    }

    #wishOverlay.open {

      opacity: 1;

    }

    #wishPanel {

      width: 100%;
      max-width: 360px;

      box-sizing: border-box;

      padding: 20px 18px 16px;

      border-radius: 22px;

      background: rgba(255,255,255,0.95);

      color: #222;

      box-shadow:
        0 0 0 1px rgba(255,215,120,0.6),
        0 10px 40px rgba(0,0,0,0.35);

      transform: translateY(10px) scale(0.98);

      transition: transform 0.25s ease;

    }

    #wishOverlay.open #wishPanel {

      transform: none;

    }

    #wishPanel h2 {

      margin: 0 0 12px;

      font-size: 18px;
      font-weight: 600;

      text-align: center;

      letter-spacing: 1px;

    }

    #wishPanel h2 span {

      color: #d9a520;

    }

    #wishText {

      display: block;

      width: 100%;

      box-sizing: border-box;

      min-height: 88px;

      padding: 12px 14px;

      border: 1px solid rgba(0,0,0,0.12);

      border-radius: 14px;

      background: #fffdf6;

      color: #222;

      /* >= 16px：避免 iPhone focus 時自動放大 */
      font-size: 16px;
      font-family: inherit;

      line-height: 1.5;

      resize: none;

      outline: none;

      -webkit-appearance: none;
      appearance: none;

      touch-action: auto;

    }

    #wishText:focus {

      border-color: rgba(217,165,32,0.8);

      box-shadow: 0 0 0 3px rgba(255,215,120,0.35);

    }

    #wishCount {

      margin: 6px 2px 0;

      font-size: 12px;

      color: #999;

      text-align: right;

    }

    #wishActions {

      display: flex;

      gap: 10px;

      margin-top: 12px;

    }

    #wishActions button {

      flex: 1;

      padding: 12px 0;

      border: none;

      border-radius: 30px;

      font-size: 17px;
      font-family: inherit;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

    }

    #wishCancel {

      background: rgba(0,0,0,0.06);

      color: #444;

    }

    #wishSubmit {

      background: linear-gradient(135deg, #c8102e, #a50d25);

      color: #fff;

      box-shadow: 0 2px 10px rgba(200,16,46,0.35);

    }

    #wishSubmit:disabled {

      opacity: 0.45;

      cursor: default;

      box-shadow: none;

    }


    /* 提示訊息 */

    #wishToast {

      position: fixed;

      left: 50%;
      top: calc(22px + env(safe-area-inset-top, 0px));

      z-index: 10003;

      padding: 10px 20px;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #222;

      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC",
                   "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;

      white-space: nowrap;

      box-shadow: 0 4px 18px rgba(255,200,90,0.35);

      opacity: 0;

      transform: translate(-50%, -8px);

      transition: opacity 0.4s ease, transform 0.4s ease;

      pointer-events: none;

    }

    #wishToast.show {

      opacity: 1;

      transform: translate(-50%, 0);
    }

  </style>

</head>


<body>


  <!-- ========================================
       LOADING VIDEO
       ======================================== -->

  <div id="loadingScreen">

    <video
      id="loadingVideo"

      autoplay
      muted
      loop

      playsinline
      webkit-playsinline

      preload="auto">

      <source
        src="loading.mp4"
        type="video/mp4">

    </video>

  </div>



  <!-- ========================================
       BACKGROUND MUSIC
       ======================================== -->

  <audio
    id="backgroundMusic"

    src="christmassong2025.mp3"

    preload="auto"

    loop>

  </audio>



  <!-- ========================================
       FALLBACK BUTTON
       ======================================== -->

  <button id="startButton">

    進入 360° 場景

  </button>


  <!-- ========================================
       許願功能 (WISH FEATURE)
       ======================================== -->

  <button id="wishButton" type="button" aria-label="許願">

    <span class="wishIcon">✦</span> 許願

  </button>


  <div id="wishOverlay" aria-hidden="true">

    <div id="wishPanel" role="dialog" aria-modal="true" aria-labelledby="wishTitle">

      <h2 id="wishTitle"><span>✦</span> 聖誕許願 <span>✦</span></h2>

      <textarea
        id="wishText"
        maxlength="60"
        rows="3"
        placeholder="寫低你嘅聖誕願望…"
        enterkeyhint="send"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"></textarea>

      <div id="wishCount">0 / 60</div>

      <div id="wishActions">

        <button id="wishCancel" type="button">取消</button>

        <button id="wishSubmit" type="button" disabled>送出</button>

      </div>

    </div>

  </div>


  <div id="wishToast" role="status" aria-live="polite">願望已經送上天 ✨</div>




  <!-- ========================================
       360 SCENE
       ======================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    loading-screen="enabled: false">


    <!-- ========================================
         ASSETS
         ======================================== -->

    <a-assets timeout="60000">


      <video

        id="christmasVideo"

        src="Christmas ar_v1.mp4"

        preload="auto"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>


    </a-assets>



    <!-- ========================================
         360 VIDEO SPHERE
         ======================================== -->

    <a-videosphere

      src="#christmasVideo"

      rotation="0 -90 0">

    </a-videosphere>



    <!-- ========================================
         CAMERA
         ======================================== -->

    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>



  <script>


    /* ========================================
       ELEMENTS
       ======================================== */


    const loadingScreen =
      document.querySelector('#loadingScreen');


    const loadingVideo =
      document.querySelector('#loadingVideo');


    const christmasVideo =
      document.querySelector('#christmasVideo');


    const backgroundMusic =
      document.querySelector('#backgroundMusic');


    const startButton =
      document.querySelector('#startButton');


    const camera =
      document.querySelector('#camera');



    /* ========================================
       LOADING SETTINGS
       ======================================== */


    /*
    Loading最少播放時間

    3000ms = 3秒
    */

    const MIN_LOADING_TIME = 3000;


    /*
    Loading Fade Out

    1500ms = 1.5秒
    */

    const FADE_TIME = 1500;


    /*
    記錄Loading開始時間
    */

    const loadingStartTime =
      Date.now();


    /*
    場景是否已開始
    */

    let sceneStarted = false;


    /*
    360影片是否真正Ready
    */

    let videoReady = false;


    /*
    避免重複建立進場Timer
    */

    let enterTimer = null;



    /* ========================================
       BACKGROUND MUSIC SETTINGS
       ======================================== */


    /*
    音樂最終音量

    0.6 = 60%
    */

    const MUSIC_TARGET_VOLUME = 0.6;


    /*
    音樂Fade In時間

    2000ms = 2秒
    */

    const MUSIC_FADE_TIME = 2000;


    /*
    音樂是否已經成功開始播放
    */

    let musicStarted = false;


    /*
    Fade In Timer
    */

    let musicFadeTimer = null;



    /* ========================================
       MUSIC FADE IN
       ======================================== */


    function fadeInBackgroundMusic() {


      /*
      清除舊Timer
      */

      clearInterval(musicFadeTimer);


      /*
      Fade分成40步
      */

      const steps = 40;


      /*
      每一步時間
      */

      const interval =
        MUSIC_FADE_TIME / steps;


      /*
      每一步增加的音量
      */

      const volumeStep =
        MUSIC_TARGET_VOLUME / steps;


      /*
      由0開始
      */

      backgroundMusic.volume = 0;



      musicFadeTimer = setInterval(

        function() {


          let newVolume =

            backgroundMusic.volume +

            volumeStep;



          /*
          到達60%
          */

          if (newVolume >= MUSIC_TARGET_VOLUME) {


            backgroundMusic.volume =
              MUSIC_TARGET_VOLUME;


            clearInterval(
              musicFadeTimer
            );


            return;

          }



          /*
          繼續增加音量
          */

          backgroundMusic.volume =
            newVolume;


        },

        interval

      );


    }



    /* ========================================
       START BACKGROUND MUSIC
       ======================================== */


    function startBackgroundMusic() {


      /*
      如果已經播放
      不再重新開始
      */

      if (musicStarted) {

        return;

      }


      /*
      先設為0音量
      */

      backgroundMusic.volume = 0;



      const musicPromise =

        backgroundMusic.play();



      if (musicPromise !== undefined) {


        musicPromise

          .then(

            function() {


              /*
              音樂成功開始
              */

              musicStarted = true;


              /*
              開始2秒Fade In
              */

              fadeInBackgroundMusic();


            }

          )


          .catch(

            function() {


              /*
              iPhone Safari可能阻止
              有聲音自動播放。

              不做任何事，
              等使用者第一次觸碰。
              */


            }
          );


      }


    }



    /* ========================================
       ENTER SCENE
       ======================================== */


    function tryEnterScene() {


      /*
      已經進場
      或360影片未Ready
      就不處理
      */

      if (sceneStarted || !videoReady) {

        return;

      }


      /*
      Loading已播放多久
      */

      const elapsed =

        Date.now() -

        loadingStartTime;


      /*
      如果未夠3秒，
      計算仍需等待多久
      */

      const remaining =

        Math.max(

          0,

          MIN_LOADING_TIME - elapsed

        );


      /*
      避免建立重複Timer
      */

      if (enterTimer !== null) {

        return;

      }



      enterTimer =

        setTimeout(

          function() {


            if (sceneStarted) {

              return;

            }


            sceneStarted = true;



            /* ==================================
               開始 Loading Fade Out
               ================================== */


            loadingScreen
              .classList
              .add('hide');



            /*
            Loading開始淡出時
            嘗試開始背景音樂
            */

            startBackgroundMusic();



            /*
            隱藏進入按鈕
            */

            startButton.style.display =
              'none';



            /*
            Fade Out完成後
            才真正移除Loading
            */

            setTimeout(

              function() {


                loadingVideo.pause();


                loadingScreen.style.display =
                  'none';


                /*
                【許願】Loading完全消失後
                顯示許願按鈕
                */

                showWishButton();


              },

              FADE_TIME + 100

            );


          },

          remaining

        );


    }



    /* ========================================
       PLAY 360 VIDEO
       ======================================== */


    function playChristmasVideo() {


      christmasVideo.muted = true;


      const playPromise =

        christmasVideo.play();



      if (playPromise !== undefined) {


        playPromise

          .then(

            function() {


              /*
              Play成功。

              真正Ready會由
              playing event確認。
              */


            }

          )


          .catch(

            function() {


              /*
              Safari阻止Autoplay時
              顯示進入按鈕
              */

              startButton.style.display =
                'block';


            }

          );


      }


    }



    /* ========================================
       360 VIDEO EVENTS
       ======================================== */


    /*
    第一個Frame已下載
    */

    christmasVideo.addEventListener(

      'loadeddata',

      function() {


        playChristmasVideo();


      }

    );



    /*
    Safari認為影片已經可以播放
    */

    christmasVideo.addEventListener(

      'canplay',

      function() {


        playChristmasVideo();


      }

    );



    /*
    360影片真正開始播放
    */

    christmasVideo.addEventListener(

      'playing',

      function() {


        videoReady = true;


        tryEnterScene();


      }

    );



    /* ========================================
       ENTER BUTTON
       ======================================== */


    startButton.addEventListener(

      'click',

      function() {


        christmasVideo.muted = true;



        /*
        按鈕是使用者主動操作，
        同時嘗試啟動音樂
        */

        startBackgroundMusic();



        christmasVideo

          .play()

          .then(

            function() {


              videoReady = true;


              tryEnterScene();


            }

          )


          .catch(

            function() {


              startButton.style.display =
                'block';


            }

          );


      }

    );



    /* ========================================
       FIRST TOUCH
       ======================================== */


    document.addEventListener(

      'touchstart',

      function() {


        /*
        如果Loading影片未播放
        嘗試播放
        */

        if (loadingVideo.paused) {


          loadingVideo.muted = true;


          loadingVideo

            .play()

            .catch(() => {});


        }



        /*
        如果360影片未播放
        嘗試播放
        */

        if (christmasVideo.paused) {


          christmasVideo.muted = true;


          christmasVideo

            .play()

            .catch(

              function() {


                startButton.style.display =
                  'block';


              }

            );


        }



        /*
        iPhone Safari：

        使用者第一次觸碰畫面時
        嘗試播放背景音樂
        */

        if (!musicStarted) {


          startBackgroundMusic();


        }


      },

      {

        once: true,

        passive: true

      }

    );



    /* ========================================
       DESKTOP FIRST CLICK
       ======================================== */


    document.addEventListener(

      'click',

      function() {


        /*
        Desktop第一次Click
        嘗試播放音樂
        */

        if (!musicStarted) {


          startBackgroundMusic();


        }


      },

      {

        once: true

      }

    );



    /* ========================================
       INITIAL LOAD
       ======================================== */
    window.addEventListener(

      'load',

      function() {


        /*
        播放Loading動畫
        */

        loadingVideo.muted = true;


        loadingVideo

          .play()

          .catch(() => {});



        /*
        預先載入背景音樂
        */

        backgroundMusic.load();



        /*
        開始載入360影片
        */

        christmasVideo.load();



        /*
        0.5秒後嘗試播放360影片
        */

        setTimeout(

          function() {


            playChristmasVideo();


          },

          500

        );


      }

    );



    /* ========================================
       PINCH ZOOM SETTINGS
       ======================================== */


    /*
    開場FOV

    越大 = 看得越遠
    */

    let currentFov = 105;


    /*
    最大Zoom In
    */

    const minFov = 35;


    /*
    最大Zoom Out
    */

    const maxFov = 120;


    let previousDistance = null;



    /* ========================================
       PINCH START
       ======================================== */


    document.addEventListener(

      'touchstart',

      function(event) {


        /*
        【許願】許願介面上的觸碰
        不處理Zoom
        */

        if (isInWishUI(event.target)) {

          return;

        }


        if (event.touches.length === 2) {


          const dx =

            event.touches[0].clientX -

            event.touches[1].clientX;


          const dy =

            event.touches[0].clientY -

            event.touches[1].clientY;


          previousDistance =

            Math.sqrt(

              dx * dx +

              dy * dy

            );


        }


      },

      {

        passive: false

      }

    );



    /* ========================================
       PINCH MOVE
       ======================================== */


    document.addEventListener(

      'touchmove',

      function(event) {


        if (event.touches.length !== 2) {

          return;

        }


        /*
        【許願】許願介面上的觸碰
        不處理Zoom
        */

        if (isInWishUI(event.target)) {

          return;

        }


        event.preventDefault();



        const dx =

          event.touches[0].clientX -

          event.touches[1].clientX;


        const dy =

          event.touches[0].clientY -

          event.touches[1].clientY;


        const distance =

          Math.sqrt(

            dx * dx +

            dy * dy

          );



        if (previousDistance !== null) {


          const difference =

            distance -

            previousDistance;



          /*
          手指拉開
          = Zoom In
          */

          currentFov -=

            difference * 0.12;



          /*
          限制FOV
          */

          currentFov =

            Math.max(

              minFov,

              Math.min(

                maxFov,

                currentFov

              )

            );



          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


        }



        previousDistance = distance;


      },

      {

        passive: false

      }

    );



    /* ========================================
       PINCH END
       ======================================== */


    document.addEventListener(

      'touchend',

      function(event) {


        if (event.touches.length < 2) {


          previousDistance = null;


        }


      }

    );



    /* ========================================
       DESKTOP MOUSE WHEEL ZOOM
       ======================================== */


    document.addEventListener(

      'wheel',

      function(event) {


        /*
        【許願】面板打開時或
        滑鼠在許願介面上，不處理Zoom
        */

        if (wishOpen || isInWishUI(event.target)) {

          return;

        }


        event.preventDefault();



        currentFov +=

          event.deltaY * 0.05;



        currentFov =

          Math.max(

            minFov,

            Math.min(

              maxFov,

              currentFov

            )

          );



        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );


      },

      {

        passive: false

      }

    );




    /* ========================================
       許願功能 (WISH FEATURE)
       ======================================== */


    const wishButton  = document.querySelector('#wishButton');
    const wishOverlay = document.querySelector('#wishOverlay');
    const wishText    = document.querySelector('#wishText');
    const wishCount   = document.querySelector('#wishCount');
    const wishSubmit  = document.querySelector('#wishSubmit');
    const wishCancel  = document.querySelector('#wishCancel');
    const wishToast   = document.querySelector('#wishToast');
    const sceneEl     = document.querySelector('a-scene');


    const WISH_MAX_CHARS    = 60;
    const WISH_STORAGE_KEY  = 'xmas360-wishes-v1';
    const WISH_MAX_STORED   = 30;
    const WISH_SPAWN_DIST   = 4;      // 米：在鏡頭前方 4 米出現
    const WISH_SKY_DIST     = 30;     // 米：最後停在天空的距離（< videosphere 半徑 500）
    const WISH_RISE_TIME    = 7.5;      // 秒：上升時間
    const WISH_MAX_SKY_STARS = 40;
    const WISH_SKY_STAR_SIZE = 2.2;   // 米：天空小星（30 米外）

    let wishOpen = false;


    /*
    判斷事件是否來自許願 UI
    （給原本 pinch / wheel handler 用）
    */

    function isInWishUI(target) {

      return !!(target && target.closest &&
        target.closest('#wishOverlay, #wishButton, #wishToast'));

    }


    /* ---------- Canvas 紋理工具 ---------- */


    function makeCanvasTexture(canvas) {

      const tex = new THREE.CanvasTexture(canvas);

      if ('colorSpace' in tex && THREE.SRGBColorSpace) {
        tex.colorSpace = THREE.SRGBColorSpace;
      }

      tex.needsUpdate = true;

      return tex;

    }


    const wishTextures = {};


    function getGlowTexture() {

      if (wishTextures.glow) return wishTextures.glow;

      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0.0, 'rgba(255,255,240,1)');
      grd.addColorStop(0.2, 'rgba(255,230,150,0.75)');
      grd.addColorStop(0.5, 'rgba(255,190,80,0.22)');
      grd.addColorStop(1.0, 'rgba(255,160,60,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 128, 128);

      return (wishTextures.glow = makeCanvasTexture(c));

    }


    function getStarTexture() {

      if (wishTextures.star) return wishTextures.star;

      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const g = c.getContext('2d');
      const cx = 128, cy = 128;

      /* 四角閃光 */
      g.save();
      g.translate(cx, cy);
      const rays = g.createLinearGradient(-128, 0, 128, 0);
      rays.addColorStop(0, 'rgba(255,230,160,0)');
      rays.addColorStop(0.5, 'rgba(255,250,220,0.9)');
      rays.addColorStop(1, 'rgba(255,230,160,0)');
      g.fillStyle = rays;
      for (let i = 0; i < 2; i++) {
        g.beginPath();
        g.moveTo(-124, 0); g.lineTo(0, -5); g.lineTo(124, 0); g.lineTo(0, 5);
        g.closePath();
        g.fill();
        g.rotate(Math.PI / 2);
      }
      g.restore();

      /* 五角星 */
      g.save();
      g.translate(cx, cy);
      g.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = (i % 2 === 0) ? 78 : 32;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      g.closePath();
      g.shadowColor = 'rgba(255,210,90,1)';
      g.shadowBlur = 36;
      const fill = g.createRadialGradient(0, 0, 0, 0, 0, 78);
      fill.addColorStop(0, '#ffffff');
      fill.addColorStop(0.45, '#fff3b0');
      fill.addColorStop(1, '#ffc93c');
      g.fillStyle = fill;
      g.fill();
      g.restore();

      return (wishTextures.star = makeCanvasTexture(c));

    }


    function getDotTexture() {

      if (wishTextures.dot) return wishTextures.dot;

      const c = document.createElement('canvas');
      c.width = c.height = 32;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.35, 'rgba(255,235,170,0.8)');
      grd.addColorStop(1, 'rgba(255,200,100,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 32, 32);

      return (wishTextures.dot = makeCanvasTexture(c));

    }


    /*
    A-Frame 預設 MSDF 字型唔支援中文，
    所以用 canvas 畫字再做成貼圖
    */

    function makeWishTextSprite(text, metresPerPx, maxWorldW, narrow) {

      const FONT_PX = 44;
      const LINE_H = 60;
      const MAX_W = narrow ? 500 : 720;   // 直向手機每行字少啲
      const PAD_X = 36, PAD_Y = 22;
      const font = '500 ' + FONT_PX + 'px -apple-system, BlinkMacSystemFont, ' +
        '"PingFang HK", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", ' +
        '"Microsoft JhengHei", "Heiti TC", sans-serif';

      const c = document.createElement('canvas');
      let g = c.getContext('2d');
      g.font = font;

      /*
      斷行：中文逐個字，英文 / 數字成個字一齊（保留 emoji 完整）
      */
      const tokens = text.match(/[A-Za-z0-9'’\-]+|\s+|[\s\S]/gu) || [];
      const lines = [];
      let line = '';
      const pushChar = function(ch) {
        const test = line + ch;
        if (g.measureText(test).width > MAX_W && line.trim()) {
          lines.push(line.trimEnd());
          line = /^\s+$/.test(ch) ? '' : ch;
        } else {
          line = (!line && /^\s+$/.test(ch)) ? '' : test;
        }
      };
      for (const tk of tokens) {
        if (tk.length > 1 && g.measureText(tk).width <= MAX_W) {
          pushChar(tk);                     // 英文字：成個搬去下一行
        } else {
          Array.from(tk).forEach(pushChar); // 中文 / 太長嘅字：逐個字元
        }
      }
      if (line.trim()) lines.push(line.trimEnd());
      const shown = lines.slice(0, 4);
      if (lines.length > 4) shown[3] = shown[3].replace(/.$/u, '…');

      let textW = 0;
      shown.forEach(function(l) { textW = Math.max(textW, g.measureText(l).width); });

      c.width = Math.ceil(textW + PAD_X * 2);
      c.height = Math.ceil(shown.length * LINE_H + PAD_Y * 2);

      g = c.getContext('2d');   // resize 後要重設 context 狀態

      /* 圓角半透明底 */
      const r = Math.min(40, c.height / 2);
      g.beginPath();
      g.moveTo(r, 0);
      g.arcTo(c.width, 0, c.width, c.height, r);
      g.arcTo(c.width, c.height, 0, c.height, r);
      g.arcTo(0, c.height, 0, 0, r);
      g.arcTo(0, 0, c.width, 0, r);
      g.closePath();
      g.fillStyle = 'rgba(20,12,4,0.45)';
      g.fill();
      g.lineWidth = 3;
      g.strokeStyle = 'rgba(255,215,120,0.55)';
      g.stroke();

      g.font = font;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.shadowColor = 'rgba(255,200,90,0.9)';
      g.shadowBlur = 14;
      g.fillStyle = '#fffaf0';
      shown.forEach(function(l, i) {
        g.fillText(l, c.width / 2, PAD_Y + LINE_H * (i + 0.5));
      });

      const mat = new THREE.SpriteMaterial({
        map: makeCanvasTexture(c),
        transparent: true,
        depthWrite: false,
        opacity: 0
      });

      const sprite = new THREE.Sprite(mat);
      const worldW = Math.min(c.width * metresPerPx, maxWorldW);
      sprite.scale.set(worldW, worldW * c.height / c.width, 1);

      return sprite;

    }


    /* ---------- 小工具 ---------- */

    function clamp01(x) { return Math.max(0, Math.min(1, x)); }

    function easeInOutSine(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }

    function easeOutBack(x) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function skyPosition(az, el, dist) {
      /* az / el 用 radian；鏡頭 (0,0,0) 預設望向 -Z */
      return new THREE.Vector3(
        -Math.sin(az) * Math.cos(el) * dist,
        Math.sin(el) * dist,
        -Math.cos(az) * Math.cos(el) * dist
      );
    }


    /* ========================================
       wish-star COMPONENT
       ======================================== */

    AFRAME.registerComponent('wish-star', {

      schema: {
        text:    { type: 'string', default: '' },
        az:      { type: 'number', default: 0 },   // 最終天空位置 (radian)
        el:      { type: 'number', default: 0.8 },
        settled: { type: 'boolean', default: false },
        size:    { type: 'number', default: 1 },    // 星星大小（米）
        viewH:   { type: 'number', default: 10 },   // 出現位置可見高度（米）
        viewW:   { type: 'number', default: 10 },   // 出現位置可見闊度（米）
        start:   { type: 'vec3', default: { x: 0, y: 0, z: -4 } }
      },

      init: function() {

        const data = this.data;
        const group = this.el.object3D;

        this.elapsed = 0;
        this.phase = Math.random() * Math.PI * 2;
        this.end = skyPosition(data.az, data.el, WISH_SKY_DIST);

        this.glow = new THREE.Sprite(new THREE.SpriteMaterial({
          map: getGlowTexture(), color: 0xffffff, transparent: true,
          depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.9
        }));

        this.core = new THREE.Sprite(new THREE.SpriteMaterial({
          map: getStarTexture(), transparent: true, depthWrite: false
        }));

        group.add(this.glow);
        group.add(this.core);

        if (data.settled) {

          group.position.copy(this.end);
          this.baseScale = WISH_SKY_STAR_SIZE;
          this.dim = 0.7;
          this.done = true;

        } else {

          this.start = new THREE.Vector3(data.start.x, data.start.y, data.start.z);
          group.position.copy(this.start);
          this.startScale = data.size;
          this.baseScale = data.size;

          if (data.text) {
            /* 字高約為畫面高度 3.2%，但唔超過畫面闊度 85% */
            this.label = makeWishTextSprite(data.text,
              data.viewH * 0.032 / 44, data.viewW * 0.85, data.viewW < data.viewH);
            this.label.position.set(0,
              -(data.size * 0.42 + this.label.scale.y / 2), 0);
            group.add(this.label);
          }

          this.makeBurst();

        }

        this.applyScale(data.settled ? 1 : 0);

      },

      makeBurst: function() {

        const N = 42;
        const pos = new Float32Array(N * 3);
        this.burstVel = [];
        for (let i = 0; i < N; i++) {
          const u = Math.random() * 2 - 1;
          const th = Math.random() * Math.PI * 2;
          const s = Math.sqrt(1 - u * u);
          const speed = (0.6 + Math.random() * 1.2) * this.data.size;
          this.burstVel.push(new THREE.Vector3(s * Math.cos(th), u, s * Math.sin(th))
            .multiplyScalar(speed));
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        this.burst = new THREE.Points(geo, new THREE.PointsMaterial({
          map: getDotTexture(), size: this.data.size * 0.14, sizeAttenuation: true,
          color: 0xffe7a0, transparent: true, depthWrite: false,
          blending: THREE.AdditiveBlending, opacity: 1
        }));
        this.burst.frustumCulled = false;
        this.el.object3D.add(this.burst);

      },

      applyScale: function(k) {

        const tw = 1 + 0.18 * Math.sin(this.elapsed * 5.5 + this.phase) +
                   0.08 * Math.sin(this.elapsed * 13 + this.phase * 2);
        const s = this.baseScale * k * tw;
        this.core.scale.set(s, s, 1);
        this.glow.scale.set(s * 2.6, s * 2.6, 1);
        this.glow.material.opacity = (0.55 + 0.35 * tw - 0.35) * (this.dim || 1);
        this.core.material.rotation = 0.15 * Math.sin(this.elapsed * 0.8 + this.phase);

      },

      tick: function(time, delta) {

        const dt = Math.min(delta || 16, 100) / 1000;
        this.elapsed += dt;
        const t = this.elapsed;
        const group = this.el.object3D;

        if (this.done) {
          this.applyScale(1);
          return;
        }

        /* 出現 */
        const pop = easeOutBack(clamp01(t / 0.55));

        /* 閃粉 */
        if (this.burst) {
          const life = 1.3;
          const p = this.burst.geometry.attributes.position;
          for (let i = 0; i < this.burstVel.length; i++) {
            const v = this.burstVel[i];
            v.y -= 0.6 * dt;
            v.multiplyScalar(0.985);
            p.setXYZ(i, p.getX(i) + v.x * dt, p.getY(i) + v.y * dt, p.getZ(i) + v.z * dt);
          }
          p.needsUpdate = true;
          this.burst.material.opacity = 1 - clamp01(t / life);
          if (t > life) {
            group.remove(this.burst);
            this.burst.geometry.dispose();
            this.burst.material.dispose();
            this.burst = null;
          }
        }

        /*
        上升分兩段：
        1) 0.6–3.8 秒：喺面前慢慢向上飄（可以睇清楚願望）
        2) 3.8 秒後：飛向天空，縮細成小星
        */
        const floatT = 1 - Math.pow(1 - clamp01((t - 0.6) / 3.2), 2);
        if (!this.mid) {
          this.mid = this.start.clone();
          this.mid.y += this.data.size * 1.6;
        }
        const riseT = clamp01((t - 3.8) / (WISH_RISE_TIME - 3.8));
        const e = easeInOutSine(riseT);
        const cur = this.start.clone().lerp(this.mid, floatT);
        group.position.lerpVectors(cur, this.end, e);
        group.position.x += Math.sin(t * 1.3 + this.phase) * 0.06 * this.data.size * (1 - e);

        /* 距離越遠，星本身要大少少先唔會完全消失 */
        this.baseScale = this.startScale + (WISH_SKY_STAR_SIZE - this.startScale) * e;
        this.dim = 1 - 0.3 * e;
        this.applyScale(pop);

        /* 文字：淡入 → 跟住星上升 → 淡出 */
        if (this.label) {
          const fadeIn = clamp01((t - 0.3) / 0.5);
          const fadeOut = 1 - clamp01((t - 3.4) / 1.4);
          this.label.material.opacity = fadeIn * fadeOut;
          if (t > 6) {
            group.remove(this.label);
            this.label.material.map.dispose();
            this.label.material.dispose();
            this.label = null;
          }
        }

        if (riseT >= 1) {
          this.done = true;
          this.baseScale = WISH_SKY_STAR_SIZE;
          this.dim = 0.7;
        }

      },

      remove: function() {

        [this.glow, this.core].forEach(function(s) { if (s) s.material.dispose(); });
        if (this.label) { this.label.material.map.dispose(); this.label.material.dispose(); }
        if (this.burst) { this.burst.geometry.dispose(); this.burst.material.dispose(); }

      }

    });


    /* ========================================
       生成星星
       ======================================== */

    const wishStars = [];

    function addStarEntity(attrs, position) {

      const ent = document.createElement('a-entity');
      if (position) {
        const p = { x: position.x, y: position.y, z: position.z };
        ent.setAttribute('position', p);
        attrs.start = p;
      } else {
        const e = skyPosition(attrs.az, attrs.el, WISH_SKY_DIST);
        ent.setAttribute('position', { x: e.x, y: e.y, z: e.z });
      }
      ent.setAttribute('wish-star', attrs);
      sceneEl.appendChild(ent);
      wishStars.push(ent);

      while (wishStars.length > WISH_MAX_SKY_STARS) {
        const old = wishStars.shift();
        if (old.parentNode) old.parentNode.removeChild(old);
      }

      return ent;

    }


    function spawnWishStar(text) {

      const cam = sceneEl.camera;
      if (!cam) return null;

      cam.updateMatrixWorld(true);

      const dir = new THREE.Vector3();
      cam.getWorldDirection(dir);            // THREE camera：望向方向 (-Z)

      const origin = new THREE.Vector3();
      cam.getWorldPosition(origin);

      const start = origin.clone().addScaledVector(dir, WISH_SPAWN_DIST);

      /* 按目前 FOV / 畫面比例計算大小，手機直向同電腦都睇得清楚 */
      const viewH = 2 * WISH_SPAWN_DIST * Math.tan((cam.fov || 105) * Math.PI / 360);
      const viewW = viewH * (cam.aspect || 1);

      /* 最終天空位置：同一方位，仰角高啲 */
      const az = Math.atan2(-dir.x, -dir.z) + (Math.random() - 0.5) * 0.25;
      const curEl = Math.asin(Math.max(-1, Math.min(1, dir.y)));
      const deg = Math.PI / 180;
      const el = Math.min(70 * deg,
        Math.max(32 * deg, curEl + 22 * deg)) + (Math.random() - 0.5) * 8 * deg;

      addStarEntity({ text: text, az: az, el: el, settled: false,
        size: viewH * 0.12, viewH: viewH, viewW: viewW }, start);

      saveWish({ text: text, az: az, el: el, ts: Date.now() });

      return { az: az, el: el };

    }


    /* ---------- localStorage ---------- */

    function loadWishes() {
      try {
        const arr = JSON.parse(localStorage.getItem(WISH_STORAGE_KEY) || '[]');
        return Array.isArray(arr) ? arr.filter(function(w) {
          return w && isFinite(w.az) && isFinite(w.el);
        }) : [];
      } catch (e) {
        return [];
      }
    }

    function saveWish(w) {
      try {
        const arr = loadWishes();
        arr.push(w);
        localStorage.setItem(WISH_STORAGE_KEY,
          JSON.stringify(arr.slice(-WISH_MAX_STORED)));
      } catch (e) { /* 私隱模式等情況：忽略 */ }
    }

    function restoreWishes() {
      loadWishes().forEach(function(w) {
        addStarEntity({ text: '', az: +w.az, el: +w.el, settled: true });
      });
    }

    if (sceneEl.hasLoaded) {
      restoreWishes();
    } else {
      sceneEl.addEventListener('loaded', restoreWishes, { once: true });
    }


    /* ========================================
       按鈕 / 面板
       ======================================== */

    function showWishButton() {

      wishButton.style.display = 'inline-flex';

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          wishButton.classList.add('show');
        });
      });

    }


    function setLookControls(enabled) {
      if (camera && camera.components && camera.components['look-controls']) {
        camera.setAttribute('look-controls', 'enabled', enabled);
      }
    }


    function updateWishCount() {
      const len = Array.from(wishText.value).length;
      wishCount.textContent = len + ' / ' + WISH_MAX_CHARS;
      wishSubmit.disabled = wishText.value.trim().length === 0;
    }


    /*
    iPhone 鍵盤彈出時，令面板留喺可見範圍內
    */

    function fitOverlayToViewport() {

      const vv = window.visualViewport;
      if (!vv || !wishOpen) return;

      wishOverlay.style.top = vv.offsetTop + 'px';
      wishOverlay.style.left = vv.offsetLeft + 'px';
      wishOverlay.style.height = vv.height + 'px';
      wishOverlay.style.width = vv.width + 'px';

    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitOverlayToViewport);
      window.visualViewport.addEventListener('scroll', fitOverlayToViewport);
    }


    function openWishPanel() {

      if (wishOpen) return;
      wishOpen = true;

      setLookControls(false);

      wishText.value = '';
      updateWishCount();

      wishOverlay.style.display = 'flex';
      wishOverlay.setAttribute('aria-hidden', 'false');
      wishButton.style.visibility = 'hidden';
      fitOverlayToViewport();

      /* 必須喺 tap handler 內同步 focus，iPhone 先會彈出鍵盤 */
      try { wishText.focus({ preventScroll: true }); } catch (e) { wishText.focus(); }

      requestAnimationFrame(function() {
        wishOverlay.classList.add('open');
      });

    }


    function closeWishPanel(onClosed) {

      if (!wishOpen) return;
      wishOpen = false;

      wishText.blur();
      wishOverlay.classList.remove('open');
      wishOverlay.setAttribute('aria-hidden', 'true');

      setTimeout(function() {

        wishOverlay.style.display = 'none';
        wishOverlay.style.top = wishOverlay.style.left = '';
        wishOverlay.style.width = wishOverlay.style.height = '';
        wishButton.style.visibility = '';

        /* iPhone 收起鍵盤後有時頁面會殘留捲動 */
        window.scrollTo(0, 0);

        setLookControls(true);

        /* 等兩個 frame 令鏡頭方向更新（陀螺儀）後先執行 */
        if (onClosed) {
          requestAnimationFrame(function() {
            requestAnimationFrame(onClosed);
          });
        }

      }, 260);

    }


    function showWishToast() {
      wishToast.classList.add('show');
      clearTimeout(showWishToast.timer);
      showWishToast.timer = setTimeout(function() {
        wishToast.classList.remove('show');
      }, 2600);
    }


    function submitWish() {

      const text = wishText.value.replace(/\s+/g, ' ').trim();
      if (!text) return;

      closeWishPanel(function() {
        spawnWishStar(Array.from(text).slice(0, WISH_MAX_CHARS).join(''));
        showWishToast();
      });

    }


    wishButton.addEventListener('click', function(event) {
      event.stopPropagation();
      openWishPanel();
    });

    wishCancel.addEventListener('click', function() { closeWishPanel(); });

    wishSubmit.addEventListener('click', submitWish);

    wishText.addEventListener('input', updateWishCount);

    wishText.addEventListener('keydown', function(event) {

      /* 中文輸入法選字時唔好當送出 */
      if (event.isComposing || event.keyCode === 229) return;

      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        submitWish();
      } else if (event.key === 'Escape') {
        closeWishPanel();
      }

    });

    /* 撳面板外面：只收起鍵盤（避免誤撳清走已打嘅字） */
    wishOverlay.addEventListener('click', function(event) {
      if (event.target === wishOverlay) wishText.blur();
    });

    /* 面板上拖動唔好令成個頁面郁（textarea 本身捲動除外） */
    wishOverlay.addEventListener('touchmove', function(event) {
      if (event.target !== wishText || event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });


  </script>
