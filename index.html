<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <span style="font-size:13px;">

      Your wish has been sent to the stars.

    </span>

  </div>


  <!-- ========================================
       360 SCENE
       ======================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    loading-screen="enabled: false">


    <!-- ========================================
         ASSETS
         ======================================== -->

    <a-assets timeout="60000">

      <video

        id="christmasVideo"

        src="Christmas ar_v2c.mp4"

        preload="auto"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous">

      </video>

    </a-assets>


    <!-- ========================================
         360 VIDEO SPHERE
         ======================================== -->

    <a-videosphere

      src="#christmasVideo"

      rotation="0 -90 0">

    </a-videosphere>


    <!-- ========================================
         CAMERA
         ======================================== -->

    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>


  <script>

    /* ========================================
       ELEMENTS
       ======================================== */

    const loadingScreen =
      document.querySelector('#loadingScreen');

    const loadingVideo =
      document.querySelector('#loadingVideo');

    const christmasVideo =
      document.querySelector('#christmasVideo');

    const backgroundMusic =
      document.querySelector('#backgroundMusic');

    const startButton =
      document.querySelector('#startButton');

    const camera =
      document.querySelector('#camera');

    const sceneEl =
      document.querySelector('a-scene');


    /* ========================================
       LOADING SETTINGS
       ======================================== */

    const MIN_LOADING_TIME = 3000;

    const FADE_TIME = 1500;

    const loadingStartTime = Date.now();

    let sceneStarted = false;

    let videoReady = false;

    let enterTimer = null;

    let enterButtonScheduled = false;

    let experienceStarting = false;


    /* ========================================
       BACKGROUND MUSIC
       ======================================== */

    const MUSIC_TARGET_VOLUME = 0.6;

    const MUSIC_FADE_TIME = 2000;

    let musicStarted = false;

    let musicFadeTimer = null;


    /* ========================================
       CAMERA / ZOOM SETTINGS
       ======================================== */

    let currentFov = 105;

    const minFov = 35;

    const maxFov = 120;


    /* ========================================
       WISH SETTINGS
       ======================================== */

    const WISH_ENDPOINT =
      'https://script.google.com/macros/s/AKfycbyCrBzBm5rgP0bsMPkpZ6HBzHGnrUgRfNm3-6aAEQH4u4ZQY8tUB2qT-0DPwjjX9uTI/exec';

    const WISH_MAX_LENGTH = 60;


    /* ========================================
       ★ FIXED BIG STAR TARGET ★
       ======================================== */

    const BIG_STAR_YAW =
      THREE.MathUtils.degToRad(
        2.04
      );

    const BIG_STAR_PITCH =
      THREE.MathUtils.degToRad(
        30.89
      );


    /* ========================================
       WISH ELEMENTS
       ======================================== */

    const wishButton =
      document.querySelector('#wishButton');

    const wishOverlay =
      document.querySelector('#wishOverlay');

    const wishPanel =
      document.querySelector('#wishPanel');

    const wishText =
      document.querySelector('#wishText');

    const wishCount =
      document.querySelector('#wishCount');

    const wishNote =
      document.querySelector('#wishNote');

    const wishCancel =
      document.querySelector('#wishCancel');

    const wishSubmit =
      document.querySelector('#wishSubmit');

    const wishToast =
      document.querySelector('#wishToast');

    let wishPanelOpen = false;

    let wishToastTimer = null;


    /* ========================================
       SHOW ENTER BUTTON
       ======================================== */

    function showEnterButton() {

      if (
        sceneStarted ||
        experienceStarting
      ) {
        return;
      }

      startButton.style.display =
        'block';

    }


    /* ========================================
       CHECK IF READY
       ======================================== */

    function scheduleEnterButton() {

      if (
        !videoReady ||
        enterButtonScheduled ||
        sceneStarted
      ) {
        return;
      }

      enterButtonScheduled = true;

      const elapsed =
        Date.now() -
        loadingStartTime;

      const remaining =
        Math.max(
          0,
          MIN_LOADING_TIME -
          elapsed
        );

      enterTimer =
        setTimeout(
          function() {
            showEnterButton();
          },
          remaining
        );

    }


    /* ========================================
       360 VIDEO READY
       ======================================== */

    function markVideoReady() {

      if (videoReady) {
        return;
      }

      videoReady = true;

      scheduleEnterButton();

    }


    christmasVideo.addEventListener(
      'canplay',
      markVideoReady
    );

    christmasVideo.addEventListener(
      'canplaythrough',
      markVideoReady
    );

    christmasVideo.addEventListener(
      'loadeddata',
      function() {

        if (
          christmasVideo.readyState >= 3
        ) {
          markVideoReady();
        }

      }
    );


    /* ========================================
       PRELOAD 360 VIDEO
       ======================================== */

    function prepareChristmasVideo() {

      try {

        christmasVideo.muted = true;

        const playPromise =
          christmasVideo.play();

        if (
          playPromise &&
          playPromise.catch
        ) {

          playPromise.catch(
            function() {}
          );

        }

      }

      catch (error) {

        console.warn(
          '360 video preload failed:',
          error
        );

      }

    }


    /* ========================================
       PREPARE BACKGROUND MUSIC
       ======================================== */

    function prepareBackgroundMusic() {

      try {

        backgroundMusic.volume = 0;

        const playPromise =
          backgroundMusic.play();

        if (
          playPromise &&
          playPromise.then
        ) {

          return playPromise

            .then(
              function() {
                musicStarted = true;
              }
            )

            .catch(
              function() {
                musicStarted = false;
              }
            );

        }

      }

      catch (error) {

        musicStarted = false;

      }

      return Promise.resolve();

    }


    /* ========================================
       FADE IN MUSIC
       ======================================== */

    function fadeInMusic() {

      if (!musicStarted) {
        return;
      }

      if (musicFadeTimer) {

        cancelAnimationFrame(
          musicFadeTimer
        );

      }

      const startTime =
        performance.now();

      function fadeStep(now) {

        const progress =
          Math.min(
            1,
            (
              now -
              startTime
            ) /
            MUSIC_FADE_TIME
          );

        backgroundMusic.volume =
          MUSIC_TARGET_VOLUME *
          progress;

        if (
          progress < 1
        ) {

          musicFadeTimer =
            requestAnimationFrame(
              fadeStep
            );

        }

        else {

          musicFadeTimer = null;

        }

      }

      musicFadeTimer =
        requestAnimationFrame(
          fadeStep
        );

    }


    /* ========================================
       REQUEST MOTION PERMISSION
       ======================================== */

    function requestMotionPermission() {

      if (

        typeof DeviceOrientationEvent !==
          'undefined' &&

        typeof DeviceOrientationEvent
          .requestPermission ===
          'function'

      ) {

        return DeviceOrientationEvent
          .requestPermission()

          .then(
            function(permissionState) {
              return permissionState;
            }
          )

          .catch(
            function(error) {

              console.warn(
                'Motion permission error:',
                error
              );

              return 'denied';

            }
          );

      }

      return Promise.resolve(
        'granted'
      );

    }


    /* ========================================
       ENTER 360 SCENE
       ======================================== */

    function enter360Scene() {

      if (sceneStarted) {
        return;
      }

      sceneStarted = true;

      startButton.style.display =
        'none';

      fadeInMusic();

      loadingScreen.classList.add(
        'hide'
      );

      setTimeout(
        function() {

          loadingScreen.style.display =
            'none';

        },
        FADE_TIME
      );

      setTimeout(
        function() {

          showWishButton();

        },
        500
      );

    }


    /* ========================================
       START EXPERIENCE
       ======================================== */

    function start360Experience() {

      if (
        experienceStarting ||
        sceneStarted
      ) {
        return;
      }

      experienceStarting = true;

      startButton.disabled = true;

      const musicPromise =
        prepareBackgroundMusic();

      try {

        christmasVideo.muted = true;

        const videoPromise =
          christmasVideo.play();

        if (
          videoPromise &&
          videoPromise.catch
        ) {

          videoPromise.catch(
            function() {}
          );

        }

      }

      catch (error) {}


      requestMotionPermission()

        .then(
          function(permissionState) {

            if (
              permissionState ===
              'denied'
            ) {

              console.log(
                'Motion permission denied.'
              );

            }

            return musicPromise;

          }
        )

        .then(
          function() {

            enter360Scene();

          }
        )

        .catch(
          function(error) {

            console.warn(
              'Start experience error:',
              error
            );

            enter360Scene();

          }
        );

    }


    /* ========================================
       START BUTTON EVENT
       ======================================== */

    startButton.addEventListener(
      'click',
      function(event) {

        event.preventDefault();

        start360Experience();

      }
    );


    /* ========================================
       PAGE LOAD
       ======================================== */

    window.addEventListener(
      'load',
      function() {

        try {

          const loadingPromise =
            loadingVideo.play();

          if (
            loadingPromise &&
            loadingPromise.catch
          ) {

            loadingPromise.catch(
              function() {}
            );

          }

        }

        catch (error) {}


        try {

          backgroundMusic.load();

        }
        catch (error) {}


        /*
        360影片
        */

        setTimeout(

          function() {
            prepareChristmasVideo();
          },

          300

        );

      }

    );


    /* ========================================
       VIDEO READY FALLBACK
       ======================================== */

    const videoReadyTimer =
      setInterval(

        function() {

          if (
            christmasVideo.readyState >= 3
          ) {

            clearInterval(
              videoReadyTimer
            );

            markVideoReady();

          }

        },

        300

      );


    /* ========================================
       PINCH ZOOM
       ======================================== */

    let pinchStartDistance =
      null;

    let pinchStartFov =
      currentFov;


    function getTouchDistance(
      touch1,
      touch2
    ) {

      const dx =
        touch1.clientX -
        touch2.clientX;

      const dy =
        touch1.clientY -
        touch2.clientY;

      return Math.sqrt(
        dx * dx +
        dy * dy
      );

    }


    /* ========================================
       CHECK WISH UI
       ======================================== */

    function isWishUI(
      target
    ) {

      if (
        !target ||
        !target.closest
      ) {
        return false;
      }

      return !!target.closest(
        '#wishButton, #wishOverlay'
      );

    }


    /* ========================================
       PINCH START
       ======================================== */

    document.addEventListener(

      'touchstart',

      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }

        if (
          event.touches.length === 2
        ) {

          pinchStartDistance =
            getTouchDistance(
              event.touches[0],
              event.touches[1]
            );

          pinchStartFov =
            currentFov;

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       PINCH MOVE
       ======================================== */

    document.addEventListener(

      'touchmove',

      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }

        if (
          event.touches.length === 2 &&
          pinchStartDistance
        ) {

          event.preventDefault();

          const currentDistance =
            getTouchDistance(
              event.touches[0],
              event.touches[1]
            );

          const ratio =
            pinchStartDistance /
            currentDistance;

          let newFov =
            pinchStartFov *
            ratio;

          newFov =
            Math.max(
              minFov,
              Math.min(
                maxFov,
                newFov
              )
            );

          currentFov =
            newFov;

          camera.setAttribute(
            'camera',
            'fov',
            currentFov
          );

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       PINCH END
       ======================================== */

    document.addEventListener(

      'touchend',

      function(event) {

        if (
          event.touches.length < 2
        ) {

          pinchStartDistance =
            null;

        }

      },

      {
        passive: false
      }

    );


    /* ========================================
       DESKTOP MOUSE WHEEL ZOOM
       ======================================== */

    document.addEventListener(

      'wheel',

      function(event) {

        if (
          isWishUI(
            event.target
          )
        ) {
          return;
        }

        event.preventDefault();

        currentFov +=
          event.deltaY *
          0.03;

        currentFov =
          Math.max(
            minFov,
            Math.min(
              maxFov,
              currentFov
            )
          );

        camera.setAttribute(
          'camera',
          'fov',
          currentFov
        );

      },

      {
        passive: false
      }

    );


    /* ========================================
       SHOW WISH BUTTON
       ======================================== */

    function showWishButton() {

      wishButton.style.display =
        'flex';

      requestAnimationFrame(

        function() {

          requestAnimationFrame(

            function() {

              wishButton.classList.add(
                'show'
              );

            }

          );

        }

      );

    }


    /* ========================================
       LOOK CONTROLS
       ======================================== */

    function setLookControls(
      enabled
    ) {

      if (!camera) {
        return;
      }

      camera.setAttribute(
        'look-controls',
        'enabled',
        enabled
      );

    }


    /* ========================================
       OPEN WISH PANEL
       ======================================== */

    function openWishPanel() {

      if (wishPanelOpen) {
        return;
      }

      wishPanelOpen =
        true;

      /*
      暫停360°拖動，
      避免填寫願望時背景跟住郁。
      */

      setLookControls(
        false
      );

      wishOverlay.style.display =
        'flex';

      wishOverlay.setAttribute(
        'aria-hidden',
        'false'
      );

      requestAnimationFrame(

        function() {

          wishOverlay.classList.add(
            'open'
          );

        }

      );

      setTimeout(

        function() {
          wishText.focus();
        },

        180

      );

    }


    /* ========================================
       CLOSE WISH PANEL
       ======================================== */

    function closeWishPanel(
      callback
    ) {

      if (!wishPanelOpen) {

        if (callback) {
          callback();
        }

        return;

      }

      wishPanelOpen =
        false;

      wishOverlay.classList.remove(
        'open'
      );

      wishOverlay.setAttribute(
        'aria-hidden',
        'true'
      );

      setTimeout(

        function() {

          wishOverlay.style.display =
            'none';

          setLookControls(
            true
          );

          if (callback) {
            callback();
          }

        },

        260

      );

    }


    /* ========================================
       WISH TEXT COUNTER
       ======================================== */

    function updateWishCount() {

      const length =
        wishText.value.length;

      wishCount.textContent =
        length +
        ' / ' +
        WISH_MAX_LENGTH;

    }


    wishText.addEventListener(
      'input',
      updateWishCount
    );


    /* ========================================
       WISH BUTTON
       ======================================== */

    wishButton.addEventListener(

      'click',

      function(event) {

        event.preventDefault();

        openWishPanel();

      }

    );


    /* ========================================
       CANCEL WISH
       ======================================== */

    wishCancel.addEventListener(

      'click',

      function(event) {

        event.preventDefault();

        closeWishPanel();

      }

    );


    /* ========================================
       CLICK OUTSIDE PANEL
       ======================================== */

    wishOverlay.addEventListener(

      'click',

      function(event) {

        if (
          event.target ===
          wishOverlay
        ) {

          closeWishPanel();

        }

      }

    );


    /* ========================================
       RANDOM ID
       ======================================== */

    function randomId() {

      return (

        Date.now()
          .toString(36) +

        '-' +

        Math.random()
          .toString(36)
          .slice(2, 10)

      );

    }


    /* ========================================
       DEVICE ID
       ======================================== */

    function getDeviceId() {

      const key =
        'christmas360_device_id';

      try {

        let id =
          localStorage.getItem(
            key
          );

        if (!id) {

          id =
            randomId();

          localStorage.setItem(
            key,
            id
          );

        }

        return id;

      }

      catch (error) {

        return randomId();

      }

    }


    /* ========================================
       CREATE WISH STAR
       最多同時保留 5 粒星星
       ======================================== */

    const MAX_WISH_STARS = 5;

    const wishStars = [];

    let nextWishStarSlot = 0;


    /*
    5 粒星星的固定位置。

    全部以你設定的：
    Yaw   = 2.04°
    Pitch = 30.89°

    作為中心。

    所以5粒星星會分散在
    大星星附近，而不會全部重疊。
    */

    const WISH_STAR_OFFSETS = [

      {
        yaw: -7.0,
        pitch: -1.5
      },

      {
        yaw: -3.5,
        pitch: 2.0
      },

      {
        yaw: 0.0,
        pitch: 0.0
      },

      {
        yaw: 3.5,
        pitch: 2.2
      },

      {
        yaw: 7.0,
        pitch: -1.0
      }

    ];


    /* ========================================
       REMOVE OLD WISH STAR
       ======================================== */

    function removeWishStar(
      record,
      duration = 700
    ) {

      if (
        !record ||
        !record.star ||
        record.removing
      ) {
        return;
      }

      record.removing =
        true;

      const star =
        record.star;

      const material =
        star.material;

      const startOpacity =
        material.opacity;

      const startTime =
        performance.now();


      function fade(now) {

        const t =
          Math.min(
            (
              now -
              startTime
            ) /
            duration,
            1
          );

        material.opacity =
          startOpacity *
          (1 - t);

        if (
          t < 1
        ) {

          requestAnimationFrame(
            fade
          );

        }

        else {

          if (
            star.parent
          ) {

            star.parent.remove(
              star
            );

          }

          if (
            material.map
          ) {

            material.map.dispose();

          }

          material.dispose();

        }

      }


      requestAnimationFrame(
        fade
      );

    }


    /* ========================================
       CREATE ONE 5-POINT STAR
       ======================================== */

    function createWishStar() {

      if (
        !sceneEl ||
        !sceneEl.object3D ||
        !sceneEl.camera
      ) {

        console.warn(
          '360 scene / camera not ready.'
        );

        return;

      }


      const threeCamera =
        sceneEl.camera;

      threeCamera.updateMatrixWorld(
        true
      );


      /*
      星星由使用者目前看到的位置
      稍低的位置開始升上去。
      */

      const cameraPosition =
        new THREE.Vector3();

      threeCamera.getWorldPosition(
        cameraPosition
      );


      const viewDirection =
        new THREE.Vector3();

      threeCamera.getWorldDirection(
        viewDirection
      );

      viewDirection.normalize();


      const startPosition =
        cameraPosition
          .clone()
          .addScaledVector(
            viewDirection,
            3.5
          );

      startPosition.y -=
        1.15;


      /*
      如果天空已經有5粒，
      第6粒出現之前，
      先移除最舊的一粒。
      */

      if (
        wishStars.length >=
        MAX_WISH_STARS
      ) {

        const oldest =
          wishStars.shift();

        removeWishStar(
          oldest,
          700
        );

      }


      /*
      選擇5個位置其中一個。
      */

      const slot =
        nextWishStarSlot;

      nextWishStarSlot =
        (
          nextWishStarSlot +
          1
        ) %
        MAX_WISH_STARS;


      const offset =
        WISH_STAR_OFFSETS[
          slot
        ];


      /*
      以你目前指定的大星星位置：

      BIG_STAR_YAW   = 2.04°
      BIG_STAR_PITCH = 30.89°

      加上每粒星星的小偏移。
      */

      const targetYaw =
        BIG_STAR_YAW +
        THREE.MathUtils.degToRad(
          offset.yaw
        );


      const targetPitch =
        BIG_STAR_PITCH +
        THREE.MathUtils.degToRad(
          offset.pitch
        );


      const targetDirection =
        new THREE.Vector3(

          -Math.sin(
            targetYaw
          ) *
          Math.cos(
            targetPitch
          ),

          Math.sin(
            targetPitch
          ),

          -Math.cos(
            targetYaw
          ) *
          Math.cos(
            targetPitch
          )

        ).normalize();


      /*
      ★ 重要 ★

      星星的最終位置直接固定
      在360°世界座標。

      所以手機轉動時，
      星星不會跟著Camera移動。
      */

      const endPosition =
        targetDirection
          .clone()
          .multiplyScalar(
            18
          );


      /* ========================================
         DRAW STAR TEXTURE
         ======================================== */

      const starCanvas =
        document.createElement(
          'canvas'
        );

      starCanvas.width =
        256;

      starCanvas.height =
        256;


      const ctx =
        starCanvas.getContext(
          '2d'
        );

      if (!ctx) {
        return;
      }


      ctx.clearRect(
        0,
        0,
        256,
        256
      );


      /*
      金色柔光
      */

      const glow =
        ctx.createRadialGradient(
          128,
          128,
          8,
          128,
          128,
          120
        );


      glow.addColorStop(
        0,
        'rgba(255,245,180,0.95)'
      );

      glow.addColorStop(
        0.22,
        'rgba(255,220,90,0.55)'
      );

      glow.addColorStop(
        0.55,
        'rgba(255,190,40,0.18)'
      );

      glow.addColorStop(
        1,
        'rgba(255,180,20,0)'
      );


      ctx.fillStyle =
        glow;

      ctx.fillRect(
        0,
        0,
        256,
        256
      );


      /* ========================================
         DRAW FIVE-POINT STAR
         ======================================== */

      function drawFivePointStar(
        context,
        centerX,
        centerY,
        outerRadius,
        innerRadius
      ) {

        let rotation =
          -Math.PI / 2;

        const step =
          Math.PI / 5;


        context.beginPath();


        for (
          let i = 0;
          i < 10;
          i++
        ) {

          const radius =
            i % 2 === 0
              ? outerRadius
              : innerRadius;


          const x =
            centerX +
            Math.cos(
              rotation
            ) *
            radius;


          const y =
            centerY +
            Math.sin(
              rotation
            ) *
            radius;


          if (
            i === 0
          ) {

            context.moveTo(
              x,
              y
            );

          }

          else {

            context.lineTo(
              x,
              y
            );

          }


          rotation +=
            step;

        }


        context.closePath();

      }


      drawFivePointStar(
        ctx,
        128,
        128,
        66,
        28
      );


      ctx.shadowColor =
        'rgba(255,220,80,0.95)';

      ctx.shadowBlur =
        18;


      const starGradient =
        ctx.createLinearGradient(
          128,
          62,
          128,
          194
        );


      starGradient.addColorStop(
        0,
        '#fff7b0'
      );

      starGradient.addColorStop(
        0.45,
        '#ffd85a'
      );

      starGradient.addColorStop(
        1,
        '#e8a91f'
      );


      ctx.fillStyle =
        starGradient;

      ctx.fill();


      ctx.shadowBlur =
        0;

      ctx.lineWidth =
        3;

      ctx.strokeStyle =
        'rgba(255,245,190,0.95)';

      ctx.stroke();


      /* ========================================
         THREE.JS SPRITE
         ======================================== */

      const texture =
        new THREE.CanvasTexture(
          starCanvas
        );

      texture.needsUpdate =
        true;


      const material =
        new THREE.SpriteMaterial({

          map:
            texture,

          transparent:
            true,

          depthWrite:
            false,

          depthTest:
            false,

          opacity:
            0

        });


      const star =
        new THREE.Sprite(
          material
        );


      star.position.copy(
        startPosition
      );


      star.scale.set(
        1.15,
        1.15,
        1.15
      );


      star.renderOrder =
        9999;


      sceneEl.object3D.add(
        star
      );


      const record = {

        star:
          star,

        slot:
          slot,

        removing:
          false

      };


      wishStars.push(
        record
      );


      /* ========================================
         STAR RISE ANIMATION
         ======================================== */

      const RISE_TIME =
        2600;


      const animationStart =
        performance.now();


      function animate(now) {

        if (
          record.removing ||
          !star.parent
        ) {
          return;
        }


        const progress =
          Math.min(
            (
              now -
              animationStart
            ) /
            RISE_TIME,
            1
          );


        /*
        Ease Out Cubic
        */

        const eased =
          1 -
          Math.pow(
            1 - progress,
            3
          );


        star.position.lerpVectors(
          startPosition,
          endPosition,
          eased
        );


        /*
        開始時柔和Fade In
        */

        const fadeIn =
          Math.min(
            progress /
            0.18,
            1
          );


        /*
        輕微閃爍
        */

        const twinkle =
          0.92 +
          Math.sin(
            now *
            0.006 +
            slot
          ) *
          0.08;


        material.opacity =
          fadeIn *
          twinkle;


        /*
        星星升上去時
        慢慢變大。
        */

        const scale =
          1.15 +
          1.25 *
          eased;


        star.scale.set(
          scale,
          scale,
          scale
        );


        if (
          progress < 1
        ) {

          requestAnimationFrame(
            animate
          );

        }

        else {

          /*
          到達天空後，
          固定於最終世界座標。
          */

          star.position.copy(
            endPosition
          );


          star.scale.set(
            2.4,
            2.4,
            2.4
          );


          material.opacity =
            1;


          /*
          不再自動消失，
          保持在天空，
          直至第6粒出現時才移除最舊一粒。
          */

          animateTwinkle();

        }

      }


      /* ========================================
         STAR TWINKLE AFTER ARRIVAL
         ======================================== */

      function animateTwinkle() {

        if (
          record.removing ||
          !star.parent
        ) {
          return;
        }


        const now =
          performance.now();


        material.opacity =
          0.90 +
          Math.sin(
            now *
            0.0035 +
            slot
          ) *
          0.10;


        requestAnimationFrame(
          animateTwinkle
        );

      }


      requestAnimationFrame(
        animate
      );

    }


    /* ========================================
       ONE WISH = ONE STAR
       ======================================== */

    function createWishStarBurst() {

      createWishStar();

    }


    /* ========================================
       SEND WISH TO GOOGLE SHEET
       ======================================== */

    function sendWishToGoogleSheet(
      wish
    ) {

      if (!WISH_ENDPOINT) {
        return;
      }

      try {

        const data =
          new URLSearchParams();


        data.append(
          'wish',
          wish
        );


        data.append(
          'deviceId',
          getDeviceId()
        );


        data.append(

          'timestamp',

          new Date()
            .toISOString()

        );


        fetch(

          WISH_ENDPOINT,

          {

            method:
              'POST',

            mode:
              'no-cors',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              data.toString(),

            keepalive:
              true

          }

        )

        .catch(

          function(error) {

            console.warn(
              'Wish upload failed:',
              error
            );

          }

        );

      }

      catch (error) {

        console.warn(
          'Wish upload error:',
          error
        );

      }

    }
    /* ========================================
       SHOW WISH SUCCESS TOAST
       ======================================== */

    function showWishToast() {

      if (wishToastTimer) {

        clearTimeout(
          wishToastTimer
        );

      }


      wishToast.classList.add(
        'show'
      );


      wishToastTimer =
        setTimeout(

          function() {

            wishToast.classList.remove(
              'show'
            );

          },

          3200

        );

    }


    /* ========================================
       SUBMIT WISH
       ======================================== */

    wishSubmit.addEventListener(

      'click',

      function(event) {

        event.preventDefault();


        const wish =
          wishText.value
            .trim();


        /*
        如果沒有輸入願望
        */

        if (!wish) {

          wishNote.textContent =
            '請輸入你的願望。 Please enter your wish.';

          wishText.focus();

          return;

        }


        /*
        限制最多60個字
        */

        if (
          wish.length >
          WISH_MAX_LENGTH
        ) {

          wishNote.textContent =
            '願望最多60個字。 Maximum 60 characters.';

          wishText.focus();

          return;

        }


        /*
        避免重複按送出
        */

        wishSubmit.disabled =
          true;


        /*
        傳送願望到 Google Sheet
        */

        sendWishToGoogleSheet(
          wish
        );


        /*
        清空文字框
        */

        wishText.value =
          '';

        updateWishCount();


        /*
        關閉許願視窗
        */

        closeWishPanel(

          function() {

            /*
            ★ 每成功許願一次
            ★ 只產生一粒星星
            */

            createWishStarBurst();


            /*
            顯示成功訊息
            */

            showWishToast();


            /*
            重新允許送出
            */

            setTimeout(

              function() {

                wishSubmit.disabled =
                  false;

              },

              600

            );

          }

        );

      }

    );


    /* ========================================
       ENTER KEY / KEYBOARD
       ======================================== */

    wishText.addEventListener(

      'keydown',

      function(event) {

        /*
        手機輸入時，
        不使用 Enter 直接送出，
        避免誤觸。
        */

        if (
          event.key ===
          'Escape'
        ) {

          closeWishPanel();

        }

      }

    );


    /* ========================================
       PREVENT TOUCH PROPAGATION
       INSIDE WISH PANEL
       ======================================== */

    wishPanel.addEventListener(

      'touchstart',

      function(event) {

        event.stopPropagation();

      },

      {
        passive: true
      }

    );


    wishPanel.addEventListener(

      'touchmove',

      function(event) {

        event.stopPropagation();

      },

      {
        passive: true
      }

    );


    /* ========================================
       RESET NOTE WHEN TYPING
       ======================================== */

    wishText.addEventListener(

      'input',

      function() {

        wishNote.textContent =
          '願望最多60個字。 Maximum 60 characters.';

      }

    );


    /* ========================================
       PREVENT DOUBLE TAP ZOOM
       ON UI BUTTONS
       ======================================== */

    [
      startButton,
      wishButton,
      wishCancel,
      wishSubmit
    ].forEach(

      function(element) {

        if (!element) {
          return;
        }


        element.addEventListener(

          'touchend',

          function(event) {

            event.stopPropagation();

          },

          {
            passive: true
          }

        );

      }

    );


    /* ========================================
       HANDLE VISIBILITY CHANGE
       ======================================== */

    document.addEventListener(

      'visibilitychange',

      function() {

        /*
        如果使用者切換App／Safari分頁，
        回來後嘗試繼續播放360影片。
        */

        if (
          document.visibilityState ===
          'visible' &&
          sceneStarted
        ) {

          try {

            const videoPromise =
              christmasVideo.play();


            if (
              videoPromise &&
              videoPromise.catch
            ) {

              videoPromise.catch(
                function() {}
              );

            }

          }

          catch (error) {}


          /*
          音樂如果已經成功啟動，
          亦嘗試繼續播放。
          */

          if (
            musicStarted
          ) {

            try {

              const musicPromise =
                backgroundMusic.play();


              if (
                musicPromise &&
                musicPromise.catch
              ) {

                musicPromise.catch(
                  function() {}
                );

              }

            }

            catch (error) {}

          }

        }

      }

    );


    /* ========================================
       ORIENTATION CHANGE
       ======================================== */

    window.addEventListener(

      'orientationchange',

      function() {

        setTimeout(

          function() {

            window.dispatchEvent(
              new Event(
                'resize'
              )
            );

          },

          250

        );

      }

    );


    /* ========================================
       INITIAL WISH COUNT
       ======================================== */

    updateWishCount();


    /* ========================================
       SAFETY FALLBACK

       如果部分手機影片載入事件沒有正常觸發，
       最遲仍會顯示進入按鈕。
       ======================================== */

    setTimeout(

      function() {

        if (
          !sceneStarted &&
          !experienceStarting
        ) {

          showEnterButton();

        }

      },

      7000

    );


  </script>
