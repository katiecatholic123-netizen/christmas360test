<!DOCTYPE html>
<html>
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Christmas 360</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

    }


    /* ==============================
       A-FRAME
       ============================== */

    a-scene {

      width: 100%;
      height: 100%;

    }


    /* ==============================
       LOADING SCREEN
       ============================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;

      background: black;

      opacity: 1;

      visibility: visible;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;

    }


    #loadingScreen.hide {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    /* Loading Video */

    #loadingVideo {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: black;

    }


    /* ==============================
       START BUTTON
       ============================== */

    #startButton {

      position: fixed;

      left: 50%;
      bottom: 40px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 13px 26px;

      border: none;

      border-radius: 30px;

      background:
        rgba(255,255,255,0.92);

      color: #222;

      font-size: 16px;

      cursor: pointer;

      display: none;

    }


  </style>

</head>



<body>


  <!-- =====================================
       LOADING VIDEO
       ===================================== -->

  <div id="loadingScreen">

    <video

      id="loadingVideo"

      src="loading.mp4"

      autoplay

      muted

      loop

      playsinline

      webkit-playsinline

      preload="auto">

    </video>

  </div>



  <!-- =====================================
       FALLBACK PLAY BUTTON
       ===================================== -->

  <button id="startButton">
    Enter
  </button>



  <!-- =====================================
       360 SCENE
       ===================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    loading-screen="enabled: false">


    <!-- ==============================
         ASSETS
         ============================== -->

    <a-assets timeout="60000">


      <video

        id="christmasVideo"

        src="christmas360.mp4"

        muted

        loop

        playsinline

        webkit-playsinline

        preload="auto"

        crossorigin="anonymous">

      </video>


    </a-assets>



    <!-- ==============================
         360 VIDEO
         ============================== -->

    <a-videosphere

      id="videoSphere"

      src="#christmasVideo"

      rotation="0 -90 0"

      material="
        shader: flat;
        side: back;">

    </a-videosphere>



    <!-- ==============================
         CAMERA
         ============================== -->

    <a-camera

      id="camera"

      position="0 0 0"

      camera="fov: 105"

      look-controls="
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;">

    </a-camera>


  </a-scene>



  <script>


    /* ==========================================
       ELEMENTS
       ========================================== */


    const loadingScreen =
      document.querySelector('#loadingScreen');


    const loadingVideo =
      document.querySelector('#loadingVideo');


    const christmasVideo =
      document.querySelector('#christmasVideo');


    const startButton =
      document.querySelector('#startButton');


    const camera =
      document.querySelector('#camera');




    /* ==========================================
       LOADING VIDEO
       ========================================== */


    loadingVideo.muted = true;


    loadingVideo.play().catch(() => {

      /*
        如果 Safari 阻止 loading autoplay，
        第一次觸碰畫面時再播放。
      */

    });




    /* ==========================================
       HIDE LOADING SCREEN
       ========================================== */


    let enteredScene = false;


    function enterChristmasScene() {


      if (enteredScene) {
        return;
      }


      enteredScene = true;


      christmasVideo.muted = true;


      const playPromise =
        christmasVideo.play();



      if (playPromise !== undefined) {


        playPromise

          .then(() => {


            /*
              360影片已真正開始播放。

              稍等一點點，
              再 Fade Out Loading。
            */


            setTimeout(() => {


              loadingScreen.classList.add('hide');


              startButton.style.display =
                'none';


              /*
                Fade Out 完成後，
                停止 Loading Video，
                節省手機資源。
              */


              setTimeout(() => {


                loadingVideo.pause();


              }, 900);


            }, 250);


          })


          .catch(() => {


            /*
              如果 Safari 阻止360影片播放，
              Loading畫面保持顯示，
              並顯示 Enter 按鈕。
            */


            enteredScene = false;


            startButton.style.display =
              'block';


          });


      }


    }




    /* ==========================================
       CHECK 360 VIDEO
       ========================================== */


    function checkVideoReady() {


      /*
        readyState >= 3

        代表影片已經有足夠資料
        可以開始播放。
      */


      if (
        christmasVideo.readyState >= 3
      ) {


        enterChristmasScene();


      }


    }




    /* ==========================================
       VIDEO READY EVENTS
       ========================================== */


    christmasVideo.addEventListener(

      'canplay',

      checkVideoReady

    );


    christmasVideo.addEventListener(

      'canplaythrough',

      checkVideoReady

    );




    /* 如果影片非常快已經載好 */


    window.addEventListener(

      'load',

      function() {


        setTimeout(

          checkVideoReady,

          300

        );


      }

    );




    /* ==========================================
       FALLBACK ENTER BUTTON
       ========================================== */


    startButton.addEventListener(

      'click',

      function() {


        christmasVideo.muted = true;


        christmasVideo.play()

          .then(() => {


            loadingScreen.classList.add('hide');


            startButton.style.display =
              'none';


            setTimeout(() => {


              loadingVideo.pause();


            }, 900);


          });


      }

    );




    /* ==========================================
       FIRST TOUCH
       ========================================== */


    document.addEventListener(

      'touchstart',

      function() {


        /* Loading Video */


        if (loadingVideo.paused) {


          loadingVideo.muted = true;


          loadingVideo.play()
            .catch(() => {});


        }



        /* 360 Video */


        if (
          christmasVideo.readyState >= 2 &&
          christmasVideo.paused
        ) {


          christmasVideo.muted = true;


          christmasVideo.play()
            .catch(() => {});


        }


      },

      {
        once: true
      }

    );




    /* ==========================================
       PINCH ZOOM
       ========================================== */


    let currentFov = 105;


    const minFov = 35;

    const maxFov = 120;


    let previousDistance = null;




    /* ---------- Pinch Start ---------- */


    document.addEventListener(

      'touchstart',

      function(event) {


        if (
          event.touches.length === 2
        ) {


          const dx =

            event.touches[0].clientX -

            event.touches[1].clientX;



          const dy =

            event.touches[0].clientY -

            event.touches[1].clientY;



          previousDistance =

            Math.sqrt(

              dx * dx +

              dy * dy

            );


        }


      },

      {
        passive: false
      }

    );




    /* ---------- Pinch Zoom ---------- */


    document.addEventListener(

      'touchmove',

      function(event) {


        if (
          event.touches.length !== 2
        ) {

          return;

        }


        event.preventDefault();



        const dx =

          event.touches[0].clientX -

          event.touches[1].clientX;



        const dy =

          event.touches[0].clientY -

          event.touches[1].clientY;



        const distance =

          Math.sqrt(

            dx * dx +

            dy * dy

          );



        if (
          previousDistance !== null
        ) {


          const difference =

            distance -

            previousDistance;



          /*
            手指拉開
            → Zoom In
          */


          currentFov -=

            difference * 0.12;



          currentFov =

            Math.max(

              minFov,

              Math.min(

                maxFov,

                currentFov

              )

            );



          camera.setAttribute(

            'camera',

            'fov',

            currentFov

          );


        }



        previousDistance =
          distance;


      },

      {
        passive: false
      }

    );




    /* ---------- Pinch End ---------- */


    document.addEventListener(

      'touchend',

      function(event) {


        if (
          event.touches.length < 2
        ) {


          previousDistance =
            null;


        }


      }

    );




    /* ==========================================
       DESKTOP MOUSE WHEEL ZOOM
       ========================================== */


    document.addEventListener(

      'wheel',

      function(event) {


        event.preventDefault();



        currentFov +=

          event.deltaY * 0.05;



        currentFov =

          Math.max(

            minFov,

            Math.min(

              maxFov,

              currentFov

            )

          );



        camera.setAttribute(

          'camera',

          'fov',

          currentFov

        );


      },

      {
        passive: false
      }

    );


  </script>


</body>
</html>
