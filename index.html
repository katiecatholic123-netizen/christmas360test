<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Christmas 360 Test</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>

<a-scene>
  
  <!-- 360° Christmas background -->
  <a-sky src="#christmas"></a-sky>

  <!-- Camera -->
  <a-camera
    position="0 1.6 0"
    look-controls="magicWindowTrackingEnabled: true">
  </a-camera>

  <a-assets>
    <img
      id="christmas"
      src="christmas360.jpg">
  </a-assets>

</a-scene>

</body>
</html>
